<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Canvas Test - WASM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f0f23;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 { color: #4ecdc4; margin-bottom: 20px; }
    #canvas-container canvas {
      border: 2px solid #4ecdc4;
      border-radius: 8px;
    }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #4ecdc4;
      font-family: monospace;
    }
    #error { color: #ff6b6b; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Minimal Canvas Test - Clean Language WASM</h1>
  <div id="canvas-container"></div>
  <div id="status">Loading...</div>
  <div id="error"></div>

  <script src="../canvas-bridge.js"></script>
  <script>
    async function loadAndRun() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');

      try {
        statusEl.textContent = 'Initializing...';
        const bridge = new CanvasBridge();
        const memory = new WebAssembly.Memory({ initial: 256, maximum: 512 });
        const bridgeImports = bridge.getImports(memory);

        let heapPtr = 1024 * 1024;
        function malloc(size) {
          const aligned = (heapPtr + 7) & ~7;
          heapPtr = aligned + size;
          return aligned;
        }

        // Helper to write string to WASM memory
        function writeString(str) {
          const bytes = new TextEncoder().encode(str);
          const ptr = malloc(bytes.length + 4);
          const view = new DataView(memory.buffer);
          view.setInt32(ptr, bytes.length, true);
          new Uint8Array(memory.buffer, ptr + 4, bytes.length).set(bytes);
          return ptr;
        }

        // Standard library stubs
        const stdlib = {
          // I/O
          print: (ptr) => console.log(bridge.readString(ptr, 1024)),
          printl: (ptr) => console.log(bridge.readString(ptr, 1024)),
          input: (ptr) => writeString(prompt(bridge.readString(ptr, 1024)) || ''),
          input_integer: (ptr) => parseInt(prompt(bridge.readString(ptr, 1024)) || '0'),
          input_float: (ptr) => parseFloat(prompt(bridge.readString(ptr, 1024)) || '0'),
          input_yesno: (ptr) => (prompt(bridge.readString(ptr, 1024)) || '').toLowerCase().startsWith('y') ? 1 : 0,
          input_range: (ptr, min, max) => Math.min(max, Math.max(min, parseInt(prompt(bridge.readString(ptr, 1024)) || '0'))),

          // String operations
          float_to_string: (f) => writeString(f.toString()),
          string_to_float: (ptr) => parseFloat(bridge.readString(ptr, 1024)) || 0,
          'string.concat': (a, b) => writeString(bridge.readString(a, 1024) + bridge.readString(b, 1024)),
          'string.split': (ptr, delim) => 0, // stub
          string_trim: (ptr) => writeString(bridge.readString(ptr, 1024).trim()),
          string_trim_start: (ptr) => writeString(bridge.readString(ptr, 1024).trimStart()),
          string_trim_end: (ptr) => writeString(bridge.readString(ptr, 1024).trimEnd()),
          string_compare: (a, b) => bridge.readString(a, 1024).localeCompare(bridge.readString(b, 1024)),
          string_replace: (ptr, from, to) => writeString(bridge.readString(ptr, 1024).replace(bridge.readString(from, 1024), bridge.readString(to, 1024))),

          // HTTP stubs (not needed for canvas)
          http_get: () => 0, http_post: () => 0, http_put: () => 0, http_patch: () => 0,
          http_delete: () => 0, http_head: () => 0, http_options: () => 0,
          http_get_with_headers: () => 0, http_post_with_headers: () => 0,
          http_post_json: () => 0, http_put_json: () => 0, http_patch_json: () => 0,
          http_post_form: () => 0, http_set_user_agent: () => 0, http_set_timeout: () => 0,
          http_set_max_redirects: () => 0, http_enable_cookies: () => 0,
          http_get_response_code: () => 0, http_get_response_headers: () => 0,
          http_encode_url: (ptr) => ptr, http_decode_url: (ptr) => ptr, http_build_query: () => 0,

          // File stubs
          file_write: () => 0, file_read: () => 0, file_exists: () => 0,
          file_delete: () => 0, file_append: () => 0,

          // Math functions
          math_sin: Math.sin, math_cos: Math.cos, math_tan: Math.tan,
          math_asin: Math.asin, math_acos: Math.acos, math_atan: Math.atan,
          math_atan2: Math.atan2, math_sinh: Math.sinh, math_cosh: Math.cosh,
          math_tanh: Math.tanh, math_sqrt: Math.sqrt, math_cbrt: Math.cbrt,
          math_pow: Math.pow, math_exp: Math.exp, math_exp2: (x) => Math.pow(2, x),
          math_log: Math.log, math_ln: Math.log, math_log10: Math.log10, math_log2: Math.log2,
          math_floor: Math.floor, math_ceil: Math.ceil, math_round: Math.round,
          math_trunc: Math.trunc, math_abs: Math.abs, math_sign: Math.sign,
          math_min: Math.min, math_max: Math.max,
          math_random: Math.random,
          math_PI: () => Math.PI, math_E: () => Math.E,

          // Allocation
          _alloc: (size) => malloc(size),
          _alloc_string: (size) => malloc(size + 4),
        };

        // Debug: check what's in bridgeImports
        console.log('[DEBUG] bridgeImports.env keys:', Object.keys(bridgeImports.env));
        console.log('[DEBUG] has _canvas_request_frame:', '_canvas_request_frame' in bridgeImports.env);

        // Wrap functions to debug
        const originalRequestFrame = bridgeImports.env._canvas_request_frame;
        bridgeImports.env._canvas_request_frame = (canvasId) => {
          console.log('[DEBUG] _canvas_request_frame called with:', canvasId);
          return originalRequestFrame(canvasId);
        };

        let clearColorCallCount = 0;
        const originalClearColor = bridgeImports.env._canvas_clear_color;
        bridgeImports.env._canvas_clear_color = (canvasId, colorPtr, colorLen) => {
          if (clearColorCallCount < 3) {
            const color = bridge.readString(colorPtr, colorLen);
            console.log('[DEBUG] _canvas_clear_color:', JSON.stringify({ canvasId, colorPtr, colorLen, color }));
            clearColorCallCount++;
          }
          return originalClearColor(canvasId, colorPtr, colorLen);
        };

        let circleCallCount = 0;
        const originalCircle = bridgeImports.env._canvas_circle_filled;
        bridgeImports.env._canvas_circle_filled = (canvasId, x, y, radius, colorPtr, colorLen) => {
          if (circleCallCount < 3) {
            const color = bridge.readString(colorPtr, colorLen);
            console.log('[DEBUG] _canvas_circle_filled:', JSON.stringify({ canvasId, x, y, radius, colorPtr, colorLen, color }));
            circleCallCount++;
          }
          return originalCircle(canvasId, x, y, radius, colorPtr, colorLen);
        };

        const imports = {
          env: {
            memory: memory,
            ...stdlib,
            ...bridgeImports.env,
          },
          memory_runtime: {
            mem_alloc: (size) => malloc(size),
            mem_retain: (ptr) => ptr,
            mem_release: (ptr) => {},
            mem_scope_push: () => {},
            mem_scope_pop: () => {},
          }
        };

        statusEl.textContent = 'Loading WASM...';
        const response = await fetch('minimal-test.wasm');
        const wasmBytes = await response.arrayBuffer();
        statusEl.textContent = `Instantiating (${wasmBytes.byteLength} bytes)...`;

        const { instance } = await WebAssembly.instantiate(wasmBytes, imports);
        bridge.setWasmInstance(instance);

        // IMPORTANT: Use WASM's exported memory, not the one we created
        if (instance.exports.memory) {
          bridge.memory = instance.exports.memory;
          console.log('[WASM] Using exported memory');
        }

        statusEl.textContent = 'Starting...';

        // Log all exports
        console.log('[WASM] Exports:', Object.keys(instance.exports));
        console.log('[WASM] Has _frame_callback:', '_frame_callback' in instance.exports);
        console.log('[WASM] wasmInstance set:', bridge.wasmInstance === instance);

        if (instance.exports._start) {
          console.log('[WASM] Calling _start');
          try {
            instance.exports._start();
            console.log('[WASM] _start completed successfully');
          } catch (e) {
            console.error('[WASM] _start threw error:', e);
          }
        } else if (instance.exports.start) {
          console.log('[WASM] Calling start');
          instance.exports.start();
        }

        statusEl.textContent = 'Running';

        // Test manually calling _frame_callback
        setTimeout(() => {
          if (instance.exports._frame_callback) {
            console.log('[WASM] Testing _frame_callback manually');
            try {
              instance.exports._frame_callback(1);
              console.log('[WASM] _frame_callback succeeded');
            } catch (e) {
              console.error('[WASM] _frame_callback error:', e);
            }
          }
        }, 500);

      } catch (error) {
        console.error('[WASM] Error:', error);
        statusEl.textContent = 'Error';
        errorEl.textContent = error.message;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAndRun);
  </script>
</body>
</html>

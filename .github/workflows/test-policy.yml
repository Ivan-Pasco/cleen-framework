name: Test policy guard

# Runs scripts/check-test-placeholders.py to block placeholder .cln tests
# from landing. Fires on every PR and push to main so doc-only PRs are
# still gated. The historical `system-documents/testing/TEST_STRATEGY.md`
# gate was dropped in July 2026 (doc was never checked in); the script's
# rule list is self-contained.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder-guard:
    name: Placeholder guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure conventions doc is present
        run: test -f tests/CONVENTIONS.md

      - name: Ensure PENDING.md is present
        run: test -f tests/PENDING.md

      - name: Run placeholder guard
        run: python3 scripts/check-test-placeholders.py

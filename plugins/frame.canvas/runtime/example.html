<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Canvas Bridge Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #4ecca3;
    }

    #canvas-container {
      border: 2px solid #4ecca3;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #canvas-container canvas {
      display: block;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #4ecca3;
      color: #1a1a2e;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #3db892;
    }

    .info {
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      max-width: 600px;
    }

    .info p {
      margin: 5px 0;
    }

    .info span {
      color: #4ecca3;
    }
  </style>
</head>
<body>
  <h1>Clean Canvas Bridge Test</h1>

  <div id="canvas-container"></div>

  <div class="controls">
    <button onclick="runDemo('shapes')">Shapes Demo</button>
    <button onclick="runDemo('animation')">Animation Demo</button>
    <button onclick="runDemo('transforms')">Transforms Demo</button>
    <button onclick="stopDemo()">Stop</button>
  </div>

  <div class="info">
    <p><span>Status:</span> <span id="status">Ready</span></p>
    <p><span>FPS:</span> <span id="fps">-</span></p>
    <p><span>Mouse:</span> (<span id="mouseX">0</span>, <span id="mouseY">0</span>)</p>
  </div>

  <script src="canvas-bridge.js"></script>
  <script>
    // Create canvas bridge instance
    const bridge = new CanvasBridge();

    // Track state
    let canvasId = null;
    let animating = false;
    let frameCount = 0;
    let lastFpsTime = performance.now();

    // Initialize canvas
    function initCanvas() {
      if (canvasId !== null) {
        // Clear existing canvas
        const container = document.getElementById('canvas-container');
        container.innerHTML = '';
        bridge.canvases.clear();
      }

      // Create mock memory for testing (in real usage, this comes from WASM)
      const memory = new WebAssembly.Memory({ initial: 1 });
      const imports = bridge.getImports(memory);

      // Initialize canvas via bridge
      canvasId = imports.env._canvas_init(600, 400);

      document.getElementById('status').textContent = `Canvas ${canvasId} initialized`;
    }

    // Helper: Write string to memory and return ptr/len
    function writeTestString(str) {
      const encoder = new TextEncoder();
      const bytes = encoder.encode(str);
      const ptr = 0; // Use beginning of memory for tests
      const view = new Uint8Array(bridge.memory.buffer, ptr, bytes.length);
      view.set(bytes);
      return { ptr, len: bytes.length };
    }

    // Demo: Basic shapes
    function shapesDemo() {
      if (canvasId === null) initCanvas();

      const imports = bridge.getImports(bridge.memory).env;

      // Clear with dark background
      const bg = writeTestString('#1a1a2e');
      imports._canvas_clear_color(canvasId, bg.ptr, bg.len);

      // Draw filled rectangle
      const green = writeTestString('#4ecca3');
      imports._canvas_rect_filled(canvasId, 50, 50, 150, 100, green.ptr, green.len);

      // Draw circle outline
      const blue = writeTestString('#3498db');
      imports._canvas_circle(canvasId, 350, 100, 60, blue.ptr, blue.len);

      // Draw filled circle
      const red = writeTestString('#e74c3c');
      imports._canvas_circle_filled(canvasId, 500, 100, 40, red.ptr, red.len);

      // Draw line
      const yellow = writeTestString('#f1c40f');
      imports._canvas_line(canvasId, 50, 250, 550, 350, 3, yellow.ptr, yellow.len);

      // Draw text
      const white = writeTestString('#ffffff');
      const text = writeTestString('Clean Canvas Bridge');
      imports._canvas_text(canvasId, text.ptr, text.len, 180, 220, 24, white.ptr, white.len);

      // Draw more shapes
      const purple = writeTestString('#9b59b6');
      imports._canvas_rect(canvasId, 400, 250, 150, 100, purple.ptr, purple.len);

      document.getElementById('status').textContent = 'Shapes demo rendered';
    }

    // Demo: Animation
    function animationDemo() {
      if (canvasId === null) initCanvas();

      animating = true;
      frameCount = 0;
      lastFpsTime = performance.now();

      const imports = bridge.getImports(bridge.memory).env;

      let angle = 0;
      let ballX = 300;
      let ballY = 200;
      let ballVX = 200;
      let ballVY = 150;

      function animate() {
        if (!animating) return;

        const dt = imports._canvas_get_delta_time();

        // Update
        angle += 90 * dt;
        ballX += ballVX * dt;
        ballY += ballVY * dt;

        // Bounce
        if (ballX < 20 || ballX > 580) ballVX *= -1;
        if (ballY < 20 || ballY > 380) ballVY *= -1;

        // Clear
        const bg = writeTestString('#1a1a2e');
        imports._canvas_clear_color(canvasId, bg.ptr, bg.len);

        // Draw rotating rectangle
        imports._canvas_save(canvasId);
        imports._canvas_translate(canvasId, 150, 200);
        imports._canvas_rotate(canvasId, angle);
        const cyan = writeTestString('#00bcd4');
        imports._canvas_rect_filled(canvasId, -40, -40, 80, 80, cyan.ptr, cyan.len);
        imports._canvas_restore(canvasId);

        // Draw bouncing ball
        const orange = writeTestString('#ff9800');
        imports._canvas_circle_filled(canvasId, ballX, ballY, 20, orange.ptr, orange.len);

        // Draw FPS
        const white = writeTestString('#ffffff');
        const fpsText = writeTestString(`FPS: ${Math.round(1 / Math.max(dt, 0.001))}`);
        imports._canvas_text(canvasId, fpsText.ptr, fpsText.len, 10, 25, 16, white.ptr, white.len);

        // Update FPS display
        frameCount++;
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
          document.getElementById('fps').textContent = frameCount;
          frameCount = 0;
          lastFpsTime = now;
        }

        // Update delta time manually for next frame
        bridge.lastFrameTime = performance.now();
        bridge.deltaTime = 0.016; // ~60fps

        requestAnimationFrame(animate);
      }

      // Start with initial delta time
      bridge.lastFrameTime = performance.now();
      bridge.deltaTime = 0.016;

      animate();
      document.getElementById('status').textContent = 'Animation running';
    }

    // Demo: Transforms
    function transformsDemo() {
      if (canvasId === null) initCanvas();

      animating = true;
      frameCount = 0;
      lastFpsTime = performance.now();

      const imports = bridge.getImports(bridge.memory).env;

      let time = 0;

      function animate() {
        if (!animating) return;

        const dt = imports._canvas_get_delta_time();
        time += dt;

        // Clear
        const bg = writeTestString('#1a1a2e');
        imports._canvas_clear_color(canvasId, bg.ptr, bg.len);

        // Draw multiple transformed shapes
        for (let i = 0; i < 6; i++) {
          imports._canvas_save(canvasId);

          // Position in a circle
          const cx = 300 + Math.cos(time + i * Math.PI / 3) * 120;
          const cy = 200 + Math.sin(time + i * Math.PI / 3) * 120;

          imports._canvas_translate(canvasId, cx, cy);
          imports._canvas_rotate(canvasId, time * 60 + i * 60);
          imports._canvas_scale(canvasId, 0.8 + Math.sin(time * 2 + i) * 0.2, 0.8 + Math.sin(time * 2 + i) * 0.2);

          // Color based on index
          const colors = ['#e74c3c', '#f39c12', '#2ecc71', '#3498db', '#9b59b6', '#1abc9c'];
          const color = writeTestString(colors[i]);
          imports._canvas_rect_filled(canvasId, -25, -25, 50, 50, color.ptr, color.len);

          imports._canvas_restore(canvasId);
        }

        // Center circle
        imports._canvas_save(canvasId);
        imports._canvas_translate(canvasId, 300, 200);
        imports._canvas_scale(canvasId, 1 + Math.sin(time * 3) * 0.3, 1 + Math.sin(time * 3) * 0.3);
        const white = writeTestString('#ffffff');
        imports._canvas_circle_filled(canvasId, 0, 0, 30, white.ptr, white.len);
        imports._canvas_restore(canvasId);

        // FPS
        const fpsText = writeTestString(`FPS: ${Math.round(1 / Math.max(dt, 0.001))}`);
        imports._canvas_text(canvasId, fpsText.ptr, fpsText.len, 10, 25, 16, white.ptr, white.len);

        // Update FPS display
        frameCount++;
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
          document.getElementById('fps').textContent = frameCount;
          frameCount = 0;
          lastFpsTime = now;
        }

        // Update delta time
        bridge.lastFrameTime = performance.now();
        bridge.deltaTime = 0.016;

        requestAnimationFrame(animate);
      }

      bridge.lastFrameTime = performance.now();
      bridge.deltaTime = 0.016;

      animate();
      document.getElementById('status').textContent = 'Transforms demo running';
    }

    // Run demo
    function runDemo(name) {
      stopDemo();
      switch (name) {
        case 'shapes':
          shapesDemo();
          break;
        case 'animation':
          animationDemo();
          break;
        case 'transforms':
          transformsDemo();
          break;
      }
    }

    // Stop demo
    function stopDemo() {
      animating = false;
      document.getElementById('status').textContent = 'Stopped';
      document.getElementById('fps').textContent = '-';
    }

    // Track mouse position
    document.addEventListener('mousemove', (e) => {
      document.getElementById('mouseX').textContent = Math.round(bridge.pointerX);
      document.getElementById('mouseY').textContent = Math.round(bridge.pointerY);
    });

    // Initialize on load
    window.addEventListener('load', () => {
      initCanvas();
      document.getElementById('status').textContent = 'Ready - click a demo button';
    });
  </script>
</body>
</html>

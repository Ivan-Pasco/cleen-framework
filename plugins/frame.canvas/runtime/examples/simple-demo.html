<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Language Canvas - Simple Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { color: #4ecca3; margin-bottom: 20px; font-size: 18px; }
    #canvas-container { border: 2px solid #333; border-radius: 8px; overflow: hidden; }
    #canvas-container canvas { display: block; }
    .info { margin-top: 20px; color: #666; font-size: 12px; text-align: center; }
    .info code { background: #1a1a2e; padding: 2px 6px; border-radius: 4px; color: #4ecca3; }
    #status { margin-top: 10px; color: #888; font-size: 14px; }
    .demos { margin-top: 20px; }
    .demos a { color: #4ecca3; margin: 0 10px; text-decoration: none; }
    .demos a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>100% Clean Language - Compiled to WebAssembly</h1>
  <div id="canvas-container"></div>
  <div id="status">Loading WASM...</div>
  <div class="info">
    Source: <code>simple-demo.cln</code> &rarr; <code>simple-demo.wasm</code>
  </div>
  <div class="demos">
    <a href="simple-demo.html">Simple Demo</a>
    <a href="index.html">Bouncing Ball</a>
  </div>

  <script>
    // =========================================================================
    // GLOBALS - Set after WASM loads
    // =========================================================================
    let memory = null;
    let heapPtr = 65536;
    const scopeStack = [];

    // =========================================================================
    // MEMORY RUNTIME - Uses WASM's exported memory
    // =========================================================================
    function mem_alloc(size) {
      size = (size + 7) & ~7;
      const ptr = heapPtr;
      heapPtr += size;
      new Uint8Array(memory.buffer, ptr, size).fill(0);
      return ptr;
    }

    function mem_retain(ptr) { return ptr; }
    function mem_release(ptr) {}
    function mem_scope_push() { scopeStack.push(heapPtr); }
    function mem_scope_pop() {
      if (scopeStack.length > 0) {
        heapPtr = scopeStack.pop();
      }
    }

    // =========================================================================
    // STRING HELPERS
    // =========================================================================

    // Read string using pointer + length (for expand_strings = true)
    function readStringWithLen(ptr, len) {
      if (ptr === 0 || len <= 0) return '';
      return new TextDecoder().decode(new Uint8Array(memory.buffer, ptr, len));
    }

    // Read string using length-prefixed format (standard Clean string format)
    function readString(ptr) {
      if (ptr === 0) return '';
      const view = new DataView(memory.buffer);
      const length = view.getInt32(ptr, true);
      if (length <= 0) return '';
      return new TextDecoder().decode(new Uint8Array(memory.buffer, ptr + 4, length));
    }

    function writeString(str) {
      const bytes = new TextEncoder().encode(str);
      const ptr = mem_alloc(4 + bytes.length);
      new DataView(memory.buffer).setInt32(ptr, bytes.length, true);
      new Uint8Array(memory.buffer, ptr + 4, bytes.length).set(bytes);
      return ptr;
    }

    // =========================================================================
    // CANVAS BRIDGE
    // =========================================================================
    const canvases = new Map();
    let nextCanvasId = 1;
    let deltaTime = 0.016;

    const canvasImports = {
      _canvas_init: (w, h) => {
        const id = nextCanvasId++;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        canvases.set(id, { el: canvas, ctx, w, h });
        document.getElementById('canvas-container').appendChild(canvas);
        console.log(`[Canvas] Initialized ${id}: ${w}x${h}`);
        return id;
      },

      _canvas_clear: (id) => {
        const c = canvases.get(id);
        if (c) c.ctx.clearRect(0, 0, c.w, c.h);
        return 0;
      },

      // expand_strings: (id, colorPtr, colorLen)
      _canvas_clear_color: (id, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        const color = readStringWithLen(colorPtr, colorLen);
        c.ctx.fillStyle = color;
        c.ctx.fillRect(0, 0, c.w, c.h);
        return 0;
      },

      _canvas_present: (id) => 0,

      // expand_strings: (id, x, y, r, colorPtr, colorLen)
      _canvas_circle: (id, x, y, r, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        const color = readStringWithLen(colorPtr, colorLen);
        c.ctx.beginPath();
        c.ctx.arc(x, y, r, 0, Math.PI * 2);
        c.ctx.strokeStyle = color;
        c.ctx.stroke();
        return 0;
      },

      // expand_strings: (id, x, y, r, colorPtr, colorLen)
      _canvas_circle_filled: (id, x, y, r, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        const color = readStringWithLen(colorPtr, colorLen);
        c.ctx.beginPath();
        c.ctx.arc(x, y, r, 0, Math.PI * 2);
        c.ctx.fillStyle = color;
        c.ctx.fill();
        return 0;
      },

      // expand_strings: (id, x, y, w, h, colorPtr, colorLen)
      _canvas_rect: (id, x, y, w, h, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        const color = readStringWithLen(colorPtr, colorLen);
        c.ctx.strokeStyle = color;
        c.ctx.strokeRect(x, y, w, h);
        return 0;
      },

      // expand_strings: (id, x, y, w, h, colorPtr, colorLen)
      _canvas_rect_filled: (id, x, y, w, h, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        const color = readStringWithLen(colorPtr, colorLen);
        c.ctx.fillStyle = color;
        c.ctx.fillRect(x, y, w, h);
        return 0;
      },

      // expand_strings: (id, x1, y1, x2, y2, stroke, colorPtr, colorLen)
      _canvas_line: (id, x1, y1, x2, y2, stroke, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        const color = readStringWithLen(colorPtr, colorLen);
        c.ctx.beginPath();
        c.ctx.moveTo(x1, y1);
        c.ctx.lineTo(x2, y2);
        c.ctx.strokeStyle = color;
        c.ctx.lineWidth = stroke;
        c.ctx.stroke();
        c.ctx.lineWidth = 1;
        return 0;
      },

      // expand_strings: (id, textPtr, textLen, x, y, size, colorPtr, colorLen)
      _canvas_text: (id, textPtr, textLen, x, y, size, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        const text = readStringWithLen(textPtr, textLen);
        const color = readStringWithLen(colorPtr, colorLen);
        c.ctx.font = `${size}px sans-serif`;
        c.ctx.fillStyle = color;
        c.ctx.fillText(text, x, y);
        return 0;
      },

      // expand_strings: (id, srcPtr, srcLen, x, y, w, h)
      _canvas_image: (id, srcPtr, srcLen, x, y, w, h) => 0,

      _canvas_save: (id) => {
        const c = canvases.get(id);
        if (c) c.ctx.save();
        return 0;
      },

      _canvas_restore: (id) => {
        const c = canvases.get(id);
        if (c) c.ctx.restore();
        return 0;
      },

      _canvas_translate: (id, x, y) => {
        const c = canvases.get(id);
        if (c) c.ctx.translate(x, y);
        return 0;
      },

      _canvas_rotate: (id, angle) => {
        const c = canvases.get(id);
        if (c) c.ctx.rotate(angle * Math.PI / 180);
        return 0;
      },

      _canvas_scale: (id, sx, sy) => {
        const c = canvases.get(id);
        if (c) c.ctx.scale(sx, sy);
        return 0;
      },

      _canvas_request_frame: (id) => 1,
      _canvas_cancel_frame: (id) => 0,
      _canvas_get_delta_time: () => deltaTime,
      _canvas_on_pointer: (id, cbPtr) => 0,
      _canvas_on_key: (id, cbPtr) => 0,
      _canvas_pointer_x: () => 0,
      _canvas_pointer_y: () => 0,
    };

    // =========================================================================
    // WASM LOADER
    // =========================================================================
    async function loadWasm() {
      const status = document.getElementById('status');

      try {
        status.textContent = 'Loading WASM...';
        const response = await fetch('simple-demo.wasm');
        const buffer = await response.arrayBuffer();
        console.log(`[WASM] Loaded ${buffer.byteLength} bytes`);

        status.textContent = 'Compiling...';

        // Build imports WITHOUT providing memory - WASM exports its own
        const imports = {
          env: {
            // Console I/O
            print: (ptr) => console.log(readString(ptr)),
            printl: (ptr) => console.log(readString(ptr)),

            // Input (stubs)
            input: (promptPtr) => 0,
            input_integer: (promptPtr) => 0,
            input_float: (promptPtr) => 0,
            input_yesno: (promptPtr) => 0,
            input_range: (a, b, c, d) => 0,

            // String operations
            float_to_string: (f) => writeString(f.toString()),
            string_to_float: (ptr) => parseFloat(readString(ptr)) || 0,
            'string.concat': (a, b) => writeString(readString(a) + readString(b)),
            'string.split': (a, b) => 0,
            string_trim: (ptr) => ptr,
            string_trim_start: (ptr) => ptr,
            string_trim_end: (ptr) => ptr,
            string_compare: (a, b) => 0,
            string_replace: (a, b, c) => a,

            // HTTP (stubs)
            http_get: (a, b) => 0,
            http_post: (a, b, c, d) => 0,
            http_put: (a, b, c, d) => 0,
            http_patch: (a, b, c, d) => 0,
            http_delete: (a, b) => 0,
            http_head: (a, b) => 0,
            http_options: (a, b) => 0,
            http_get_with_headers: (a, b, c, d) => 0,
            http_post_with_headers: (a, b, c, d, e, f) => 0,
            http_post_json: (a, b, c, d) => 0,
            http_put_json: (a, b, c, d) => 0,
            http_patch_json: (a, b, c, d) => 0,
            http_post_form: (a, b, c, d) => 0,
            http_set_user_agent: (a) => {},
            http_set_timeout: (a) => {},
            http_set_max_redirects: (a) => {},
            http_enable_cookies: (a) => {},
            http_get_response_code: () => 0,
            http_get_response_headers: () => 0,
            http_encode_url: (a, b) => a,
            http_decode_url: (a, b) => a,
            http_build_query: (a, b) => a,

            // File (stubs)
            file_write: (a, b, c, d) => 0,
            file_read: (a, b, c) => 0,
            file_exists: (a, b) => 0,
            file_delete: (a, b) => 0,
            file_append: (a, b, c, d) => 0,

            // Math
            math_pow: Math.pow,
            math_sin: Math.sin,
            math_cos: Math.cos,
            math_tan: Math.tan,
            math_asin: Math.asin,
            math_acos: Math.acos,
            math_atan: Math.atan,
            math_atan2: Math.atan2,
            math_sinh: Math.sinh,
            math_cosh: Math.cosh,
            math_tanh: Math.tanh,
            math_ln: Math.log,
            math_log10: Math.log10,
            math_log2: Math.log2,
            math_exp: Math.exp,
            math_exp2: (x) => Math.pow(2, x),

            // Canvas
            ...canvasImports,
          },

          memory_runtime: {
            mem_alloc,
            mem_retain,
            mem_release,
            mem_scope_push,
            mem_scope_pop,
          }
        };

        const { instance } = await WebAssembly.instantiate(buffer, imports);
        console.log('[WASM] Instantiated');

        // Get memory from WASM exports
        memory = instance.exports.memory;
        console.log('[WASM] Memory:', memory.buffer.byteLength, 'bytes');

        // Get heap pointer from WASM if exported
        if (instance.exports.__heap_ptr) {
          const heapGlobal = instance.exports.__heap_ptr;
          heapPtr = heapGlobal.value || 65536;
          console.log('[WASM] Heap starts at:', heapPtr);
        }

        status.textContent = 'Running...';

        if (instance.exports.start) {
          console.log('[WASM] Calling start()...');
          instance.exports.start();
          status.textContent = 'Done!';
          status.style.color = '#4ecca3';
        } else {
          status.textContent = 'Error: No start() function';
          status.style.color = '#ff6b6b';
        }

      } catch (err) {
        console.error('WASM Error:', err);
        status.textContent = `Error: ${err.message}`;
        status.style.color = '#ff6b6b';
      }
    }

    loadWasm();
  </script>
</body>
</html>

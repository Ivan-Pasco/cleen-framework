[plugin]
name = "frame.canvas"
version = "3.0.0"
description = "Canvas animation and rendering plugin for Clean Language — drawing, tweens, timelines, state machines, particles, path animation, audio, sprites, input, and effects. v3.0.0: plugin contracts v3 typed-emission complete — full typed AST emission, all 32 draw commands, 8 multi-instance expanders, 14 DSL body commands, DSL parsers, attribute helpers, scene state loops, validation, and complete dispatcher."
author = "Clean Language Team"
license = "MIT"

[compatibility]
# Landing C4 + Amendments 5, 6, 7, 8 all required (0.30.421 minimum).
min_compiler_version = "0.30.421"
# Plugin Contracts v2 — runtime-abi.md §4. ABI version stamped into WASM at
# compile time when built with --target=plugin; loader verifies it when present.
abi_version = "1.0.0"
# Plugin Contracts v3 — typed-emission.md §2.1.
# Atomic migration: this plugin.wasm will be v3-only once Sub-cycle 3 lands.
# emission_ops_hash verified against SHA-256 of
# foundation/spec/plugins/contracts/typed-emission-ops.toml at compiler 0.30.423.
expansion_version = "3.0.0"
emission_ops_hash = "60d06836a7068ee66a330e8c26ca59bc47cc44991b4f31d56e95e06c707eeaf0"

# Canvas/game workloads need frame-stable memory to avoid mid-frame grow stalls.
# Honored by compiler >= 0.30.57; older compilers silently use target defaults.
# See foundation/platform-architecture/MEMORY_POLICY.md §3 (canvas tier: 256 initial / 1024 max pages).
[memory]
tier = "canvas"

[lifecycle]
# Plugin Contracts v3 — typed-emission.md §7. Under atomic-migration, every
# declared slot MUST be a typed variant. frame.canvas emits scene stubs and
# helpers inline from expand_block_typed; module_helpers is a no-op placeholder
# — same shape as the v1 slot (see v1 comment in main.v1.cln for context on
# why per-scene state prevents a static module_helpers emission).
module_helpers_are_roots = true
module_helpers = "emit_module_helpers_typed"

[exports]
# v3 typed entry point — typed-emission.md §2.2.
expand = "expand_block_typed"
validate = "validate_block"
get_keywords = "get_keywords"

[handles]
# Only canvasScene is a top-level block the compiler expands directly.
# Sub-blocks (state, draw, onFrame, etc.) are nested inside canvasScene and
# must NOT be listed here — if they were, the compiler would expand them
# before calling expand_block_typed, stripping all sub-block headers from
# the body and making the canvasScene expansion unable to find them.
blocks = [
  "canvasScene",
]

# Per-block typed-emission declarations (typed-emission.md §2.1).
# version = 3 is required when expansion_version = "3.0.0".
[blocks.canvasScene]
expand = "expand_block_typed"
version = 3

[language]
# Block-level keywords that start a declaration
blocks = [
  "canvasScene",
  "assets",
  "layers",
  "state",
  "animSprite",
  "particles",
  "tween",
  "timeline",
  "animState",
  "path",
  "gradient",
  "customEase",
  "camera",
  "init",
  "draw",
  "onFrame",
  "onPointerDown",
  "onPointerMove",
  "onPointerUp",
  "onKeyDown",
  "onKeyUp",
  "onExit",
  "onPause",
  "onResume",
]

# Keywords used within plugin context
keywords = [
  # canvasScene attributes
  { name = "width", description = "Canvas width in pixels", context = "config" },
  { name = "height", description = "Canvas height in pixels", context = "config" },
  { name = "fps", description = "Target frames per second", context = "config" },
  { name = "background", description = "Background color", context = "config" },
  { name = "param", description = "Parameter name for event handler variable", context = "config" },

  # assets sub-block keywords
  { name = "image", description = "Load a static image asset", context = "block" },
  { name = "spritesheet", description = "Load a tiled spritesheet asset", context = "block" },
  { name = "sound", description = "Load a sound effect asset", context = "block" },
  { name = "music", description = "Load a music track asset", context = "block" },
  { name = "font", description = "Load a font asset for use with canvas.text font= attribute", context = "block" },
  { name = "frameWidth", description = "Width of a single spritesheet frame in pixels", context = "config" },
  { name = "frameHeight", description = "Height of a single spritesheet frame in pixels", context = "config" },
  { name = "cols", description = "Number of columns in a spritesheet grid", context = "config" },
  { name = "rows", description = "Number of rows in a spritesheet grid", context = "config" },
  { name = "src", description = "Asset source path relative to public/", context = "config" },

  # layers keywords
  { name = "layer", description = "Named render layer declaration inside layers: block", context = "block" },
  { name = "z", description = "Draw order for a named layer (lower = drawn first)", context = "config" },

  # state keywords
  { name = "state", description = "Persistent mutable variables block (inside canvasScene) or FSM state name", context = "both" },

  # animSprite keywords
  { name = "sheet", description = "Spritesheet reference for an animSprite clip", context = "config" },
  { name = "frames", description = "Frame range for animSprite (e.g. 0..7)", context = "config" },
  { name = "loop", description = "Whether the animation loops (true/false)", context = "config" },

  # tween keywords
  { name = "to", description = "Destination value for a tween variable (e.g. logoX from=-300 to=400)", context = "config" },
  { name = "from", description = "Starting value for a tween variable (omit to start from current value)", context = "config" },
  { name = "duration", description = "Tween or animation duration in seconds", context = "config" },
  { name = "ease", description = "Easing function name string (e.g. \"easeOutElastic\", \"snap\")", context = "config" },
  { name = "repeat", description = "Repeat count for a tween (-1 = infinite)", context = "config" },
  { name = "yoyo", description = "Reverse direction on each repeat (true/false)", context = "config" },
  { name = "delay", description = "Start delay in seconds before a tween begins", context = "config" },
  { name = "along", description = "Named path reference for path-following tween", context = "config" },
  { name = "orient", description = "Orient object to follow path direction (true/false)", context = "config" },
  { name = "onComplete", description = "Tween or timeline completion callback (state name or expression)", context = "config" },

  # timeline keywords
  { name = "at", description = "Absolute time position in a timeline (seconds from start)", context = "block" },
  { name = "after", description = "Relative time after previous block ends; overlap= or gap= for offset", context = "block" },
  { name = "together", description = "All animations start simultaneously; stagger= adds cascading delay", context = "block" },
  { name = "overlap", description = "Overlap seconds on after: block (starts that many seconds before previous ends)", context = "config" },
  { name = "gap", description = "Gap seconds on after: block (starts that many seconds after previous ends)", context = "config" },
  { name = "stagger", description = "Per-child delay in seconds on together: block (GSAP-style stagger)", context = "config" },
  { name = "animate", description = "Inline animate expression: animate varName from=-300 to=400 duration=0.5 ease=\"easeOut\"", context = "expression" },

  # animState keywords
  { name = "transitions", description = "Transition rules block inside animState", context = "block" },
  { name = "when", description = "Condition clause on animState transition: \"idle\" -> \"walk\" when speed > 10", context = "config" },
  { name = "initial", description = "Initial state name for an animState machine", context = "config" },

  # particles keywords
  { name = "emitter", description = "Particle emitter rate/shape configuration sub-block", context = "block" },
  { name = "lifetime", description = "Particle lifetime range (e.g. 1.0..3.0)", context = "config" },
  { name = "overLifetime", description = "Properties animated over particle lifetime (size, alpha, color, speed)", context = "block" },
  { name = "forces", description = "Forces applied to particles sub-block (gravity, drag, wind, turbulence, attractor)", context = "block" },
  { name = "gravity", description = "Gravity force on particles (pixels/s²)", context = "config" },
  { name = "drag", description = "Velocity drag multiplier applied each frame (0–1)", context = "config" },
  { name = "wind", description = "Constant wind force: wind x= y=", context = "expression" },
  { name = "turbulence", description = "Random turbulence force: turbulence strength= scale=", context = "expression" },
  { name = "attractor", description = "Attractor point force: attractor x= y= strength=", context = "expression" },
  { name = "rate", description = "Particles emitted per second", context = "config" },
  { name = "shape", description = "Particle render shape (\"circle\" / \"square\" / \"star\")", context = "config" },
  { name = "image", description = "Particle render image asset name (replaces shape)", context = "config" },
  { name = "radius", description = "Particle circle radius or emitter circle radius", context = "config" },
  { name = "size", description = "Particle image size in pixels", context = "config" },

  # path keywords
  { name = "moveTo", description = "Move path pen to position (no colon): moveTo x= y=", context = "expression" },
  { name = "lineTo", description = "Straight line segment: lineTo x= y=", context = "expression" },
  { name = "curveTo", description = "Cubic Bézier: curveTo x= y= cx= cy= (or cp1x= cp1y= cp2x= cp2y=)", context = "expression" },
  { name = "arcTo", description = "Arc segment: arcTo x= y= radius= startAngle= endAngle=", context = "expression" },
  { name = "closePath", description = "Close the current path back to start", context = "expression" },
  { name = "closed", description = "Whether a path is automatically closed (true/false)", context = "config" },

  # gradient keywords
  { name = "linear", description = "Linear gradient type attribute: gradient \"name\" linear x1= y1= x2= y2=:", context = "config" },
  { name = "radial", description = "Radial gradient type attribute: gradient \"name\" radial cx= cy= r=:", context = "config" },
  { name = "stop", description = "Color stop in a gradient: stop 0.0 \"#color\"", context = "block" },
  { name = "gradient", description = "Apply a named gradient as fill: gradient=\"gradientName\" on shape calls", context = "config" },

  # customEase keyword
  { name = "customEase", description = "Declare a named custom cubic-bezier easing: customEase \"name\" x1= y1= x2= y2=", context = "block" },

  # camera keywords (flat camelCase, max 2 levels deep)
  { name = "followX", description = "Camera follow target X (expression or state variable)", context = "config" },
  { name = "followY", description = "Camera follow target Y (expression or state variable)", context = "config" },
  { name = "smoothing", description = "Camera follow smoothing factor (0=instant, 1=no movement)", context = "config" },
  { name = "deadzoneWidth", description = "Camera follow deadzone width in pixels", context = "config" },
  { name = "deadzoneHeight", description = "Camera follow deadzone height in pixels", context = "config" },
  { name = "boundsX", description = "World boundary left edge for camera", context = "config" },
  { name = "boundsY", description = "World boundary top edge for camera", context = "config" },
  { name = "boundsWidth", description = "World boundary total width for camera", context = "config" },
  { name = "boundsHeight", description = "World boundary total height for camera", context = "config" },
  { name = "zoom", description = "Camera zoom factor", context = "config" },

  # Sprite rendering attributes
  { name = "clip", description = "Spritesheet frame index for canvas.sprite", context = "config" },
  { name = "tint", description = "Tint color applied to a sprite (hex or rgba string)", context = "config" },
  { name = "tintStrength", description = "Tint blend strength (0.0 = no tint, 1.0 = full tint)", context = "config" },
  { name = "anchorX", description = "Horizontal anchor for sprite rotation/scaling (0.0–1.0, default 0.5)", context = "config" },
  { name = "anchorY", description = "Vertical anchor for sprite rotation/scaling (0.0–1.0, default 0.5)", context = "config" },
  { name = "scaleX", description = "Horizontal scale factor for sprite or group", context = "config" },
  { name = "scaleY", description = "Vertical scale factor for sprite or group", context = "config" },
  { name = "rotation", description = "Rotation angle in degrees for sprite or group", context = "config" },
  { name = "alpha", description = "Opacity value (0.0–1.0) for sprite or group", context = "config" },
  { name = "flipX", description = "Mirror sprite horizontally (true/false)", context = "config" },
  { name = "flipY", description = "Mirror sprite vertically (true/false)", context = "config" },

  # Event handler blocks
  { name = "onFrame", description = "Per-frame update logic handler", context = "block" },
  { name = "onPointerDown", description = "Handle pointer down (click/touch) events", context = "block" },
  { name = "onPointerMove", description = "Handle pointer move (mouse/touch movement) events", context = "block" },
  { name = "onPointerUp", description = "Handle pointer up (release) events", context = "block" },
  { name = "onKeyDown", description = "Handle key press events", context = "block" },
  { name = "onKeyUp", description = "Handle key release events", context = "block" },
  { name = "onExit", description = "Called when the scene is exited (cleanup, save state)", context = "block" },
  { name = "onPause", description = "Called when the scene loses focus (tab hidden, overlay opens)", context = "block" },
  { name = "onResume", description = "Called when the scene regains focus after pause", context = "block" },

  # Scene management
  { name = "scene", description = "Scene management namespace (change, push, pop, set, get)", context = "expression" },
  { name = "page", description = "Canvas/UI bridge namespace (set, get — shares values with frame.ui HTML layer)", context = "expression" },

  # Control keywords for animation
  { name = "play", description = "Play a named tween, timeline, or animSprite", context = "expression" },
  { name = "pause", description = "Pause a named tween or timeline", context = "expression" },
  { name = "stop", description = "Stop a named tween or timeline", context = "expression" },
  { name = "seek", description = "Seek a timeline to a time position in seconds", context = "expression" },
  { name = "start", description = "Start an animation state machine", context = "expression" },
  { name = "on", description = "Route draw calls to a named layer: on layer \"name\":", context = "expression" },
]

# Custom types provided by the plugin
types = [
  { name = "Canvas", description = "Canvas rendering context" },
  { name = "Sprite", description = "Sprite sheet reference" },
  { name = "Sound", description = "Sound effect reference" },
  { name = "Music", description = "Music track reference" },
  { name = "Image", description = "Image asset reference" },
  { name = "Font", description = "Font asset reference" },
  { name = "Tween", description = "Named tween animation" },
  { name = "Timeline", description = "Named sequence of tweens" },
  { name = "AnimState", description = "Animation state machine" },
  { name = "Particles", description = "Particle emitter definition" },
  { name = "Gradient", description = "Named gradient fill" },
  { name = "Path", description = "Named vector path" },
]

# Built-in functions/expressions (see §27 of 12_frame_canvas.md for bridge contract)
functions = [
  # Drawing — basic shapes
  { name = "canvas.clear", signature = "canvas.clear\ncanvas.clear color=\"#1a1a2e\"", description = "Clear canvas. Optional color overrides background." },
  { name = "canvas.circle", signature = "canvas.circle x=${x} y=${y} radius=${r} color=\"${color}\" filled=${true}", description = "Draw circle; filled=true (default) for filled, filled=false for outline" },
  { name = "canvas.rect", signature = "canvas.rect x=${x} y=${y} width=${w} height=${h} color=\"${color}\" filled=${true} cornerRadius=${0}", description = "Draw rectangle; optional cornerRadius for rounded corners" },
  { name = "canvas.line", signature = "canvas.line fromX=${x1} fromY=${y1} toX=${x2} toY=${y2} stroke=${1} color=\"${color}\"", description = "Draw line segment" },
  { name = "canvas.triangle", signature = "canvas.triangle x1=${x1} y1=${y1} x2=${x2} y2=${y2} x3=${x3} y3=${y3} color=\"${color}\" filled=${true}", description = "Draw triangle" },
  { name = "canvas.ellipse", signature = "canvas.ellipse x=${x} y=${y} radiusX=${rx} radiusY=${ry} color=\"${color}\" filled=${true}", description = "Draw ellipse" },
  { name = "canvas.text", signature = "canvas.text \"${text}\" x=${x} y=${y} size=${16} color=\"${color}\" font=\"${fontName}\" align=\"${left}\" baseline=\"${top}\"", description = "Draw text; font= references a named font asset from assets: block" },
  { name = "canvas.image", signature = "canvas.image src=\"${name}\" x=${x} y=${y} width=${w} height=${h}", description = "Draw image asset by name" },
  { name = "canvas.sprite", signature = "canvas.sprite \"${name}\" x=${x} y=${y}\ncanvas.sprite \"${name}\" x=${x} y=${y} clip=${0}\ncanvas.sprite \"${name}\" x=${x} y=${y} state=\"${fsm}\"\ncanvas.sprite \"${name}\" x=${x} y=${y} sheet=\"${run}\" clip=${2}", description = "Draw sprite — static, by clip index, by FSM state, or by sheet+clip. Supports tint=, tintStrength=, alpha=, scaleX=, scaleY=, rotation=, anchorX=, anchorY=, flipX=, flipY=", maps_to = "_sprite_draw" },

  # Drawing — transforms
  { name = "canvas.save", signature = "canvas.save", description = "Push transform stack (pair with canvas.restore)" },
  { name = "canvas.restore", signature = "canvas.restore", description = "Pop transform stack" },
  { name = "canvas.translate", signature = "canvas.translate x=${x} y=${y}", description = "Translate canvas origin" },
  { name = "canvas.rotate", signature = "canvas.rotate angle=${degrees}", description = "Rotate canvas (degrees, clockwise)" },
  { name = "canvas.scale", signature = "canvas.scale x=${sx} y=${sy}", description = "Scale canvas" },

  # Drawing — effect scopes
  { name = "canvas.alpha", signature = "canvas.alpha value=${0.5}:\n\t// drawing commands", description = "Apply global alpha to all drawing inside the block" },
  { name = "canvas.shadow", signature = "canvas.shadow blur=${10} offsetX=${2} offsetY=${2} color=\"${rgba(0,0,0,0.5)}\":\n\t// drawing commands", description = "Apply drop shadow to all drawing inside the block" },
  { name = "canvas.blur", signature = "canvas.blur radius=${4}:\n\t// drawing commands", description = "Apply blur filter to all drawing inside the block" },
  { name = "canvas.glow", signature = "canvas.glow color=\"${color}\" blur=${12}:\n\t// drawing commands", description = "Apply glow (bloom) to all drawing inside the block" },
  { name = "canvas.blend", signature = "canvas.blend mode=\"${multiply}\":\n\t// drawing commands", description = "Apply blend mode to all drawing inside the block (multiply, screen, overlay, …)" },

  # Drawing — layers
  { name = "on layer", signature = "on layer \"${name}\":\n\t// drawing commands", description = "Route draw calls to a named layer" },

  # Drawing — immediate-mode path primitives (spec §17)
  { name = "canvas.beginPath", signature = "canvas.beginPath", description = "Start a new immediate-mode path. Pair with canvas.fill or canvas.stroke." },
  { name = "canvas.moveTo", signature = "canvas.moveTo x=${x} y=${y}", description = "Move pen to (x, y) without drawing" },
  { name = "canvas.lineTo", signature = "canvas.lineTo x=${x} y=${y}", description = "Add a line segment from the current point to (x, y)" },
  { name = "canvas.curveTo", signature = "canvas.curveTo cpX=${cpX} cpY=${cpY} x=${x} y=${y}", description = "Add a quadratic bezier curve to (x, y) using control point (cpX, cpY)" },
  { name = "canvas.cubicTo", signature = "canvas.cubicTo cp1x=${cp1x} cp1y=${cp1y} cp2x=${cp2x} cp2y=${cp2y} x=${x} y=${y}", description = "Add a cubic bezier curve to (x, y) using two control points" },
  { name = "canvas.arc", signature = "canvas.arc x=${x} y=${y} radius=${r} startAngle=${0} endAngle=${6.283}", description = "Add an arc; angles in radians" },
  { name = "canvas.closePath", signature = "canvas.closePath", description = "Close the current path back to its starting point" },
  { name = "canvas.fill", signature = "canvas.fill color=\"${color}\"", description = "Fill the current immediate-mode path with the given color" },
  { name = "canvas.stroke", signature = "canvas.stroke color=\"${color}\" width=${1}", description = "Stroke the current immediate-mode path" },

  # Drawing — groups and clip regions
  { name = "canvas.group", signature = "canvas.group x=${x} y=${y} rotation=${0} scaleX=${1.0} scaleY=${1.0} alpha=${1.0}:\n\t// child drawing commands", description = "Apply shared transform to a group of draw calls; group attributes (x, y, rotation, scaleX, scaleY, alpha) can be animated with tweens" },
  { name = "canvas.clip", signature = "canvas.clip x=${x} y=${y} width=${w} height=${h}:\n\t// masked drawing commands", description = "Restrict drawing to a region; supports rect (x, y, width, height), circle (x, y, radius), or path (path=name)" },

  # Audio — sound effects
  { name = "audio.play", signature = "audio.play \"${name}\"\naudio.play \"${name}\" volume=${0.8} pitch=${1.0}", description = "Play a named sound effect (loaded in assets: as sound)", maps_to = "_audio_play_sound" },

  # Audio — music tracks
  { name = "audio.music.play", signature = "audio.music.play \"${name}\" loop=${true} volume=${0.8}", description = "Play a named music track (loaded in assets: as music)", maps_to = "_audio_music_play" },
  { name = "audio.music.stop", signature = "audio.music.stop", description = "Stop current music track immediately", maps_to = "_audio_music_stop" },
  { name = "audio.music.pause", signature = "audio.music.pause", description = "Pause current music track", maps_to = "_audio_music_pause" },
  { name = "audio.music.resume", signature = "audio.music.resume", description = "Resume paused music track", maps_to = "_audio_music_resume" },
  { name = "audio.music.fadeOut", signature = "audio.music.fadeOut duration=${1.0}", description = "Fade out current music track over duration seconds", maps_to = "_audio_music_fade_out" },
  { name = "audio.music.crossfade", signature = "audio.music.crossfade \"${newTrack}\" duration=${1.5}", description = "Crossfade from current track to a new one", maps_to = "_audio_music_crossfade" },
  { name = "audio.masterVolume", signature = "audio.masterVolume value=${0.8}", description = "Set master volume (0–1)", maps_to = "_audio_set_master_volume" },

  # Input polling
  { name = "input.mouseX", signature = "input.mouseX()", description = "Get mouse X position", maps_to = "_input_mouse_x" },
  { name = "input.mouseY", signature = "input.mouseY()", description = "Get mouse Y position", maps_to = "_input_mouse_y" },
  { name = "input.keyDown", signature = "input.keyDown(\"${key}\")", description = "Check if key is currently held (returns 1/0)", maps_to = "_input_key_down" },
  { name = "input.keyJustPressed", signature = "input.keyJustPressed(\"${key}\")", description = "Check if key was pressed this frame (returns 1/0)", maps_to = "_input_key_just_pressed" },
  { name = "input.keyJustReleased", signature = "input.keyJustReleased(\"${key}\")", description = "Check if key was released this frame (returns 1/0)", maps_to = "_input_key_just_released" },

  # Tween control
  { name = "play tween", signature = "play tween \"${name}\"", description = "Play a named tween from the beginning", maps_to = "_tween_play" },
  { name = "pause tween", signature = "pause tween \"${name}\"", description = "Pause a running tween", maps_to = "_tween_pause" },
  { name = "stop tween", signature = "stop tween \"${name}\"", description = "Stop and reset a tween", maps_to = "_tween_stop" },
  { name = "resume tween", signature = "resume tween \"${name}\"", description = "Resume a paused tween", maps_to = "_tween_resume" },
  { name = "animate", signature = "animate ${varName} to=${value} duration=${0.5} easing=${ease.easeOut}", description = "Inline animate: animates a state variable to a target value", maps_to = "_tween_animate" },

  # Timeline control
  { name = "play timeline", signature = "play timeline \"${name}\"", description = "Play a named timeline from the beginning", maps_to = "_timeline_play" },
  { name = "pause timeline", signature = "pause timeline \"${name}\"", description = "Pause a running timeline", maps_to = "_timeline_pause" },
  { name = "stop timeline", signature = "stop timeline \"${name}\"", description = "Stop a timeline", maps_to = "_timeline_stop" },
  { name = "seek timeline", signature = "seek timeline \"${name}\" to=${seconds}", description = "Seek a timeline to a time position in seconds", maps_to = "_timeline_seek" },

  # AnimState control
  { name = "start animState", signature = "start animState \"${name}\"", description = "Start an animation state machine", maps_to = "_anim_state_start" },
  { name = "animState.force", signature = "animState.force \"${name}\" to=\"${stateName}\"", description = "Force an FSM into a named state for one frame (use to= not state=)", maps_to = "_anim_state_force" },
  { name = "animState.current", signature = "animState.current \"${name}\"", description = "Get the current state name of an FSM", maps_to = "_anim_state_current" },

  # Particles control
  { name = "emit particles", signature = "emit particles \"${name}\" x=${x} y=${y}", description = "One-shot particle burst at position", maps_to = "_particles_emit" },
  { name = "start particles", signature = "start particles \"${name}\" x=${x} y=${y}", description = "Start continuous particle emitter at position", maps_to = "_particles_start" },
  { name = "stop particles", signature = "stop particles \"${name}\"", description = "Stop a continuous particle emitter", maps_to = "_particles_stop" },

  # Collision
  { name = "collision.circles", signature = "collision.circles x1=${cx1} y1=${cy1} r1=${r1} x2=${cx2} y2=${cy2} r2=${r2}", description = "Circle vs circle collision test (returns 1/0)", maps_to = "_collision_circles" },
  { name = "collision.rects", signature = "collision.rects x1=${x1} y1=${y1} w1=${w1} h1=${h1} x2=${x2} y2=${y2} w2=${w2} h2=${h2}", description = "AABB vs AABB collision test (returns 1/0)", maps_to = "_collision_rects" },
  { name = "collision.pointRect", signature = "collision.pointRect px=${px} py=${py} rx=${rx} ry=${ry} rw=${rw} rh=${rh}", description = "Point in rectangle test (returns 1/0)", maps_to = "_collision_point_rect" },
  { name = "collision.circleRect", signature = "collision.circleRect cx=${cx} cy=${cy} r=${r} rx=${rx} ry=${ry} rw=${rw} rh=${rh}", description = "Circle vs rectangle collision test (returns 1/0)", maps_to = "_collision_circle_rect" },
  { name = "collision.pointCircle", signature = "collision.pointCircle px=${px} py=${py} cx=${cx} cy=${cy} r=${r}", description = "Point in circle test (returns 1/0)", maps_to = "_collision_point_circle" },
  { name = "collision.rayCircle", signature = "collision.rayCircle ox=${ox} oy=${oy} dx=${dx} dy=${dy} cx=${cx} cy=${cy} r=${r}", description = "Ray vs circle — returns hit distance or -1", maps_to = "_collision_ray_circle" },

  # Camera
  { name = "camera.setPosition", signature = "camera.setPosition x=${x} y=${y}", description = "Set camera world position", maps_to = "_camera_set_position" },
  { name = "camera.setZoom", signature = "camera.setZoom zoom=${1.0}", description = "Set camera zoom factor", maps_to = "_camera_set_zoom" },
  { name = "camera.shake", signature = "camera.shake intensity=${10} duration=${0.3}", description = "Trigger camera shake", maps_to = "_camera_shake" },

  # Scene management and parameter passing
  { name = "scene.change", signature = "scene.change \"${name}\"", description = "Replace current scene", maps_to = "_scene_change" },
  { name = "scene.push", signature = "scene.push \"${name}\"", description = "Push scene onto stack", maps_to = "_scene_push" },
  { name = "scene.pop", signature = "scene.pop()", description = "Pop top scene from stack", maps_to = "_scene_pop" },
  { name = "scene.changeTo", signature = "scene.changeTo \"${name}\" transition=\"${fade}\" duration=${0.5}", description = "Animated scene change with transition", maps_to = "_scene_change_animated" },
  { name = "scene.set", signature = "scene.set \"${key}\" value=${value}", description = "Store a value to pass to the next scene", maps_to = "_scene_set" },
  { name = "scene.get", signature = "scene.get \"${key}\"", description = "Read a value passed from the previous scene", maps_to = "_scene_get" },

  # Canvas/UI bridge
  { name = "page.set", signature = "page.set \"${key}\" value=${value}", description = "Expose a canvas value to the surrounding HTML/UI layer (frame.ui {{ key }})", maps_to = "_page_set" },
  { name = "page.get", signature = "page.get \"${key}\"", description = "Read a value set by the surrounding HTML/UI layer", maps_to = "_page_get" },

  # Timing
  { name = "deltaTime", signature = "deltaTime()", description = "Time since last frame in seconds", maps_to = "_canvas_get_delta_time" },
  { name = "time", signature = "time()", description = "Total elapsed time since scene start in seconds", maps_to = "_canvas_get_time" },
]

# Auto-completion suggestions
completions = [
  # Top-level scene block
  { trigger = "canvasScene:", insert = "canvasScene: width=${1:800} height=${2:600} fps=${3:60}\n\n\tstate:\n\t\t${4:// persistent variables}\n\n\tdraw:\n\t\tcanvas.clear color=\"${5:#1a1a2e}\"\n\t\t${6:// drawing commands}\n\n\tonFrame: param=\"dt\"\n\t\t${7:// update logic}" },

  # Sub-blocks
  { trigger = "assets:", insert = "assets:\n\tspritesheet \"${1:hero}\" src=\"${2:sprites/hero.png}\" frameWidth=${3:48} frameHeight=${4:64}\n\tsound \"${5:jump}\" src=\"${6:sounds/jump.wav}\"" },
  { trigger = "layers:", insert = "layers:\n\tlayer \"background\" z=0\n\tlayer \"world\" z=10\n\tlayer \"characters\" z=20\n\tlayer \"hud\" z=100" },
  { trigger = "state:", insert = "state:\n\tnumber ${1:x} = ${2:0.0}\n\tnumber ${3:y} = ${4:0.0}" },
  { trigger = "init:", insert = "init:\n\t${1:// one-time setup}" },
  { trigger = "draw:", insert = "draw:\n\tcanvas.clear color=\"${1:#1a1a2e}\"\n\t${2:// drawing commands}" },

  # Animation
  { trigger = "tween \"", insert = "tween \"${1:name}\":\n\t${2:variable} from=${3:0} to=${4:100}\n\tduration = ${5:0.5}\n\tease = \"${6:easeOut}\"" },
  { trigger = "timeline \"", insert = "timeline \"${1:name}\":\n\tat 0.0:\n\t\tanimate ${2:variable} from=${3:0} to=${4:100} duration=${5:0.5} ease=\"${6:easeOut}\"\n\tafter:\n\t\tanimate ${7:variable2} to=${8:value2} duration=${9:0.4}" },
  { trigger = "animState \"", insert = "animState \"${1:name}\":\n\tstate \"${2:idle}\":\n\t\tcanvas.sprite \"${3:hero}\" x=heroX y=heroY\n\tstate \"${4:walk}\":\n\t\tcanvas.sprite \"${3:hero}\" x=heroX y=heroY state=\"${4:walk}\"\n\ttransitions:\n\t\t\"${2:idle}\" -> \"${4:walk}\" when ${5:speed > 10}\n\tinitial = \"${2:idle}\"" },
  { trigger = "animSprite \"", insert = "animSprite \"${1:name}\":\n\tsheet = \"${2:spritesheetName}\"\n\tframes = ${3:0}..${4:7}\n\tfps = ${5:12}\n\tloop = ${6:true}" },
  { trigger = "particles \"", insert = "particles \"${1:name}\":\n\temitter:\n\t\trate = ${2:60}\n\t\tshape = \"${3:point}\"\n\tlifetime = ${4:0.5}..${5:1.5}\n\tspeed = ${6:100}..${7:300}\n\tangle = ${8:-180}..${9:180}\n\tcolor = \"${10:#ffffff}\"\n\toverLifetime:\n\t\tsize = 1.0..0.0\n\t\talpha = 1.0..0.0" },
  { trigger = "path \"", insert = "path \"${1:name}\":\n\tmoveTo x=${2:0} y=${3:0}\n\tcurveTo x=${4:300} y=${5:200} cx=${6:100} cy=${7:-50}" },
  { trigger = "gradient \"", insert = "gradient \"${1:name}\" linear x1=${2:0} y1=${3:0} x2=${4:800} y2=${5:0}:\n\tstop 0.0 \"${6:#3b82f6}\"\n\tstop 1.0 \"${7:#8b5cf6}\"" },
  { trigger = "customEase \"", insert = "customEase \"${1:snap}\" x1=${2:0.68} y1=${3:-0.55} x2=${4:0.265} y2=${5:1.55}" },
  { trigger = "camera:", insert = "camera:\n\tfollowX = ${1:playerX}\n\tfollowY = ${2:playerY}\n\tsmoothing = ${3:0.08}\n\tdeadzoneWidth = ${4:200}\n\tdeadzoneHeight = ${5:100}" },

  # Event handlers
  { trigger = "onFrame:", insert = "onFrame: param=\"dt\"\n\t${1:// per-frame update logic — dt is seconds since last frame}" },
  { trigger = "onPointerDown:", insert = "onPointerDown: param=\"x,y\"\n\t${1:// handle click/touch at x, y}" },
  { trigger = "onPointerMove:", insert = "onPointerMove: param=\"mx,my\"\n\t${1:// handle pointer movement}" },
  { trigger = "onPointerUp:", insert = "onPointerUp: param=\"x,y\"\n\t${1:// handle pointer release}" },
  { trigger = "onKeyDown:", insert = "onKeyDown: param=\"key\"\n\tif key == \"${1:ArrowLeft}\"\n\t\t${2:// handle key press}" },
  { trigger = "onKeyUp:", insert = "onKeyUp: param=\"key\"\n\tif key == \"${1:ArrowLeft}\"\n\t\t${2:// handle key release}" },
  { trigger = "onExit:", insert = "onExit:\n\t${1:// cleanup before scene leaves}" },
  { trigger = "onPause:", insert = "onPause:\n\t${1:// called when scene loses focus}" },
  { trigger = "onResume:", insert = "onResume:\n\t${1:// called when scene regains focus}" },

  # Drawing helpers
  { trigger = "canvas.circle", insert = "canvas.circle x=${1:0} y=${2:0} radius=${3:10} color=\"${4:blue}\"" },
  { trigger = "canvas.rect", insert = "canvas.rect x=${1:0} y=${2:0} width=${3:100} height=${4:100} color=\"${5:green}\"" },
  { trigger = "canvas.sprite", insert = "canvas.sprite \"${1:name}\" x=${2:0} y=${3:0}" },
  { trigger = "canvas.group", insert = "canvas.group x=${1:0} y=${2:0} rotation=${3:0} scaleX=${4:1.0} scaleY=${5:1.0}:\n\t${6:// child drawing commands}" },
  { trigger = "canvas.clip", insert = "canvas.clip x=${1:0} y=${2:0} width=${3:200} height=${4:200}:\n\t${5:// masked drawing commands}" },
  { trigger = "on layer", insert = "on layer \"${1:hud}\":\n\t${2:// layer drawing}" },
  { trigger = "canvas.alpha", insert = "canvas.alpha value=${1:0.5}:\n\t${2:// drawing commands}" },
  { trigger = "canvas.shadow", insert = "canvas.shadow blur=${1:10} offsetX=${2:2} offsetY=${3:2} color=\"${4:rgba(0,0,0,0.5)}\":\n\t${5:// drawing commands}" },
  { trigger = "canvas.glow", insert = "canvas.glow color=\"${1:#feca57}\" blur=${2:12}:\n\t${3:// drawing commands}" },
  { trigger = "audio.play", insert = "audio.play \"${1:sfxName}\" volume=${2:1.0}" },
  { trigger = "audio.music.play", insert = "audio.music.play \"${1:track}\" loop=${2:true} volume=${3:0.8}" },
  { trigger = "emit particles", insert = "emit particles \"${1:name}\" x=${2:playerX} y=${3:playerY}" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/canvas", "app/canvas/scenes", "app/canvas/components", "app/canvas/sprites", "app/canvas/audio"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln"]

# Files in owned folders automatically import this plugin
implicit_import = true

[templates]
# Starter files created when plugin is added to a project
files = [
  { path = "app/canvas/scenes/main.cln", template = "main.cln" },
]

# Bridge function declarations - canvas-specific functions provided by the runtime
# These match the WAT-level signatures expected by clean-server.
# String params use (ptr i32, len i32) pairs when expand_strings = true.
# See documents/specification/12_frame_canvas.md §27 for the complete bridge contract.
# Bridge function declarations
#
# Plugin Contracts v2 — foundation/spec/plugins/contracts/bridge-host-classes.md §2.
# Every canvas bridge targets the browser: 2D canvas context, Web Audio API,
# pointer/keyboard/touch/gamepad inputs. Tag every entry hosts=["browser"] so
# server-mode builds that pull in canvas code fail with BRIDGE-HOST-MISMATCH
# instead of a runtime LinkError at module instantiation. When a native (CLI
# game) runtime appears, individual entries can opt into ["browser", "native"].
[bridge]
functions = [
  # ===== Canvas Lifecycle =====
  { name = "_canvas_init", params = ["integer", "integer", "string"], returns = "integer", description = "Initialize canvas: width, height, id — returns canvas ID", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_clear", params = ["integer"], returns = "integer", description = "Clear canvas with background color", hosts = ["browser"] },
  { name = "_canvas_clear_color", params = ["integer", "string"], returns = "integer", description = "Clear canvas with specified color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_present", params = ["integer"], returns = "integer", description = "Flush frame to screen", hosts = ["browser"] },
  { name = "_canvas_set_fps", params = ["integer", "integer"], returns = "integer", description = "Set target frame rate: canvasId, fps", hosts = ["browser"] },
  { name = "_canvas_resize", params = ["integer", "integer", "integer"], returns = "integer", description = "Resize canvas: canvas_id, width, height", hosts = ["browser"] },
  { name = "_canvas_get_width", params = ["integer"], returns = "integer", description = "Get canvas width", hosts = ["browser"] },
  { name = "_canvas_get_height", params = ["integer"], returns = "integer", description = "Get canvas height", hosts = ["browser"] },
  { name = "_canvas_request_frame", params = ["integer"], returns = "integer", description = "Start animation loop", hosts = ["browser"] },
  { name = "_canvas_cancel_frame", params = ["integer"], returns = "integer", description = "Stop animation loop", hosts = ["browser"] },
  { name = "_canvas_get_delta_time", params = [], returns = "number", description = "Get time since last frame in seconds", hosts = ["browser"] },
  { name = "_canvas_get_time", params = [], returns = "number", description = "Get total elapsed time in seconds", hosts = ["browser"] },
  { name = "_canvas_get_fps", params = [], returns = "number", description = "Get current frames per second", hosts = ["browser"] },

  # ===== Canvas Variable Storage — persistent state across frame callbacks =====
  { name = "_canvas_var_set", params = ["string", "number"], returns = "integer", description = "Store a named number in canvas state (persists across frames)", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_var_get", params = ["string", "number"], returns = "number", description = "Read a named number from canvas state, returns default if not set", expand_strings = true, hosts = ["browser"] },

  # ===== Basic Shapes =====
  { name = "_canvas_circle_filled", params = ["integer", "number", "number", "number", "string"], returns = "integer", description = "Draw filled circle: canvas_id, x, y, radius, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_circle_outline", params = ["integer", "number", "number", "number", "string"], returns = "integer", description = "Draw circle outline: canvas_id, x, y, radius, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_rect_filled", params = ["integer", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw filled rectangle: canvas_id, x, y, width, height, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_rect_outline", params = ["integer", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw rectangle outline: canvas_id, x, y, width, height, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_rect_rounded", params = ["integer", "number", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw rounded rect: canvas_id, x, y, w, h, cornerRadius, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_line", params = ["integer", "number", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw line: canvas_id, x1, y1, x2, y2, stroke_width, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_triangle_filled", params = ["integer", "number", "number", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw filled triangle: canvas_id, x1, y1, x2, y2, x3, y3, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_triangle_outline", params = ["integer", "number", "number", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw triangle outline", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_ellipse_filled", params = ["integer", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw filled ellipse: canvas_id, x, y, radiusX, radiusY, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_ellipse_outline", params = ["integer", "number", "number", "number", "number", "string"], returns = "integer", description = "Draw ellipse outline", expand_strings = true, hosts = ["browser"] },

  # ===== Text Rendering =====
  { name = "_canvas_text", params = ["integer", "string", "number", "number", "number", "string"], returns = "integer", description = "Draw text: canvas_id, text, x, y, size, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_text_aligned", params = ["integer", "string", "number", "number", "number", "string", "string", "string"], returns = "integer", description = "Draw text with alignment: canvas_id, text, x, y, size, color, align, baseline", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_text_width", params = ["integer", "string", "number"], returns = "number", description = "Measure text width: canvas_id, text, fontSize", expand_strings = true, hosts = ["browser"] },

  # ===== Images =====
  { name = "_canvas_image", params = ["integer", "string", "number", "number", "number", "number"], returns = "integer", description = "Draw image: canvas_id, src, x, y, width, height", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_image_opacity", params = ["integer", "string", "number", "number", "number", "number", "number"], returns = "integer", description = "Draw image with opacity: canvas_id, src, x, y, w, h, opacity", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_image_cropped", params = ["integer", "integer", "number", "number", "number", "number", "number", "number", "number", "number"], returns = "integer", description = "Draw cropped image: canvas_id, imageId, sx, sy, sw, sh, dx, dy, dw, dh", hosts = ["browser"] },
  { name = "_canvas_image_rotated", params = ["integer", "integer", "number", "number", "number", "number", "number"], returns = "integer", description = "Draw rotated image: canvas_id, imageId, x, y, w, h, angle", hosts = ["browser"] },

  # ===== Transforms =====
  { name = "_canvas_save", params = ["integer"], returns = "integer", description = "Push transform stack", hosts = ["browser"] },
  { name = "_canvas_restore", params = ["integer"], returns = "integer", description = "Pop transform stack", hosts = ["browser"] },
  { name = "_canvas_translate", params = ["integer", "number", "number"], returns = "integer", description = "Translate canvas: canvas_id, x, y", hosts = ["browser"] },
  { name = "_canvas_rotate", params = ["integer", "number"], returns = "integer", description = "Rotate canvas: canvas_id, angle_degrees", hosts = ["browser"] },
  { name = "_canvas_scale", params = ["integer", "number", "number"], returns = "integer", description = "Scale canvas: canvas_id, sx, sy", hosts = ["browser"] },
  { name = "_canvas_transform", params = ["integer", "number", "number", "number", "number", "number", "number"], returns = "integer", description = "Set full transform matrix: canvas_id, a, b, c, d, e, f", hosts = ["browser"] },
  { name = "_canvas_reset_transform", params = ["integer"], returns = "integer", description = "Reset transform to identity", hosts = ["browser"] },

  # ===== Effect Scopes =====
  { name = "_canvas_alpha_begin", params = ["integer", "number"], returns = "integer", description = "Begin alpha scope: canvas_id, alpha (0-1)", hosts = ["browser"] },
  { name = "_canvas_alpha_end", params = ["integer"], returns = "integer", description = "End alpha scope", hosts = ["browser"] },
  { name = "_canvas_shadow_begin", params = ["integer", "number", "number", "number", "string"], returns = "integer", description = "Begin shadow scope: canvas_id, blur, offsetX, offsetY, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_shadow_end", params = ["integer"], returns = "integer", description = "End shadow scope", hosts = ["browser"] },
  { name = "_canvas_blur_begin", params = ["integer", "number"], returns = "integer", description = "Begin blur scope: canvas_id, radius", hosts = ["browser"] },
  { name = "_canvas_blur_end", params = ["integer"], returns = "integer", description = "End blur scope", hosts = ["browser"] },
  { name = "_canvas_glow_begin", params = ["integer", "string", "number"], returns = "integer", description = "Begin glow scope: canvas_id, color, blur", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_glow_end", params = ["integer"], returns = "integer", description = "End glow scope", hosts = ["browser"] },
  { name = "_canvas_blend_begin", params = ["integer", "string"], returns = "integer", description = "Begin blend mode scope: canvas_id, mode (multiply/screen/overlay/…)", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_blend_end", params = ["integer"], returns = "integer", description = "End blend mode scope", hosts = ["browser"] },
  { name = "_canvas_set_alpha", params = ["integer", "number"], returns = "integer", description = "Set persistent global alpha (not scoped): canvas_id, alpha", hosts = ["browser"] },
  { name = "_canvas_set_blend_mode", params = ["integer", "string"], returns = "integer", description = "Set persistent blend mode (not scoped)", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_set_shadow", params = ["integer", "number", "number", "number", "string"], returns = "integer", description = "Set persistent shadow: canvas_id, blur, offsetX, offsetY, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_clear_shadow", params = ["integer"], returns = "integer", description = "Clear shadow settings", hosts = ["browser"] },
  { name = "_canvas_set_line_cap", params = ["integer", "string"], returns = "integer", description = "Set line cap: butt, round, square", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_set_line_join", params = ["integer", "string"], returns = "integer", description = "Set line join: miter, round, bevel", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_set_line_dash", params = ["integer", "number", "number"], returns = "integer", description = "Set line dash: canvas_id, dashLength, gapLength", hosts = ["browser"] },
  { name = "_canvas_clear_line_dash", params = ["integer"], returns = "integer", description = "Clear line dash (solid lines)", hosts = ["browser"] },

  # ===== Paths =====
  { name = "_canvas_begin_path", params = ["integer"], returns = "integer", description = "Begin new path on canvas", hosts = ["browser"] },
  { name = "_canvas_move_to", params = ["integer", "number", "number"], returns = "integer", description = "Move pen: canvas_id, x, y", hosts = ["browser"] },
  { name = "_canvas_line_to", params = ["integer", "number", "number"], returns = "integer", description = "Line segment to: canvas_id, x, y", hosts = ["browser"] },
  { name = "_canvas_curve_to", params = ["integer", "number", "number", "number", "number"], returns = "integer", description = "Quadratic bezier: canvas_id, cpx, cpy, x, y", hosts = ["browser"] },
  { name = "_canvas_cubic_to", params = ["integer", "number", "number", "number", "number", "number", "number"], returns = "integer", description = "Cubic bezier: canvas_id, cp1x, cp1y, cp2x, cp2y, x, y", hosts = ["browser"] },
  { name = "_canvas_arc", params = ["integer", "number", "number", "number", "number", "number"], returns = "integer", description = "Arc: canvas_id, x, y, radius, startAngle, endAngle", hosts = ["browser"] },
  { name = "_canvas_arc_to", params = ["integer", "number", "number", "number", "number", "number"], returns = "integer", description = "Arc to: canvas_id, x1, y1, x2, y2, radius", hosts = ["browser"] },
  { name = "_canvas_close_path", params = ["integer"], returns = "integer", description = "Close current path", hosts = ["browser"] },
  { name = "_canvas_fill_path", params = ["integer", "string"], returns = "integer", description = "Fill path with color: canvas_id, color", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_stroke_path", params = ["integer", "string", "number"], returns = "integer", description = "Stroke path: canvas_id, color, lineWidth", expand_strings = true, hosts = ["browser"] },
  { name = "_canvas_draw_named_path", params = ["integer", "string", "number", "string"], returns = "integer", description = "Draw a named `path` block: canvas_id, name, strokeWidth, color", expand_strings = true, hosts = ["browser"] },

  # ===== Gradients =====
  { name = "_gradient_linear", params = ["string", "number", "number", "number", "number"], returns = "integer", description = "Create named linear gradient: name, x1, y1, x2, y2", expand_strings = true, hosts = ["browser"] },
  { name = "_gradient_radial", params = ["string", "number", "number", "number"], returns = "integer", description = "Create named radial gradient: name, cx, cy, radius", expand_strings = true, hosts = ["browser"] },
  { name = "_gradient_add_stop", params = ["string", "number", "string"], returns = "integer", description = "Add color stop: gradientName, offset (0-1), color", expand_strings = true, hosts = ["browser"] },
  { name = "_gradient_ref", params = ["string"], returns = "integer", description = "Get gradient reference ID by name (used as fill color)", expand_strings = true, hosts = ["browser"] },

  # ===== Layers =====
  { name = "_layer_declare", params = ["string", "integer"], returns = "integer", description = "Declare a named layer: name, z-order", expand_strings = true, hosts = ["browser"] },
  { name = "_layer_begin", params = ["string"], returns = "integer", description = "Begin routing draw calls to named layer", expand_strings = true, hosts = ["browser"] },
  { name = "_layer_end", params = [], returns = "integer", description = "End layer routing; return to default layer", hosts = ["browser"] },

  # ===== Sprites =====
  { name = "_sprite_load_sheet", params = ["string", "integer", "integer"], returns = "integer", description = "Load sprite sheet: path, frameWidth, frameHeight — returns sheet ID", expand_strings = true, hosts = ["browser"] },
  { name = "_sprite_draw", params = ["integer", "string", "integer", "number", "number", "number", "number"], returns = "integer", description = "Draw sprite frame: canvasId, sheetName, frameIndex, x, y, w, h", expand_strings = true, hosts = ["browser"] },
  { name = "_sprite_draw_flipped", params = ["integer", "string", "integer", "number", "number", "number", "number", "integer", "integer"], returns = "integer", description = "Draw sprite flipped: canvasId, sheetName, frame, x, y, w, h, flipX(0/1), flipY(0/1)", expand_strings = true, hosts = ["browser"] },
  { name = "_sprite_get_frame_count", params = ["integer"], returns = "integer", description = "Get number of frames in sprite sheet", hosts = ["browser"] },
  { name = "_sprite_get_frame_width", params = ["integer"], returns = "integer", description = "Get sprite frame width", hosts = ["browser"] },

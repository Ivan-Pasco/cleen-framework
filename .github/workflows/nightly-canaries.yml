name: Nightly Canaries (Layer 2 — browser)

# Layer 2 canary runner for frame.ui. Instantiates the compiler's canary
# corpus in headless Chromium via Playwright and diffs stdout against each
# canary's expected output block. Companion to the compiler's Layer 1
# corpus (owned by clean-language-compiler at tests/cln/canaries/*.cln)
# and the L3 aggregate matrix in the compiler repo.
#
# Runs nightly and on-demand. If this job goes red, the framework's
# browser host bridge has diverged from the registry contract at
# foundation/platform-architecture/function-registry.toml.

on:
  schedule:
    # 03:17 UTC nightly. Off-peak; deliberately not on the hour so we do
    # not clash with the compiler's L3 matrix job kicking off at 03:00.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'Compiler ref (branch/tag/sha) to pull canaries from. Defaults to main.'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - 'plugins/frame.ui/scripts/run_canaries.mjs'
      - 'plugins/frame.ui/scripts/package.json'
      - 'plugins/frame.ui/runtime/loader.js'
      - '.github/workflows/nightly-canaries.yml'

permissions:
  contents: read

jobs:
  browser-canaries:
    name: Layer 2 canaries (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Checkout compiler (for canary corpus)
        uses: actions/checkout@v4
        with:
          repository: Ivan-Pasco/clean-language-compiler
          ref: ${{ inputs.compiler_ref || 'main' }}
          path: _compiler

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cleen (Clean Language version manager)
        run: |
          curl -fsSL https://github.com/Ivan-Pasco/clean-language-manager/releases/latest/download/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cleen/bin" >> "$GITHUB_PATH"

      - name: Install latest Clean Language compiler
        run: |
          set -euo pipefail
          # The Ivan-Pasco/clean-language-compiler GitHub repo was renamed
          # (assets now live under -old) and `cleen install` doesn't follow
          # the 301 redirect on asset downloads. Bypass cleen entirely and
          # place the binary where `cleen use` expects it, so downstream
          # `cleen frame install` still works.
          tag="$(curl -fsSL https://api.github.com/repos/Ivan-Pasco/clean-language-compiler/releases/latest | jq -r '.tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve latest compiler tag from GitHub API"
            exit 1
          fi
          ver="${tag#v}"
          echo "Installing Clean Language compiler $ver (from $tag) directly from Releases"
          mkdir -p "$HOME/.cleen/versions/$ver" "$HOME/.cleen/bin"
          curl -fsSL -o "$HOME/.cleen/versions/$ver/cln" \
            "https://github.com/Ivan-Pasco/clean-language-compiler/releases/download/$tag/cln-linux-x86_64"
          chmod +x "$HOME/.cleen/versions/$ver/cln"
          ln -sf "$HOME/.cleen/versions/$ver/cln" "$HOME/.cleen/bin/cln"
          echo "$ver" > "$HOME/.cleen/active-version"
          echo "$ver" > "$HOME/.cleen/.active-version"
          cln --version

      - name: Install latest Frame plugins
        run: |
          set -euo pipefail
          # cleen frame install requires cleen to know about the compiler via
          # its own state. Download the frame plugin bundle directly and
          # extract into ~/.cleen/plugins/.
          frame_tag="$(curl -fsSL https://api.github.com/repos/Ivan-Pasco/cleen-framework/releases/latest | jq -r '.tag_name')"
          frame_ver="${frame_tag#v}"
          echo "Installing Frame plugins $frame_ver (from $frame_tag)"
          mkdir -p "$HOME/.cleen/plugins"
          curl -fsSL -o /tmp/frame-plugins.tar.gz \
            "https://github.com/Ivan-Pasco/cleen-framework/releases/download/$frame_tag/frame-plugins-$frame_ver.tar.gz"
          tar -xzf /tmp/frame-plugins.tar.gz -C "$HOME/.cleen/plugins"
          ls "$HOME/.cleen/plugins/"

      - name: Install runner dependencies
        working-directory: plugins/frame.ui/scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Layer 2 canaries
        env:
          CANARY_DIR: ${{ github.workspace }}/_compiler/tests/cln/canaries
        working-directory: plugins/frame.ui/scripts
        run: node run_canaries.mjs

      - name: Upload canary report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: plugins/frame.ui/.canary-run
          if-no-files-found: ignore
          retention-days: 7

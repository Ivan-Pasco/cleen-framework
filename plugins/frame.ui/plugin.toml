  { name = "_ui_set_css_var", params = ["string", "string"], returns = "void", description = "Set CSS custom property on :root: name, value", expand_strings = true, signature = "_ui_set_css_var(name, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },

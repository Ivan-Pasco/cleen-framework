name: Test Frame Framework

# Runs the real-bridge test suite (tests/framework/runtime/) on every push and PR.
# Legacy placeholder tests under tests/framework/{unit,integration,e2e}/ are NOT
# gated here; they will be migrated into runtime/ over Phases 2–5 of the
# remediation plan and added to this workflow's scope as they are converted.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'documents/**'
      - 'foundation/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fail-fast gate: block any PR/push containing placeholder tests before we
  # spend runner minutes compiling anything. See
  # system-documents/testing/TEST_STRATEGY.md §5.
  placeholder-guard:
    name: Test placeholder guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run placeholder guard
        run: python3 scripts/check-test-placeholders.py

  runtime-tests:
    name: Runtime tests (real bridge)
    runs-on: ubuntu-latest
    needs: placeholder-guard

    # Postgres service for frame.data integration tests (Phase 2+).
    # SQLite in-memory is the default for unit tests; Postgres covers parity.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleen_test
          POSTGRES_PASSWORD: cleen_test
          POSTGRES_DB: cleen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLEEN_TEST_PG_URL: postgres://cleen_test:cleen_test@localhost:5432/cleen_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cleen (Clean Language version manager)
        run: |
          curl -fsSL https://github.com/Ivan-Pasco/clean-language-manager/releases/latest/download/install.sh | bash
          # cleen itself goes to ~/.local/bin; cln (the compiler) goes to ~/.cleen/bin after `cleen install`.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cleen/bin" >> "$GITHUB_PATH"

      - name: Install latest Clean Language compiler
        run: |
          set -euo pipefail
          # The Ivan-Pasco/clean-language-compiler GitHub repo was renamed
          # (assets now live under -old) and `cleen install` doesn't follow
          # the 301 redirect on asset downloads. Bypass cleen entirely and
          # place the binary where `cleen use` expects it, so downstream
          # `cleen frame install` still works. Resolve the tag ourselves so
          # any resolution failure is loud.
          tag="$(curl -fsSL https://api.github.com/repos/Ivan-Pasco/clean-language-compiler/releases/latest | jq -r '.tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve latest compiler tag from GitHub API"
            exit 1
          fi
          ver="${tag#v}"
          echo "Installing Clean Language compiler $ver (from $tag) directly from Releases"
          mkdir -p "$HOME/.cleen/versions/$ver" "$HOME/.cleen/bin"
          curl -fsSL -o "$HOME/.cleen/versions/$ver/cln" \
            "https://github.com/Ivan-Pasco/clean-language-compiler/releases/download/$tag/cln-linux-x86_64"
          chmod +x "$HOME/.cleen/versions/$ver/cln"
          ln -sf "$HOME/.cleen/versions/$ver/cln" "$HOME/.cleen/bin/cln"
          # Mark the active version so cleen commands (e.g. `cleen frame install`)
          # resolve against it.
          # cleen looks for either .active-version or active-version depending on version.
          echo "$ver" > "$HOME/.cleen/active-version"
          echo "$ver" > "$HOME/.cleen/.active-version"
          cln --version

      - name: Install latest Frame plugins
        run: |
          set -euo pipefail
          # cleen frame install requires cleen to know about the compiler via
          # its own state, which we bypassed above. Download the frame plugin
          # bundle directly and extract into ~/.cleen/plugins/.
          frame_tag="$(curl -fsSL https://api.github.com/repos/Ivan-Pasco/cleen-framework/releases/latest | jq -r '.tag_name')"
          frame_ver="${frame_tag#v}"
          echo "Installing Frame plugins $frame_ver (from $frame_tag)"
          mkdir -p "$HOME/.cleen/plugins"
          curl -fsSL -o /tmp/frame-plugins.tar.gz \
            "https://github.com/Ivan-Pasco/cleen-framework/releases/download/$frame_tag/frame-plugins-$frame_ver.tar.gz"
          tar -xzf /tmp/frame-plugins.tar.gz -C "$HOME/.cleen/plugins"
          ls "$HOME/.cleen/plugins/"

      - name: Download clean-server (linux x64 binary)
        run: |
          mkdir -p "$HOME/.cleen/server"
          curl -fsSL -o /tmp/clean-server.tar.gz \
            https://github.com/Ivan-Pasco/clean-server/releases/latest/download/clean-server-linux-x64.tar.gz
          tar -xzf /tmp/clean-server.tar.gz -C "$HOME/.cleen/server"
          chmod +x "$HOME/.cleen/server/clean-server"
          echo "CLEEN_SERVER=$HOME/.cleen/server/clean-server" >> "$GITHUB_ENV"

      - name: Print toolchain versions
        run: |
          cleen --version || true
          cln --version || true
          "$CLEEN_SERVER" --version || true

      - name: Run framework runtime tests
        run: ./scripts/run-framework-tests.sh runtime

  json-bridge-conformance:
    name: JSON bridge conformance (JSONTestSuite)
    runs-on: ubuntu-latest
    needs: placeholder-guard
    timeout-minutes: 5
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run _json_encode_v2 / _json_decode_v2 unit tests
        working-directory: plugins/frame.ui/scripts
        run: node test_json_v2.mjs

      - name: Run JSONTestSuite conformance harness against _json_decode_v2
        working-directory: plugins/frame.ui/scripts
        run: node test_json_conformance.mjs

[language]
# Block-level keywords that start a declaration
blocks = ["component", "page", "html", "ui"]

# Keywords used within plugin context
keywords = [
  { name = "state", description = "Component state declaration", context = "block" },
  { name = "inputs", description = "Component inputs declaration", context = "block" },
  { name = "render", description = "Component render function", context = "block" },
  { name = "events", description = "Event handlers block", context = "block" },
  { name = "computed", description = "Computed properties", context = "block" },
  { name = "var", description = "html: block named variable attribute (html: var=\"name\")", context = "attribute" },
  { name = "if", description = "Conditional rendering directive", context = "directive" },
  { name = "else", description = "Else clause for conditional", context = "directive" },
  { name = "iterate", description = "Iterate rendering directive (cl-iterate)", context = "directive" },
  { name = "bind", description = "Two-way data binding", context = "directive" },
  { name = "client", description = "Hydration mode attribute", context = "attribute" },
  { name = "slot", description = "Slot for content projection", context = "directive" },
  { name = "show", description = "Conditional visibility", context = "directive" },
  { name = "validate", description = "Form validation directive", context = "directive" },
  { name = "layout", description = "Page layout name (used in <page layout='name'> attribute)", context = "page-attribute" },
  { name = "auth", description = "Require authentication for page", context = "page-attribute" },
  { name = "roles", description = "Required roles for page access", context = "page-attribute" },
  { name = "cache", description = "Page cache max-age in seconds", context = "page-attribute" },
]

# Custom types provided by the plugin
types = [
  { name = "Component", description = "UI component type" },
  { name = "Inputs", description = "Component inputs type" },
  { name = "State", description = "Component state type" },
]

# Built-in functions/expressions
functions = [
  # SSR response helpers — emitted by frame.ui's preamble. Moved from frame.server
  # in v2.10.138 because SSR is frame.ui's responsibility.
  { name = "render", signature = "render(name)", description = "Render HTML page from app/ui/web/pages/<name>.html and return as 200 text/html response" },
  { name = "renderWith", signature = "renderWith(name, data_json)", description = "Render HTML page from app/ui/web/pages/<name>.html with JSON data string for { key } template substitution" },
  { name = "rawHtml", signature = "rawHtml(content)", description = "Render unescaped HTML (use with caution)" },
  { name = "escape", signature = "escape(text)", description = "Escape HTML entities" },
  { name = "slot", signature = "slot(name?)", description = "Render slot content" },
  { name = "_html_escape", signature = "_html_escape(text)", description = "Escape HTML entities (auto-generated by {expr} interpolation in html: blocks)" },
  { name = "ui.inputValue", signature = "ui.inputValue(selector)", description = "Get value of input/textarea/select by CSS selector", maps_to = "_ui_input_value", params = ["string"], returns = "string" },
  { name = "ui.formJson", signature = "ui.formJson(selector)", description = "Collect all named form inputs as JSON object string", maps_to = "_ui_form_json", params = ["string"], returns = "string" },
  { name = "ui.formData", signature = "ui.formData(selector)", description = "Collect all named form inputs as URL-encoded string", maps_to = "_ui_form_data", params = ["string"], returns = "string" },
  { name = "ui.checked", signature = "ui.checked(selector)", description = "Get checkbox checked state (0 or 1)", maps_to = "_ui_checked", params = ["string"], returns = "integer" },
  { name = "ui.setInput", signature = "ui.setInput(selector, value)", description = "Set value of input/textarea/select", maps_to = "_ui_set_input", params = ["string", "string"], returns = "integer" },
  { name = "ui.formSubmit", signature = "ui.formSubmit(selector)", description = "Programmatically submit a form (triggers validation via requestSubmit)", maps_to = "_ui_form_submit", params = ["string"], returns = "integer" },
  { name = "ui.getSelection", signature = "ui.getSelection(selector) -> string", description = "Get textarea/input selection as JSON {text, start, end}", maps_to = "_ui_get_selection", params = ["string"], returns = "string" },
  { name = "ui.insertAtCursor", signature = "ui.insertAtCursor(selector, before, after) -> integer", description = "Wrap selection or insert at cursor; returns new cursor position", maps_to = "_ui_insert_at_cursor", params = ["string", "string", "string"], returns = "integer" },
  { name = "ui.textDiff", signature = "ui.textDiff(selectorA, selectorB, selectorOut) -> integer", description = "Word-level diff between two elements rendered into a third; adds .diff-added/.diff-removed spans", maps_to = "_ui_text_diff", params = ["string", "string", "string"], returns = "integer" },
  { name = "ui.onEvent", signature = "ui.onEvent(selector, eventType, handlerName)", description = "Register event handler by exported function name for CSS selector and event type", maps_to = "_ui_on_event", params = ["string", "string", "string"], returns = "integer" },
  { name = "ui.toggleClass", signature = "ui.toggleClass(selector, className)", description = "Toggle CSS class on first matching element", maps_to = "_ui_toggle_class", params = ["string", "string"], returns = "integer" },
  { name = "ui.addClass", signature = "ui.addClass(selector, className)", description = "Add CSS class to first matching element", maps_to = "_ui_add_class", params = ["string", "string"], returns = "integer" },
  { name = "ui.removeClass", signature = "ui.removeClass(selector, className)", description = "Remove CSS class from first matching element", maps_to = "_ui_remove_class", params = ["string", "string"], returns = "integer" },
  { name = "ui.setStyle", signature = "ui.setStyle(selector, property, value)", description = "Set inline style on first matching element", maps_to = "_ui_set_style", params = ["string", "string", "string"], returns = "integer" },
  { name = "ui.setState", signature = "ui.setState(id, json)", description = "Set component state by ID", maps_to = "_ui_set_state", params = ["string", "string"], returns = "integer" },
  { name = "ui.getState", signature = "ui.getState(id)", description = "Get component state by ID", maps_to = "_ui_get_state", params = ["string"], returns = "string" },
  { name = "ui.updateElement", signature = "ui.updateElement(selector, content)", description = "Update element innerHTML", maps_to = "_ui_update_element", params = ["string", "string"], returns = "integer" },
  { name = "ui.updateAttr", signature = "ui.updateAttr(selector, attr, value)", description = "Update element attribute", maps_to = "_ui_update_attr", params = ["string", "string", "string"], returns = "integer" },
  { name = "ui.eventAttr", signature = "ui.eventAttr(attr)", description = "Get attribute from current event target", maps_to = "_ui_event_attr", params = ["string"], returns = "string" },
  { name = "ui.eventValue", signature = "ui.eventValue()", description = "Get value/textContent of current event target", maps_to = "_ui_event_value", params = [], returns = "string" },
  { name = "ui.eventClosestAttr", signature = "ui.eventClosestAttr(selector, attr)", description = "Get attribute from closest ancestor matching selector", maps_to = "_ui_event_closest_attr", params = ["string", "string"], returns = "string" },
  { name = "ui.clipboardWriteRaw", signature = "ui.clipboardWriteRaw(text)", description = "Write text to clipboard (fire-and-forget, no callbacks)", maps_to = "_ui_clipboard_write", params = ["string"], returns = "integer" },
  { name = "ui.locationHref", signature = "ui.locationHref(url)", description = "Navigate to URL", maps_to = "_ui_location_href", params = ["string"], returns = "integer" },
  { name = "ui.locationQuery", signature = "ui.locationQuery(param)", description = "Get URL query parameter", maps_to = "_ui_location_query", params = ["string"], returns = "string" },
  { name = "ui.locationPath", signature = "ui.locationPath()", description = "Get current URL pathname", maps_to = "_ui_location_path", params = [], returns = "string" },
  { name = "ui.observeVisible", signature = "ui.observeVisible(selector, className)", description = "Add class when elements become visible", maps_to = "_ui_observe_visible", params = ["string", "string"], returns = "integer" },
  { name = "ui.setTimeout", signature = "ui.setTimeout(handlerName, delayMs)", description = "Call exported handler by name after delay", maps_to = "_ui_set_timeout", params = ["string", "integer"], returns = "integer" },
  { name = "ui.filterByAttr", signature = "ui.filterByAttr(selector, attr, value)", description = "Show/hide elements by attribute match", maps_to = "_ui_filter_by_attr", params = ["string", "string", "string"], returns = "integer" },
  { name = "ui.filterByText", signature = "ui.filterByText(selector, nameAttr, descAttr, query)", description = "Filter elements by text search", maps_to = "_ui_filter_by_text", params = ["string", "string", "string", "string"], returns = "integer" },
  { name = "ui.queryAddClass", signature = "ui.queryAddClass(selector, className)", description = "Add class to ALL matching elements", maps_to = "_ui_query_add_class", params = ["string", "string"], returns = "integer" },
  { name = "ui.queryRemoveClass", signature = "ui.queryRemoveClass(selector, className)", description = "Remove class from ALL matching elements", maps_to = "_ui_query_remove_class", params = ["string", "string"], returns = "integer" },

  # --- §FEXT-1: Drag data transfer ---
  { name = "_ui_set_drag_data", params = ["string", "string"], returns = "integer", description = "Set drag-and-drop transfer data: key, value", expand_strings = true, signature = "_ui_set_drag_data(key, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_get_drag_data", params = ["string"], returns = "string", description = "Get drag-and-drop transfer data by key", expand_strings = true, signature = "_ui_get_drag_data(key) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "ui.setDragData", signature = "ui.setDragData(key, value)", description = "Set drag transfer data", maps_to = "_ui_set_drag_data", params = ["string", "string"], returns = "integer" },
  { name = "ui.getDragData", signature = "ui.getDragData(key) -> string", description = "Get drag transfer data by key", maps_to = "_ui_get_drag_data", params = ["string"], returns = "string" },

  # --- §FEXT-2: DOM Query bridge functions (browser-only; server stubs return "") ---
  { name = "_ui_get_bounds", params = ["string"], returns = "string", description = "Get bounding box of element matching selector (JSON: x,y,width,height,top,left,right,bottom)", expand_strings = true, signature = "_ui_get_bounds(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_get_offset_bounds", params = ["string"], returns = "string", description = "Get bounding box relative to offset parent (JSON)", expand_strings = true, signature = "_ui_get_offset_bounds(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_get_scroll", params = ["string"], returns = "string", description = "Get scroll position of element (JSON: scrollX,scrollY,scrollWidth,scrollHeight)", expand_strings = true, signature = "_ui_get_scroll(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_set_scroll", params = ["string", "number", "number"], returns = "integer", description = "Set scroll position of element: selector, x, y", expand_strings = true, signature = "_ui_set_scroll(selector, x, y)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_query_all", params = ["string"], returns = "string", description = "Query all elements matching selector; returns JSON array of CSS selector paths", expand_strings = true, signature = "_ui_query_all(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_get_computed_style", params = ["string", "string"], returns = "string", description = "Get computed CSS property value: selector, property name", expand_strings = true, signature = "_ui_get_computed_style(selector, property) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "ui.getBounds", signature = "ui.getBounds(selector) -> BoundsResult", description = "Get element bounding box", maps_to = "_ui_get_bounds", params = ["string"], returns = "string" },
  { name = "ui.getOffsetBounds", signature = "ui.getOffsetBounds(selector) -> BoundsResult", description = "Get element bounding box relative to offset parent", maps_to = "_ui_get_offset_bounds", params = ["string"], returns = "string" },
  { name = "ui.getScroll", signature = "ui.getScroll(selector) -> ScrollResult", description = "Get element scroll position", maps_to = "_ui_get_scroll", params = ["string"], returns = "string" },
  { name = "ui.setScroll", signature = "ui.setScroll(selector, x, y)", description = "Set element scroll position", maps_to = "_ui_set_scroll", params = ["string", "number", "number"], returns = "integer" },
  { name = "ui.queryAll", signature = "ui.queryAll(selector) -> Array<string>", description = "Query all matching elements; returns selector paths", maps_to = "_ui_query_all", params = ["string"], returns = "string" },
  { name = "ui.getAttr", signature = "ui.getAttr(selector, attr) -> string", description = "Get attribute value from first matching element", maps_to = "_ui_get_attr", params = ["string", "string"], returns = "string" },
  { name = "ui.getComputedStyle", signature = "ui.getComputedStyle(selector, property) -> string", description = "Get computed CSS property value", maps_to = "_ui_get_computed_style", params = ["string", "string"], returns = "string" },

  # --- §FEXT-3: iframe communication bridge (browser-only) ---
  { name = "_ui_iframe_send", params = ["string", "string"], returns = "integer", description = "Send postMessage to iframe: selector, message string", expand_strings = true, signature = "_ui_iframe_send(selector, message)", hosts = ["browser"] },
  { name = "_ui_iframe_on_message", params = ["string"], returns = "integer", description = "Register handler for incoming iframe postMessages: handler function name", expand_strings = true, signature = "_ui_iframe_on_message(handlerName)", hosts = ["browser"] },
  { name = "_ui_iframe_get_bounds", params = ["string", "string"], returns = "string", description = "Get bounds of element inside iframe: iframe selector, inner selector (100ms timeout)", expand_strings = true, signature = "_ui_iframe_get_bounds(iframeSelector, innerSelector) -> string", hosts = ["browser"] },
  { name = "_ui_iframe_inject", params = ["string", "string"], returns = "integer", description = "Inject script into iframe: selector, script string (returns 1=ok, 0=threw)", expand_strings = true, signature = "_ui_iframe_inject(selector, script)", hosts = ["browser"] },
  { name = "ui.iframeSend", signature = "ui.iframeSend(selector, message)", description = "Send message to iframe via postMessage", maps_to = "_ui_iframe_send", params = ["string", "string"], returns = "integer" },
  { name = "ui.iframeOnMessage", signature = "ui.iframeOnMessage(handler)", description = "Register handler for messages from iframes", maps_to = "_ui_iframe_on_message", params = ["string"], returns = "integer" },
  { name = "ui.iframeGetBounds", signature = "ui.iframeGetBounds(iframeSelector, innerSelector) -> BoundsResult", description = "Get bounds of element inside iframe", maps_to = "_ui_iframe_get_bounds", params = ["string", "string"], returns = "string" },
  { name = "ui.iframeInject", signature = "ui.iframeInject(selector, script) -> boolean", description = "Inject script into iframe", maps_to = "_ui_iframe_inject", params = ["string", "string"], returns = "boolean" },

  # --- §FEXT-5: Incremental DOM patching (browser-only; server is a no-op) ---
  { name = "_ui_patch", params = ["string", "string"], returns = "integer", description = "Diff and incrementally patch DOM subtree: selector, new HTML (preserves focus, scroll, selection)", expand_strings = true, signature = "_ui_patch(selector, newHtml)", hosts = ["browser"] },
  { name = "ui.patch", signature = "ui.patch(selector, newHtml)", description = "Incrementally patch DOM subtree without full re-render", maps_to = "_ui_patch", params = ["string", "string"], returns = "integer" },

  # --- Keyboard shortcuts ---
  { name = "ui.shortcut", signature = "ui.shortcut(keys, handlerName, scope) -> integer", description = "Register global keyboard shortcut; scope is 'global' or a CSS selector", maps_to = "_ui_shortcut_register", params = ["string", "string", "string"], returns = "integer" },
  { name = "ui.removeShortcut", signature = "ui.removeShortcut(id)", description = "Remove keyboard shortcut by ID", maps_to = "_ui_shortcut_remove", params = ["integer"], returns = "void" },
  { name = "ui.clearShortcuts", signature = "ui.clearShortcuts()", description = "Remove all keyboard shortcuts registered by this WASM instance", maps_to = "_ui_shortcut_clear", params = [], returns = "void" },

  # --- CSS variable manipulation ---
  { name = "ui.setCssVar", signature = "ui.setCssVar(name, value)", description = "Set CSS custom property on :root", maps_to = "_ui_set_css_var", params = ["string", "string"], returns = "void" },
  { name = "ui.setCssVarOn", signature = "ui.setCssVarOn(selector, name, value)", description = "Set CSS custom property on specific element", maps_to = "_ui_set_css_var_on", params = ["string", "string", "string"], returns = "void" },
  { name = "ui.getCssVar", signature = "ui.getCssVar(name) -> string", description = "Get computed value of CSS custom property from :root", maps_to = "_ui_get_css_var", params = ["string"], returns = "string" },
  { name = "ui.applyCssVars", signature = "ui.applyCssVars(tokensJson)", description = "Apply JSON object of CSS variable name→value pairs to :root", maps_to = "_ui_apply_css_vars", params = ["string"], returns = "void" },

  # --- Focus management ---
  { name = "ui.focus", signature = "ui.focus(selector)", description = "Focus element matching selector", maps_to = "_ui_focus", params = ["string"], returns = "void" },
  { name = "ui.blur", signature = "ui.blur(selector)", description = "Blur element matching selector", maps_to = "_ui_blur", params = ["string"], returns = "void" },
  { name = "ui.getFocus", signature = "ui.getFocus() -> string", description = "Get selector path of currently focused element", maps_to = "_ui_get_focus", params = [], returns = "string" },
  { name = "ui.focusTrap", signature = "ui.focusTrap(selector) -> integer", description = "Trap keyboard focus within container; returns trap ID", maps_to = "_ui_focus_trap", params = ["string"], returns = "integer" },
  { name = "ui.focusTrapRelease", signature = "ui.focusTrapRelease(id)", description = "Release focus trap and restore previously focused element", maps_to = "_ui_focus_trap_release", params = ["integer"], returns = "void" },

  # --- Browser storage ---
  { name = "storage.local.get", signature = "storage.local.get(key) -> string", description = "Get value from localStorage", maps_to = "_storage_local_get", params = ["string"], returns = "string" },
  { name = "storage.local.set", signature = "storage.local.set(key, value)", description = "Set value in localStorage", maps_to = "_storage_local_set", params = ["string", "string"], returns = "void" },
  { name = "storage.local.remove", signature = "storage.local.remove(key)", description = "Remove key from localStorage", maps_to = "_storage_local_remove", params = ["string"], returns = "void" },
  { name = "storage.local.clear", signature = "storage.local.clear()", description = "Clear all localStorage entries", maps_to = "_storage_local_clear", params = [], returns = "void" },
  { name = "storage.session.get", signature = "storage.session.get(key) -> string", description = "Get value from sessionStorage", maps_to = "_storage_session_get", params = ["string"], returns = "string" },
  { name = "storage.session.set", signature = "storage.session.set(key, value)", description = "Set value in sessionStorage", maps_to = "_storage_session_set", params = ["string", "string"], returns = "void" },
  { name = "storage.session.remove", signature = "storage.session.remove(key)", description = "Remove key from sessionStorage", maps_to = "_storage_session_remove", params = ["string"], returns = "void" },
  { name = "storage.session.clear", signature = "storage.session.clear()", description = "Clear all sessionStorage entries", maps_to = "_storage_session_clear", params = [], returns = "void" },

  # --- File download ---
  { name = "ui.downloadText", signature = "ui.downloadText(filename, content, mimeType)", description = "Trigger browser download of in-memory text content", maps_to = "_ui_download_text", params = ["string", "string", "string"], returns = "void" },
  { name = "ui.downloadUrl", signature = "ui.downloadUrl(url, filename)", description = "Trigger browser download from a URL", maps_to = "_ui_download_url", params = ["string", "string"], returns = "void" },

  # --- Clipboard (async with callbacks) ---
  { name = "ui.clipboardWrite", signature = "ui.clipboardWrite(text, onSuccess, onError)", description = "Write text to clipboard; call onSuccess/onError handler names on completion", maps_to = "_ui_clipboard_write_cb", params = ["string", "string", "string"], returns = "void" },
  { name = "ui.clipboardRead", signature = "ui.clipboardRead(onSuccess, onError)", description = "Read text from clipboard; onSuccess called with text, onError with error message", maps_to = "_ui_clipboard_read_cb", params = ["string", "string"], returns = "void" },

  # --- HTTP fetch (async with callback) ---
  { name = "ui.fetch", signature = "ui.fetch(url, method, headersJson, body, handlerName) -> integer", description = "Issue an HTTP request with custom headers (e.g. Authorization). Handler called with (status:integer, body:string); status=0 for network failure, otherwise HTTP status code.", maps_to = "_ui_fetch_cb", params = ["string", "string", "string", "string", "string"], returns = "integer" },

  # --- Resize and Intersection Observers ---
  { name = "ui.resizeObserve", signature = "ui.resizeObserve(selector, handlerName) -> integer", description = "Observe element size changes; handler called with {width, height, selector} JSON", maps_to = "_ui_resize_observe", params = ["string", "string"], returns = "integer" },
  { name = "ui.resizeUnobserve", signature = "ui.resizeUnobserve(id)", description = "Stop resize observation by ID", maps_to = "_ui_resize_unobserve", params = ["integer"], returns = "void" },
  { name = "ui.intersectObserve", signature = "ui.intersectObserve(selector, handlerName, threshold) -> integer", description = "Observe element intersection; handler called with {selector, ratio, isVisible} JSON", maps_to = "_ui_intersect_observe", params = ["string", "string", "number"], returns = "integer" },
  { name = "ui.intersectUnobserve", signature = "ui.intersectUnobserve(id)", description = "Stop intersection observation by ID", maps_to = "_ui_intersect_unobserve", params = ["integer"], returns = "void" },

  # --- Toast / notification system ---
  { name = "toast.show", signature = "toast.show(text, variant, durationMs, position) -> integer", description = "Show toast notification; returns toast ID", maps_to = "_ui_toast", params = ["string", "string", "integer", "string"], returns = "integer" },
  { name = "toast.dismiss", signature = "toast.dismiss(id)", description = "Dismiss a toast by ID", maps_to = "_ui_toast_dismiss", params = ["integer"], returns = "void" },
  { name = "toast.dismissAll", signature = "toast.dismissAll()", description = "Dismiss all visible toasts", maps_to = "_ui_toast_dismiss_all", params = [], returns = "void" },
  { name = "toast.success", signature = "toast.success(text, variant, durationMs, position) -> integer", description = "Show success toast (pass variant='success')", maps_to = "_ui_toast", params = ["string", "string", "integer", "string"], returns = "integer" },
  { name = "toast.error", signature = "toast.error(text, variant, durationMs, position) -> integer", description = "Show error toast (pass variant='error')", maps_to = "_ui_toast", params = ["string", "string", "integer", "string"], returns = "integer" },
  { name = "toast.warning", signature = "toast.warning(text, variant, durationMs, position) -> integer", description = "Show warning toast (pass variant='warning')", maps_to = "_ui_toast", params = ["string", "string", "integer", "string"], returns = "integer" },
  { name = "toast.info", signature = "toast.info(text, variant, durationMs, position) -> integer", description = "Show info toast (pass variant='info')", maps_to = "_ui_toast", params = ["string", "string", "integer", "string"], returns = "integer" },

  # --- §14: Client-Side Navigation ---
  { name = "ui.navigate", signature = "ui.navigate(path)", description = "Soft-navigate to path without a full page reload", maps_to = "_ui_navigate", params = ["string"], returns = "void" },
  { name = "ui.historyPush", signature = "ui.historyPush(path, title)", description = "Push a new entry onto the browser history stack", maps_to = "_ui_history_push", params = ["string", "string"], returns = "void" },
  { name = "ui.historyReplace", signature = "ui.historyReplace(path, title)", description = "Replace the current browser history entry", maps_to = "_ui_history_replace", params = ["string", "string"], returns = "void" },
  { name = "ui.historyBack", signature = "ui.historyBack()", description = "Navigate back in browser history", maps_to = "_ui_history_back", params = [], returns = "void" },
  { name = "ui.historyForward", signature = "ui.historyForward()", description = "Navigate forward in browser history", maps_to = "_ui_history_forward", params = [], returns = "void" },
  { name = "ui.currentPath", signature = "ui.currentPath() -> string", description = "Get the current URL pathname and query string", maps_to = "_ui_current_path", params = [], returns = "string" },
]

# Auto-completion suggestions
completions = [
  { trigger = "component ", insert = "component: tag=\"${1:my-tag}\"\n\tinputs:\n\t\t${2:string} ${3:name}\n\n\thtml:\n\t\t<div>\n\t\t\t${4:content}\n\t\t</div>" },
  { trigger = "state:", insert = "state:\n\t${1:field}: ${2:value}" },
  { trigger = "render:", insert = "render:\n\t${1:// template}" },
  { trigger = "html:", insert = "html:\n\t<div>\n\t\t${1:content}\n\t</div>" },
  { trigger = "html: var", insert = "html: var=\"${1:name}\"\n\t<div>\n\t\t${2:content}\n\t</div>" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import.
# Render targets nest under app/ui/ so the "folder name = plugin name after the dot"
# rule holds: frame.ui → app/ui/, with web/, mobile/, desktop/ as target subfolders
# and shared/ for cross-platform code.
owns = ["app/ui", "app/ui/shared", "app/ui/web", "app/ui/web/pages", "app/ui/web/components", "app/ui/web/layouts"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln", "*.html"]

# Files in owned folders automatically import this plugin
implicit_import = true

[templates]
# Starter files created when plugin is added to a project
files = [
  { path = "app/ui/web/pages/index.html", template = "index.html" },
]

[enforcement]
severity = "warn"

restricted_functions = []

required_blocks = [
  { folder = "app/ui/web/components/", block = "component", message = "Component files should contain 'component' definitions" },
]

block_folder_rules = [
  { block = "component", allowed_in = ["app/ui/web/components/", "app/ui/shared/"], message = "component: blocks should be in app/ui/web/components/ or app/ui/shared/" },
]

[ai]
description = "HTML-first UI plugin. Define pages as .html files with Clean directives (cl-if, cl-iterate, cl-bind). Define reusable elements as component: blocks. All CSS authoring lives in public/css/*.css files; theme values (colors, spacing, radii) live in public/css/theme.css as CSS custom properties on :root and are consumed from other stylesheets via var(--color-*) / var(--spacing-*). Never write inline JavaScript, inline <style> tags, or style=\"...\" attributes."
constraints = [
  "Pages go in app/ui/web/pages/ as .html files — not as .cln files",
  "Reusable elements belong in component: blocks in app/ui/web/components/ or app/ui/shared/ for cross-platform components",
  "Use cl-iterate for lists — never build HTML strings by concatenation",
  "Use ui.formJson() to collect form inputs — never access DOM fields manually",
  "Event handlers must be exported Clean functions — never inline JS",
  "All CSS authoring lives in public/css/*.css — never write <style> tags or style=\"...\" attributes in pages or component html: blocks",
  "All theme values (colors, spacing, radii, shadows, font sizes) live in public/css/theme.css as CSS custom properties on :root — never declare them in .cln files, never hard-code them in other .css files; consume them via var(--color-name), var(--spacing-md), etc.",
  "Per-component CSS goes in public/css/components/<tag>.css — auto-linked by frame.ui the first time a component with that tag renders, deduplicated across instances",
  "Runtime style changes must use ui.setStyle / ui.setCssVar / ui.applyCssVars from a component event handler — never inject <style> elements or swap stylesheets at runtime",
]

[[ai.patterns]]
name = "css-and-theming"
use_when = "styling any app — the canonical rule for where CSS files live, where theme values are declared (public/css/theme.css), and how to consume them; read this before writing any .css or before adding class names to an html: block"
anti_pattern = "writing <style> tags or style=\"...\" attributes inside pages or component html: blocks, declaring theme values in .cln files, hard-coding colors and spacing in stylesheets instead of declaring them on :root in public/css/theme.css, putting CSS files anywhere other than public/css/, or injecting <style> elements at runtime — use public/css/theme.css for theme values, public/css/*.css for all other styling, and ui.setCssVar for runtime theme changes"
example = "patterns/css-and-theming.cln"

[[ai.patterns]]
name = "ssr-page-with-islands"
use_when = "building any page — this is the foundational structure pattern, read it first"
anti_pattern = "putting logic or data loading in the HTML file, or adding client='on' to every component — the HTML is a static shell; all data comes from the page endpoint; most content should stay client='off' and ship zero JS; only opt into hydration where genuine interactivity is needed"
example = "patterns/ssr-page-with-islands.cln"

[[ai.patterns]]
name = "form-with-validation"
use_when = "any user input form that must show per-field errors before submission"
anti_pattern = "validating only on submit and showing one generic error — validate on blur per field using cl-validate, show inline errors next to each field so users know exactly what to fix"
example = "patterns/form-with-validation.cln"

[[ai.patterns]]
name = "data-table"
use_when = "displaying a queryable, sortable, filterable list of records"
anti_pattern = "fetching all rows into the page and filtering client-side — for large datasets this is slow and leaks data; paginate server-side and pass page + sort as query params"
example = "patterns/data-table.cln"

[[ai.patterns]]
name = "live-search"
use_when = "a search or filter input that should narrow results as the user types"
anti_pattern = "re-fetching on every keystroke — debounce the input (wait 300ms after the user stops typing) and use cl-iterate to render results without a full page reload"
example = "patterns/live-search.cln"

[[ai.patterns]]
name = "modal-confirm"
use_when = "any destructive action (delete, deactivate, cancel subscription) triggered by a button click"
anti_pattern = "triggering the destructive action immediately on click — always show a confirm modal first; users click the wrong button, and destructive actions must require explicit confirmation"
example = "patterns/modal-confirm.cln"

[build]
built_with_compiler = "0.33.152"
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Database Demo</title>
</head>
<body>
	<h1>Database Demo</h1>
	<nav>
		<a href="/">Home</a> |
		<a href="/users">Users</a> |
		<a href="/posts">Posts</a>
	</nav>
	<hr>
	<p>This example demonstrates basic data operations with the Frame framework.</p>

	<h2>Available Endpoints</h2>
	<ul>
		<li><b>GET /users</b> - List all users (HTML)</li>
		<li><b>GET /posts</b> - List all posts (HTML)</li>
		<li><b>GET /api/users</b> - Get users (JSON)</li>
		<li><b>GET /api/posts</b> - Get posts (JSON)</li>
	</ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Todo App</title>
</head>
<body>
	<h1>Welcome to Todo App</h1>
	<p>A REST API built with Clean Framework.</p>

	<h2>API Endpoints</h2>
	<ul>
		<li>GET /api/todos - List all todos</li>
		<li>POST /api/todos - Create todo</li>
		<li>GET /api/todos/:id - Get todo</li>
		<li>PUT /api/todos/:id - Update todo</li>
		<li>DELETE /api/todos/:id - Delete todo</li>
	</ul>
</body>
</html>

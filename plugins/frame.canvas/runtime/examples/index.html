<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Language Canvas - Bouncing Ball</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { color: #4ecca3; margin-bottom: 20px; font-size: 18px; }
    #canvas-container { border: 2px solid #333; border-radius: 8px; overflow: hidden; }
    #canvas-container canvas { display: block; }
    .info { margin-top: 20px; color: #666; font-size: 12px; text-align: center; }
    .info code { background: #1a1a2e; padding: 2px 6px; border-radius: 4px; color: #4ecca3; }
    #status { margin-top: 10px; color: #888; font-size: 14px; }
    .demos { margin-top: 20px; }
    .demos a { color: #4ecca3; margin: 0 10px; text-decoration: none; }
    .demos a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>100% Clean Language - Compiled to WebAssembly</h1>
  <div id="canvas-container"></div>
  <div id="status">Loading WASM...</div>
  <div class="info">
    Source: <code>bouncing-balls.cln</code> &rarr; <code>bouncing-balls.wasm</code>
  </div>
  <div class="demos">
    <a href="index.html">Bouncing Ball</a>
    <a href="geometry.html">Celestial Geometry</a>
    <a href="dashboard.html">Analytics Pro</a>
    <a href="gallery.html">Orbital Gallery</a>
  </div>

  <script>
    // =========================================================================
    // WASM MEMORY RUNTIME
    // =========================================================================
    let memory = null;
    let heapPtr = 65536;
    const scopeStack = [];

    function mem_alloc(size) {
      size = (size + 7) & ~7;
      const ptr = heapPtr;
      heapPtr += size;
      new Uint8Array(memory.buffer, ptr, size).fill(0);
      return ptr;
    }
    function mem_retain(ptr) { return ptr; }
    function mem_release(ptr) {}
    function mem_scope_push() { scopeStack.push(heapPtr); }
    function mem_scope_pop() { if (scopeStack.length > 0) heapPtr = scopeStack.pop(); }

    // =========================================================================
    // STRING HELPERS
    // =========================================================================
    // ptr+len pair (expand_strings = true bridge functions)
    function readStr(ptr, len) {
      if (ptr === 0 || len <= 0) return '';
      return new TextDecoder().decode(new Uint8Array(memory.buffer, ptr, len));
    }
    // length-prefixed string (standard Clean string)
    function readString(ptr) {
      if (ptr === 0) return '';
      const len = new DataView(memory.buffer).getInt32(ptr, true);
      if (len <= 0) return '';
      return new TextDecoder().decode(new Uint8Array(memory.buffer, ptr + 4, len));
    }
    function writeString(str) {
      const bytes = new TextEncoder().encode(str);
      const ptr = mem_alloc(4 + bytes.length);
      new DataView(memory.buffer).setInt32(ptr, bytes.length, true);
      new Uint8Array(memory.buffer, ptr + 4, bytes.length).set(bytes);
      return ptr;
    }

    // =========================================================================
    // CANVAS BRIDGE — drawing primitives only, no application logic
    // =========================================================================
    const canvases = new Map();
    const canvasVars = {};
    let nextCanvasId = 1;
    let deltaTime = 0.016;
    let pointerX = 0;
    let pointerY = 0;
    let wasmInstance = null;

    const canvasBridge = {
      _canvas_init: (w, h, idPtr, idLen) => {
        const id = nextCanvasId++;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        canvases.set(id, { el: canvas, ctx, w, h, wantsAnimation: false });
        document.getElementById('canvas-container').appendChild(canvas);

        canvas.addEventListener('pointerdown', (e) => {
          const r = canvas.getBoundingClientRect();
          if (wasmInstance && wasmInstance.exports._on_pointer_down) {
            wasmInstance.exports._on_pointer_down(id, e.clientX - r.left, e.clientY - r.top);
          }
        });
        canvas.addEventListener('pointermove', (e) => {
          const r = canvas.getBoundingClientRect();
          pointerX = e.clientX - r.left;
          pointerY = e.clientY - r.top;
          if (wasmInstance && wasmInstance.exports._on_pointer_move) {
            wasmInstance.exports._on_pointer_move(id, pointerX, pointerY);
          }
        });
        canvas.addEventListener('pointerup', (e) => {
          const r = canvas.getBoundingClientRect();
          if (wasmInstance && wasmInstance.exports._on_pointer_up) {
            wasmInstance.exports._on_pointer_up(id, e.clientX - r.left, e.clientY - r.top);
          }
        });

        return id;
      },

      _canvas_set_fps: (id, fps) => 0,
      _canvas_clear: (id) => {
        const c = canvases.get(id);
        if (c) c.ctx.clearRect(0, 0, c.w, c.h);
        return 0;
      },
      _canvas_clear_color: (id, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.fillStyle = readStr(colorPtr, colorLen);
        c.ctx.fillRect(0, 0, c.w, c.h);
        return 0;
      },
      _canvas_present: (id) => 0,
      _canvas_circle: (id, x, y, r, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.beginPath();
        c.ctx.arc(x, y, r, 0, Math.PI * 2);
        c.ctx.strokeStyle = readStr(colorPtr, colorLen);
        c.ctx.stroke();
        return 0;
      },
      _canvas_circle_filled: (id, x, y, r, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.beginPath();
        c.ctx.arc(x, y, r, 0, Math.PI * 2);
        c.ctx.fillStyle = readStr(colorPtr, colorLen);
        c.ctx.fill();
        return 0;
      },
      _canvas_rect: (id, x, y, w, h, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.strokeStyle = readStr(colorPtr, colorLen);
        c.ctx.strokeRect(x, y, w, h);
        return 0;
      },
      _canvas_rect_filled: (id, x, y, w, h, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.fillStyle = readStr(colorPtr, colorLen);
        c.ctx.fillRect(x, y, w, h);
        return 0;
      },
      _canvas_line: (id, x1, y1, x2, y2, stroke, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.beginPath();
        c.ctx.moveTo(x1, y1);
        c.ctx.lineTo(x2, y2);
        c.ctx.strokeStyle = readStr(colorPtr, colorLen);
        c.ctx.lineWidth = stroke;
        c.ctx.stroke();
        c.ctx.lineWidth = 1;
        return 0;
      },
      _canvas_text: (id, textPtr, textLen, x, y, size, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.font = `${size}px sans-serif`;
        c.ctx.fillStyle = readStr(colorPtr, colorLen);
        c.ctx.fillText(readStr(textPtr, textLen), x, y);
        return 0;
      },
      _canvas_triangle: (id, x1, y1, x2, y2, x3, y3, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.beginPath();
        c.ctx.moveTo(x1, y1);
        c.ctx.lineTo(x2, y2);
        c.ctx.lineTo(x3, y3);
        c.ctx.closePath();
        c.ctx.fillStyle = readStr(colorPtr, colorLen);
        c.ctx.fill();
        return 0;
      },
      _canvas_ellipse: (id, x, y, rx, ry, colorPtr, colorLen) => {
        const c = canvases.get(id);
        if (!c) return -1;
        c.ctx.beginPath();
        c.ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        c.ctx.fillStyle = readStr(colorPtr, colorLen);
        c.ctx.fill();
        return 0;
      },
      _canvas_image: (id, srcPtr, srcLen, x, y, w, h) => 0,
      _canvas_save: (id) => { const c = canvases.get(id); if (c) c.ctx.save(); return 0; },
      _canvas_restore: (id) => { const c = canvases.get(id); if (c) c.ctx.restore(); return 0; },
      _canvas_translate: (id, x, y) => { const c = canvases.get(id); if (c) c.ctx.translate(x, y); return 0; },
      _canvas_rotate: (id, angle) => { const c = canvases.get(id); if (c) c.ctx.rotate(angle * Math.PI / 180); return 0; },
      _canvas_scale: (id, sx, sy) => { const c = canvases.get(id); if (c) c.ctx.scale(sx, sy); return 0; },
      _canvas_alpha: (id, a) => { const c = canvases.get(id); if (c) c.ctx.globalAlpha = a; return 0; },
      _canvas_request_frame: (id) => {
        const c = canvases.get(id);
        if (c) c.wantsAnimation = true;
        return 1;
      },
      _canvas_cancel_frame: (id) => {
        const c = canvases.get(id);
        if (c) c.wantsAnimation = false;
        return 0;
      },
      _canvas_get_delta_time: () => deltaTime,
      _canvas_get_time: () => performance.now() / 1000,
      _canvas_get_fps: () => deltaTime > 0 ? 1 / deltaTime : 60,
      _canvas_pointer_x: () => pointerX,
      _canvas_pointer_y: () => pointerY,
      _canvas_on_pointer: (id, cbPtr) => 0,
      _canvas_on_key: (id, cbPtr) => 0,

      // Canvas variable storage — dumb key-value store for Clean Language state persistence
      _canvas_var_set: (keyPtr, keyLen, value) => {
        const key = readStr(keyPtr, keyLen);
        canvasVars[key] = value;
        return 0;
      },
      _canvas_var_get: (keyPtr, keyLen, defaultVal) => {
        const key = readStr(keyPtr, keyLen);
        const v = canvasVars[key];
        return v !== undefined ? v : defaultVal;
      },
    };

    // =========================================================================
    // WASM LOADER
    // =========================================================================
    async function loadWasm() {
      const status = document.getElementById('status');
      try {
        status.textContent = 'Loading WASM...';
        const response = await fetch('bouncing-balls.wasm');
        const buffer = await response.arrayBuffer();

        status.textContent = 'Compiling...';
        const imports = {
          env: {
            print: (ptr, len) => console.log(readStr(ptr, len)),
            printl: (ptr, len) => console.log(readStr(ptr, len)),
            print_integer: (v) => console.log(v),
            input: () => 0,
            input_integer: () => 0,
            input_float: () => 0.0,
            input_yesno: () => 0,
            input_range: (a, b, c, d) => 0,
            float_to_string: (f) => writeString(f.toString()),
            int_to_string: (v) => writeString(v.toString()),
            string_to_float: (ptr) => parseFloat(readString(ptr)) || 0,
            string_to_int: (ptr) => parseInt(readString(ptr)) || 0,
            'string.concat': (a, b) => writeString(readString(a) + readString(b)),
            'string.split': (a, b) => 0,
            string_replace: (a, b, c, d) => a,
            string_length: (ptr) => { if (ptr === 0) return 0; return new DataView(memory.buffer).getInt32(ptr, true); },
            string_compare: (a, b) => readString(a) === readString(b) ? 0 : 1,
            'list.push_f64': (list, val) => 0,
            math_pow: Math.pow,
            math_sin: Math.sin,
            math_cos: Math.cos,
            math_tan: Math.tan,
            math_asin: Math.asin,
            math_acos: Math.acos,
            math_atan: Math.atan,
            math_atan2: Math.atan2,
            math_sinh: Math.sinh,
            math_cosh: Math.cosh,
            math_tanh: Math.tanh,
            math_ln: Math.log,
            math_log10: Math.log10,
            math_log2: Math.log2,
            math_exp: Math.exp,
            math_exp2: (x) => Math.pow(2, x),
            math_sqrt: Math.sqrt,
            math_abs: Math.abs,
            math_floor: Math.floor,
            math_ceil: Math.ceil,
            math_round: Math.round,
            math_random: Math.random,
            ...canvasBridge,
          },
          memory_runtime: { mem_alloc, mem_retain, mem_release, mem_scope_push, mem_scope_pop }
        };

        const { instance } = await WebAssembly.instantiate(buffer, imports);
        wasmInstance = instance;
        memory = instance.exports.memory;

        if (instance.exports.__heap_ptr) {
          heapPtr = instance.exports.__heap_ptr.value || 65536;
        }

        status.textContent = 'Running...';

        let lastTime = performance.now();
        function gameLoop() {
          const now = performance.now();
          deltaTime = Math.min((now - lastTime) / 1000, 0.05);
          lastTime = now;

          if (instance.exports._frame_callback) {
            for (const [id, canvas] of canvases) {
              if (canvas.wantsAnimation) {
                instance.exports._frame_callback(id);
              }
            }
          }
          requestAnimationFrame(gameLoop);
        }

        if (instance.exports.start) {
          instance.exports.start();
          if (instance.exports._frame_callback) {
            requestAnimationFrame(gameLoop);
            status.textContent = 'Running — click to relaunch ball';
            status.style.color = '#4ecca3';
          } else {
            status.textContent = 'Static render complete';
            status.style.color = '#4ecca3';
          }
        } else {
          status.textContent = 'Error: no start() export';
          status.style.color = '#ff6b6b';
        }

      } catch (err) {
        console.error('WASM Error:', err);
        status.textContent = `Error: ${err.message}`;
        status.style.color = '#ff6b6b';
      }
    }

    loadWasm();
  </script>
</body>
</html>

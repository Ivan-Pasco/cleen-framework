[plugin]
name = "frame.auth"
version = "2.0.0"
description = "Authentication and authorization plugin for Clean Language - provides sessions, JWT, roles/permissions, CSRF, and password hashing"
author = "Clean Language Team"
license = "MIT"

[compatibility]
min_compiler_version = "0.15.0"

[exports]
expand = "expand_block"
validate = "validate_block"
get_keywords = "get_keywords"

[handles]
blocks = ["auth", "protected", "login", "roles"]

# Bridge function declarations - auth-specific functions provided by the runtime
[bridge]
functions = [
  # Environment - Secrets
  { name = "_env_get", params = ["string"], returns = "string", description = "Get environment variable (for JWT_SECRET, etc.)", expand_strings = true },

  # Time - Token expiry
  { name = "_time_now", params = [], returns = "integer", description = "Get current Unix timestamp in seconds" },

  # Crypto - Random
  { name = "_crypto_random_hex", params = ["integer"], returns = "string", description = "Generate random hex string of specified byte length" },
  { name = "_crypto_random_bytes", params = ["integer"], returns = "string", description = "Generate random bytes (base64 encoded)" },

  # Crypto - Password Hashing (Argon2/bcrypt)
  { name = "_crypto_hash_password", params = ["string"], returns = "string", description = "Hash password using Argon2id", expand_strings = true },
  { name = "_crypto_verify_password", params = ["string", "string"], returns = "boolean", description = "Verify password against hash", expand_strings = true },

  # Crypto - General Hashing
  { name = "_crypto_hash_sha256", params = ["string"], returns = "string", description = "SHA-256 hash", expand_strings = true },
  { name = "_crypto_hash_sha512", params = ["string"], returns = "string", description = "SHA-512 hash", expand_strings = true },
  { name = "_crypto_hmac", params = ["string", "string", "string"], returns = "string", description = "HMAC: data, key, algorithm", expand_strings = true },

  # JWT - Token operations
  { name = "_jwt_sign", params = ["string", "string", "string"], returns = "string", description = "Sign JWT: payload, secret, algorithm", expand_strings = true },
  { name = "_jwt_verify", params = ["string", "string", "string"], returns = "string", description = "Verify JWT: token, secret, algorithm - returns payload or empty", expand_strings = true },
  { name = "_jwt_decode", params = ["string"], returns = "string", description = "Decode JWT without verification (for debugging)", expand_strings = true },

  # Session - Storage
  { name = "_session_store", params = ["string", "string"], returns = "integer", description = "Store session: sessionId, data - returns 1 on success", expand_strings = true },
  { name = "_session_get", params = ["string"], returns = "string", description = "Get session data by ID", expand_strings = true },
  { name = "_session_delete", params = ["string"], returns = "integer", description = "Delete session by ID - returns 1 on success", expand_strings = true },
  { name = "_session_exists", params = ["string"], returns = "integer", description = "Check if session exists (1=yes, 0=no)", expand_strings = true },

  # Session - CSRF
  { name = "_session_set_csrf", params = ["string"], returns = "integer", description = "Store CSRF token in current session", expand_strings = true },
  { name = "_session_get_csrf", params = [], returns = "string", description = "Get CSRF token from current session" },

  # Cookies
  { name = "_req_cookie", params = ["string"], returns = "string", description = "Get cookie value by name", expand_strings = true },
  { name = "_http_set_cookie", params = ["string", "string", "string"], returns = "string", description = "Set cookie: name, value, options", expand_strings = true },

  # Roles - Registration and checking
  { name = "_roles_register", params = ["string"], returns = "integer", description = "Register roles configuration (JSON)", expand_strings = true },
  { name = "_role_has_permission", params = ["string", "string"], returns = "boolean", description = "Check if role has permission", expand_strings = true },
  { name = "_role_get_permissions", params = ["string"], returns = "string", description = "Get all permissions for role (JSON array)", expand_strings = true },

  # Auth - Session Management
  { name = "_auth_set_session", params = ["string"], returns = "boolean", description = "Create session from JSON with user_id, role, claims; sets session cookie on response", expand_strings = true },
  { name = "_auth_clear_session", params = [], returns = "boolean", description = "Destroy current user session and clear session cookie; returns 1 on success, 0 if no session" },
  { name = "_auth_user_id", params = [], returns = "integer", description = "Get current authenticated user ID; returns 0 if not authenticated" },
  { name = "_auth_user_role", params = [], returns = "string", description = "Get current authenticated user role; returns empty string if unauthenticated" },

  # JSON helpers
  { name = "_json_get", params = ["string", "string"], returns = "string", description = "Get nested value from JSON: json, path (e.g., 'claims.role')", expand_strings = true },
]

[language]
# Block-level keywords that start a declaration
blocks = ["auth", "protected", "login", "roles"]

# Keywords used within plugin context
keywords = [
  { name = "session", description = "Session configuration block", context = "block" },
  { name = "jwt", description = "JWT configuration block", context = "block" },
  { name = "cookie", description = "Session cookie name", context = "config" },
  { name = "sameSite", description = "Cookie SameSite attribute (Strict, Lax, None)", context = "config" },
  { name = "secure", description = "Cookie Secure flag (HTTPS only)", context = "config" },
  { name = "httpOnly", description = "Cookie HttpOnly flag (no JS access)", context = "config" },
  { name = "timeoutMinutes", description = "Session timeout in minutes", context = "config" },
  { name = "enabled", description = "Enable/disable feature", context = "config" },
  { name = "secret", description = "JWT secret source (use $ENV_VAR)", context = "config" },
  { name = "alg", description = "JWT signing algorithm (HS256, HS384, HS512)", context = "config" },
  { name = "ttlMinutes", description = "JWT token TTL in minutes", context = "config" },
  { name = "refreshTtlMinutes", description = "JWT refresh token TTL in minutes", context = "config" },
  { name = "require", description = "Required role/permission for access", context = "block" },
  { name = "roles", description = "Role definitions block", context = "block" },
  { name = "permissions", description = "Permission definitions for a role", context = "block" },
  { name = "csrf", description = "CSRF protection configuration", context = "config" },
]

# Custom types provided by the plugin
types = [
  { name = "Session", description = "User session object" },
  { name = "User", description = "Authenticated user context" },
  { name = "Role", description = "User role type" },
  { name = "Permission", description = "Permission string type" },
]

# Built-in functions/expressions (generated by plugin expand)
functions = [
  { name = "session_create", signature = "session_create(userId, claims)", description = "Create a new session and return session ID" },
  { name = "session_setCookie", signature = "session_setCookie(sessionId)", description = "Set session cookie on response" },
  { name = "session_get", signature = "session_get()", description = "Get current session data (checks expiry)" },
  { name = "session_destroy", signature = "session_destroy()", description = "End session and clear cookie" },
  { name = "jwt_sign", signature = "jwt_sign(claims)", description = "Sign JWT with configured secret and algorithm" },
  { name = "jwt_verify", signature = "jwt_verify(token)", description = "Verify JWT and return payload or empty string" },
  { name = "jwt_refresh", signature = "jwt_refresh(refreshToken)", description = "Refresh a JWT token" },
  { name = "hashPassword", signature = "hashPassword(password)", description = "Hash password with Argon2id" },
  { name = "verifyPassword", signature = "verifyPassword(password, hash)", description = "Verify password against Argon2id hash" },
  { name = "can", signature = "can(permission)", description = "Check if current user has permission" },
  { name = "hasRole", signature = "hasRole(role)", description = "Check if current user has specific role" },
  { name = "getCurrentUser", signature = "getCurrentUser()", description = "Get current authenticated user session data" },
  { name = "isAuthenticated", signature = "isAuthenticated()", description = "Check if request is authenticated" },
  { name = "csrf_generate", signature = "csrf_generate()", description = "Generate CSRF token for current session" },
  { name = "csrf_validate", signature = "csrf_validate(token)", description = "Validate CSRF token against session" },
  { name = "tenant_getId", signature = "tenant_getId()", description = "Get current tenant ID from session claims" },
  { name = "tenant_require", signature = "tenant_require()", description = "Require a valid tenant context, returns tenant ID or empty string" },
  { name = "tenant_matches", signature = "tenant_matches(tenantId)", description = "Check if current user belongs to the given tenant" },
]

# Auto-completion suggestions
completions = [
  { trigger = "auth:", insert = "auth:\n\tsession:\n\t\tcookie = \"${1:app.sid}\"\n\t\ttimeoutMinutes = ${2:60}" },
  { trigger = "roles:", insert = "roles:\n\tadmin: [\"*\"]\n\tuser: [${1:}]\n\tguest: []" },
  { trigger = "protected ", insert = "protected ${1:resource}:\n\trequire: ${2:role}" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/auth"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln"]

# Files in owned folders automatically import this plugin
implicit_import = true

[templates]
# Starter files created when plugin is added to a project
files = [
  { path = "app/auth/auth.cln", template = "auth.cln" },
  { path = "app/auth/project.cln", template = "project.cln" },
]

[enforcement]
severity = "warn"

restricted_functions = [
  { name = "_jwt_sign", use_instead = "auth: jwt: config", message = "Use auth: block JWT configuration instead of raw _jwt_sign()" },
  { name = "_session_store", use_instead = "auth: session: config", message = "Use auth: block session configuration instead of raw session functions" },
]

block_folder_rules = [
  { block = "auth", allowed_in = ["app/auth/", "app/backend/", "app/server/"], message = "auth: config should be in app/auth/" },
]

[plugin]
name = "frame.auth"
version = "2.1.1"
description = "Authentication and authorization plugin for Clean Language - provides sessions, JWT, roles/permissions, CSRF, and password hashing"
author = "Clean Language Team"
license = "MIT"

[compatibility]
min_compiler_version = "0.15.0"

[lifecycle]
# Plugin Contracts v2 — foundation/spec/plugins/contracts/lifecycle.md §3.1.
# Tag preamble-emitted helpers (currentUser, hasRole, etc.) as BFS roots so
# their bridge imports stay reachable when user code only reaches them
# through plugin-generated guards. Applies to v1.0.0 __preamble output too.
module_helpers_are_roots = true

[exports]
expand = "expand_block"
validate = "validate_block"
get_keywords = "get_keywords"

[handles]
blocks = ["auth", "login", "roles"]

# Bridge function declarations - auth-specific functions provided by the runtime
# Plugin Contracts v2 — foundation/spec/plugins/contracts/bridge-host-classes.md §2:
#   hosts = ["all"]    — Layer 2 portable (crypto, time, pure JSON helpers)
#   hosts = ["server"] — Layer 3 server-only (sessions, JWT secrets, cookies, role state)
[bridge]
functions = [
  # Environment - Secrets (server-only; browser has no .env file)
  { name = "_env_get", params = ["string"], returns = "ptr", description = "Get environment variable (for JWT_SECRET, etc.)", expand_strings = true, hosts = ["server"] },

  # Time - Token expiry (portable Layer 2)
  { name = "_time_now", params = [], returns = "i64", description = "Get current Unix timestamp in seconds", hosts = ["all"] },

  # Crypto - Random (portable Layer 2; browsers have Web Crypto API)
  { name = "_crypto_random_hex", params = ["i32"], returns = "ptr", description = "Generate random hex string of specified byte length", hosts = ["all"] },
  { name = "_crypto_random_bytes", params = ["i32"], returns = "ptr", description = "Generate random bytes (base64 encoded)", hosts = ["all"] },

  # Crypto - Password Hashing (Argon2/bcrypt) — portable Layer 2
  { name = "_crypto_hash_password", params = ["string"], returns = "ptr", description = "Hash password using Argon2id", expand_strings = true, hosts = ["all"] },
  { name = "_crypto_verify_password", params = ["string", "string"], returns = "boolean", description = "Verify password against hash (1=match, 0=no match)", expand_strings = true, hosts = ["all"] },

  # Crypto - General Hashing (portable Layer 2)
  { name = "_crypto_hash_sha256", params = ["string"], returns = "ptr", description = "SHA-256 hash", expand_strings = true, hosts = ["all"] },
  { name = "_crypto_hash_sha512", params = ["string"], returns = "ptr", description = "SHA-512 hash", expand_strings = true, hosts = ["all"] },
  { name = "_crypto_hmac", params = ["string", "string", "string"], returns = "ptr", description = "HMAC: data, key, algorithm", expand_strings = true, hosts = ["all"] },

  # JWT - Token operations (server-only; signing requires the JWT_SECRET)
  { name = "_jwt_sign", params = ["string", "string", "string"], returns = "ptr", description = "Sign JWT: payload, secret, algorithm", expand_strings = true, hosts = ["server"] },
  { name = "_jwt_verify", params = ["string", "string", "string"], returns = "ptr", description = "Verify JWT: token, secret, algorithm - returns payload or empty", expand_strings = true, hosts = ["server"] },
  { name = "_jwt_decode", params = ["string"], returns = "ptr", description = "Decode JWT without verification (for debugging)", expand_strings = true, hosts = ["server"] },

  # Session - Storage (server-only; sessions live in server-side store)
  { name = "_session_store", params = ["string", "string", "string", "i32", "i32"], returns = "boolean", description = "Store session: sessionId, key (empty=blob), data, ttl, flags - returns 1 on success", hosts = ["server"] },
  { name = "_session_get", params = [], returns = "ptr", description = "Get current session data from request context - returns session data or empty string", hosts = ["server"] },
  { name = "_session_delete", params = [], returns = "boolean", description = "Delete current session from request context - returns 1 if deleted, 0 if not found", hosts = ["server"] },
  { name = "_session_exists", params = ["string"], returns = "boolean", description = "Check if session exists by ID (1=yes, 0=no)", expand_strings = true, hosts = ["server"] },

  # Session - CSRF (server-only)
  { name = "_session_set_csrf", params = ["string"], returns = "boolean", description = "Store CSRF token in current session", expand_strings = true, hosts = ["server"] },
  { name = "_session_get_csrf", params = [], returns = "ptr", description = "Get CSRF token from current session", hosts = ["server"] },

  # Cookies (server-only; HTTP request/response context)
  { name = "_req_cookie", params = ["string"], returns = "ptr", description = "Get cookie value by name", expand_strings = true, hosts = ["server"] },
  { name = "_http_set_cookie", params = ["string", "string"], returns = "boolean", description = "Set cookie: name, value (length-prefixed ptrs); server applies Path=/ HttpOnly defaults", hosts = ["server"] },
  { name = "_http_set_header", params = ["string", "string"], returns = "void", description = "Set HTTP response header: name, value (length-prefixed ptrs); used by session_setCookie/session_destroy to emit Set-Cookie with full attribute control", expand_strings = true, hosts = ["server"] },

  # Roles - Registration and checking (server-only; role state held on server)
  { name = "_roles_register", params = ["string"], returns = "boolean", description = "Register roles configuration (JSON)", expand_strings = true, hosts = ["server"] },
  { name = "_role_has_permission", params = ["string", "string"], returns = "boolean", description = "Check if role has permission (1=yes, 0=no)", expand_strings = true, hosts = ["server"] },
  { name = "_role_get_permissions", params = ["string"], returns = "ptr", description = "Get all permissions for role (JSON array)", expand_strings = true, hosts = ["server"] },

  # Auth - Session Management (server-only)
  { name = "_auth_set_session", params = ["string"], returns = "boolean", description = "Create session from JSON with user_id, role, claims; sets session cookie on response (1=success, 0=fail)", expand_strings = true, hosts = ["server"] },
  { name = "_auth_clear_session", params = [], returns = "boolean", description = "Destroy current user session and clear session cookie (1=success, 0=no session)", hosts = ["server"] },
  { name = "_auth_user_id", params = [], returns = "i32", description = "Get current authenticated user ID; returns 0 if not authenticated", hosts = ["server"] },
  { name = "_auth_user_role", params = [], returns = "ptr", description = "Get current authenticated user role; returns empty string if unauthenticated", hosts = ["server"] },

  # JSON helpers (pure compute — portable Layer 2)
  { name = "_json_get", params = ["string", "string"], returns = "ptr", description = "Get nested value from JSON: json, path (e.g., 'claims.role')", expand_strings = true, hosts = ["all"] },
]

[language]
# Block-level keywords that start a declaration
blocks = ["auth", "login", "roles"]

# Keywords used within plugin context
keywords = [
  { name = "session", description = "Session configuration block", context = "block" },
  { name = "jwt", description = "JWT configuration block", context = "block" },
  { name = "cookie", description = "Session cookie name", context = "config" },
  { name = "sameSite", description = "Cookie SameSite attribute (Strict, Lax, None)", context = "config" },
  { name = "secure", description = "Cookie Secure flag (HTTPS only)", context = "config" },
  { name = "httpOnly", description = "Cookie HttpOnly flag (no JS access)", context = "config" },
  { name = "timeoutMinutes", description = "Session timeout in minutes", context = "config" },
  { name = "enabled", description = "Enable/disable feature", context = "config" },
  { name = "secret", description = "JWT secret source (use env.get(\"VAR_NAME\"))", context = "config" },
  { name = "alg", description = "JWT signing algorithm (HS256, HS384, HS512)", context = "config" },
  { name = "ttlMinutes", description = "JWT token TTL in minutes", context = "config" },
  { name = "refreshTtlMinutes", description = "JWT refresh token TTL in minutes", context = "config" },
  { name = "require", description = "Required role/permission for access", context = "block" },
  { name = "roles", description = "Role definitions block", context = "block" },
  { name = "permissions", description = "Permission definitions for a role", context = "block" },
  { name = "csrf", description = "CSRF protection configuration", context = "config" },
]

# Custom types provided by the plugin
types = [
  { name = "Session", description = "User session object" },
  { name = "User", description = "Authenticated user context" },
  { name = "Role", description = "User role type" },
  { name = "Permission", description = "Permission string type" },
]

# Built-in functions/expressions (generated by plugin expand)
functions = [
  { name = "auth.session.create", signature = "auth.session.create(userId, claims)", description = "Create a new session and return session ID" },
  { name = "auth.session.setCookie", signature = "auth.session.setCookie(sessionId)", description = "Set session cookie on response" },
  { name = "auth.session.get", signature = "auth.session.get()", description = "Get current session data (checks expiry)", maps_to = "_session_get", params = [], returns = "string" },
  { name = "auth.session.destroy", signature = "auth.session.destroy()", description = "End session and clear cookie", maps_to = "_auth_clear_session", params = [], returns = "boolean" },
  { name = "auth.jwt.sign", signature = "auth.jwt.sign(claims)", description = "Sign JWT with configured secret and algorithm" },
  { name = "auth.jwt.verify", signature = "auth.jwt.verify(token)", description = "Verify JWT and return payload or empty string" },
  { name = "auth.jwt.refresh", signature = "auth.jwt.refresh(refreshToken)", description = "Refresh a JWT token" },
  { name = "auth.hashPassword", signature = "auth.hashPassword(password)", description = "Hash password with Argon2id", maps_to = "_crypto_hash_password", params = ["string"], returns = "string" },
  { name = "auth.verifyPassword", signature = "auth.verifyPassword(password, hash)", description = "Verify password against Argon2id hash", maps_to = "_crypto_verify_password", params = ["string", "string"], returns = "boolean" },

  # crypto.* namespace — direct password / random / HMAC operations.
  # Parallel to auth.hashPassword / auth.verifyPassword (which delegate to the same bridges)
  # but exposed under the crypto.* namespace for code that does not need the auth context.
  { name = "crypto.hashPassword",   signature = "crypto.hashPassword(password)",                  description = "Hash password with Argon2id",                                                                          maps_to = "_crypto_hash_password",   params = ["string"],                       returns = "string" },
  { name = "crypto.verifyPassword", signature = "crypto.verifyPassword(password, hash)",          description = "Verify password against Argon2id hash",                                                                  maps_to = "_crypto_verify_password", params = ["string", "string"],             returns = "boolean" },
  { name = "crypto.randomBytes",    signature = "crypto.randomBytes(n)",                          description = "Generate N cryptographically random bytes; returns base64-encoded result",                              maps_to = "_crypto_random_bytes",    params = ["integer"],                      returns = "string" },
  { name = "crypto.randomHex",      signature = "crypto.randomHex(n)",                            description = "Generate N cryptographically random bytes; returns lowercase hex string (2N chars)",                    maps_to = "_crypto_random_hex",      params = ["integer"],                      returns = "string" },
  { name = "crypto.hmac",           signature = "crypto.hmac(data, key, algo)",                   description = "Compute HMAC using 'sha256' or 'sha512'; returns hex string",                                            maps_to = "_crypto_hmac",            params = ["string", "string", "string"],   returns = "string" },

  { name = "auth.can", signature = "auth.can(permission)", description = "Check if current user has permission" },
  { name = "auth.hasRole", signature = "auth.hasRole(role)", description = "Check if current user has specific role" },
  { name = "auth.getCurrentUser", signature = "auth.getCurrentUser()", description = "Get current authenticated user session data" },
  { name = "auth.isAuthenticated", signature = "auth.isAuthenticated()", description = "Check if request is authenticated" },
  { name = "auth.csrf.generate", signature = "auth.csrf.generate()", description = "Generate CSRF token for current session" },
  { name = "auth.csrf.validate", signature = "auth.csrf.validate(token)", description = "Validate CSRF token against session" },
  { name = "auth.tenant.getId", signature = "auth.tenant.getId()", description = "Get current tenant ID from session claims" },
  { name = "auth.tenant.require", signature = "auth.tenant.require()", description = "Require a valid tenant context, returns tenant ID or empty string" },
  { name = "auth.tenant.matches", signature = "auth.tenant.matches(tenantId)", description = "Check if current user belongs to the given tenant" },

  # Spec-canonical aliases (foundation/spec/stdlib-reference.md §14) — language-level
  # signatures the compiler previously hardcoded in src/resolver/symbol_table.rs.
  # These are direct one-to-one bridge aliases; the richer auth.session.*, auth.jwt.*
  # wrappers above are preserved for application code.
  { name = "auth.setSession", signature = "auth.setSession(json)", description = "Create session from JSON with user_id, role, claims; sets session cookie", maps_to = "_auth_set_session", params = ["string"], returns = "boolean" },
  { name = "auth.clearSession", signature = "auth.clearSession()", description = "Destroy current user session and clear session cookie", maps_to = "_auth_clear_session", params = [], returns = "boolean" },
  { name = "auth.userId", signature = "auth.userId()", description = "Get current authenticated user ID (0 if unauthenticated)", maps_to = "_auth_user_id", params = [], returns = "integer" },
  { name = "auth.userRole", signature = "auth.userRole()", description = "Get current authenticated user role (empty string if unauthenticated)", maps_to = "_auth_user_role", params = [], returns = "string" },
  { name = "session.get", signature = "session.get()", description = "Get current session data as JSON string", maps_to = "_session_get", params = [], returns = "string" },
  { name = "session.delete", signature = "session.delete()", description = "Delete current session from request context", maps_to = "_session_delete", params = [], returns = "boolean" },
  { name = "session.exists", signature = "session.exists(id)", description = "Check if session exists by ID", maps_to = "_session_exists", params = ["string"], returns = "boolean" },
  { name = "jwt.sign", signature = "jwt.sign(payload, secret, algo)", description = "Sign JWT with payload (JSON), secret, and algorithm (HS256/HS384/HS512)", maps_to = "_jwt_sign", params = ["string", "string", "string"], returns = "string" },
  { name = "jwt.verify", signature = "jwt.verify(token, secret, algo)", description = "Verify JWT and return payload as JSON string, or empty string if invalid", maps_to = "_jwt_verify", params = ["string", "string", "string"], returns = "string" },
  { name = "jwt.decode", signature = "jwt.decode(token)", description = "Decode JWT without signature verification (for debugging); returns payload JSON", maps_to = "_jwt_decode", params = ["string"], returns = "string" },
]

# Auto-completion suggestions
completions = [
  { trigger = "auth:", insert = "auth:\n\tsession:\n\t\tcookie = \"${1:app.sid}\"\n\t\ttimeoutMinutes = ${2:60}" },
  { trigger = "roles:", insert = "roles:\n\tadmin: [\"*\"]\n\tuser: [${1:}]\n\tguest: []" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/auth"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln"]

# Files in owned folders automatically import this plugin
implicit_import = true

[templates]
# Starter files created when plugin is added to a project
files = [
  { path = "app/auth/auth.cln", template = "auth.cln" },
  { path = "app/auth/project.cln", template = "project.cln" },
]

[enforcement]
severity = "warn"

restricted_functions = [
  { name = "_jwt_sign", use_instead = "auth: jwt: config", message = "Use auth: block JWT configuration instead of raw _jwt_sign()" },
  { name = "_session_store", use_instead = "auth: session: config", message = "Use auth: block session configuration instead of raw session functions" },
]

block_folder_rules = [
  { block = "auth", allowed_in = ["app/auth/", "app/backend/", "app/server/"], message = "auth: config should be in app/auth/" },
]

[ai]
description = "Authentication and authorization plugin. Use the auth: block for configuration, the inline [role] route modifier (e.g. GET \"/path\" [admin]:) for route protection, and auth.* functions for session/JWT/role checks. Never implement your own password hashing or token signing."
constraints = [
  "Always use auth.hashPassword / auth.verifyPassword — never implement your own hashing",
  "Never sign JWTs manually — use auth.jwt.sign with the secret read via env.get(\"VAR_NAME\")",
  "Role checks belong on the route header as an inline [role] modifier (e.g. GET \"/path\" [admin]:), not inline if statements in handlers",
  "Read tenant_id from auth.tenant.getId() — never from user-supplied body or query params",
]

[[ai.patterns]]
name = "role-based-access"
use_when = "different user types (admin, editor, viewer) have different permissions to routes or features"
anti_pattern = "checking user.role == 'admin' inline inside handler logic — declare roles in the auth: roles: block and apply the inline [admin] modifier on the route header (e.g. GET \"/path\" [admin]:) so the check is enforced before the handler runs"
example = "patterns/role-based-access.cln"

[[ai.patterns]]
name = "password-reset"
use_when = "users need a way to recover access when they forget their password"
anti_pattern = "emailing a plain temporary password or a short numeric code — generate a signed, single-use token with a short TTL (15 min), store its hash, and invalidate on use"
example = "patterns/password-reset.cln"

[[ai.patterns]]
name = "session-scoped-tenant"
use_when = "a multi-tenant app where each session belongs to exactly one tenant"
anti_pattern = "accepting tenant_id from the request body or query string — an attacker can forge it; always read it from the authenticated session via auth.tenant.getId()"
example = "patterns/session-scoped-tenant.cln"

[[ai.patterns]]
name = "csrf-protection"
use_when = "any server-rendered form that mutates state (login, settings, payments)"
anti_pattern = "no CSRF protection on POST endpoints — a third-party site can submit a form as the logged-in user; generate a token with auth.csrf.generate(), embed it in the form, and validate with auth.csrf.validate() on every mutation"
example = "patterns/csrf-protection.cln"

[build]
built_with_compiler = "0.30.381"
name: Release Frame Framework

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Frame Framework v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          body: |
            # Frame Framework v${{ steps.get_version.outputs.version }}

            Full-stack WebAssembly framework for Clean Language

            ## Installation

            ```bash
            cleen install frame
            ```

            Or download the plugin package below and extract to your project.

            ## Included Plugins

            - **frame.auth** - Authentication and authorization
            - **frame.canvas** - Canvas rendering and game development
            - **frame.client** - Client-side communication (HTTP, WebSocket, SSE)
            - **frame.data** - ORM and database operations
            - **frame.locale** - Internationalization and localization
            - **frame.jobs** - Background job queue and cron scheduling
            - **frame.mcp** - MCP server (tools, resources, prompts for AI agents)
            - **frame.server** - HTTP server runtime
            - **frame.ui** - UI components and rendering

            ## What's New

            See [CHANGELOG.md](https://github.com/Ivan-Pasco/cleen-framework/blob/main/CHANGELOG.md) for details.

  package-plugins:
    name: Package Plugins
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create plugin package
        run: |
          mkdir -p frame-plugins-${{ needs.create-release.outputs.version }}

          # Copy all plugin directories
          cp -r plugins/frame.auth frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.canvas frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.client frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.data frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.locale frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.jobs frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.mcp frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.server frame-plugins-${{ needs.create-release.outputs.version }}/
          cp -r plugins/frame.ui frame-plugins-${{ needs.create-release.outputs.version }}/

          # Create README
          cat > frame-plugins-${{ needs.create-release.outputs.version }}/README.txt << 'EOF'
          Frame Framework Plugins v${{ needs.create-release.outputs.version }}

          Installation:

          1. Extract this archive to your project's plugins directory
          2. Or install via cleen: cleen install frame

          Included Plugins:
          - frame.auth - Authentication and authorization
          - frame.canvas - Canvas rendering and game development
          - frame.client - Client-side communication (HTTP, WebSocket, SSE)
          - frame.data - ORM and database operations
          - frame.locale - Internationalization and localization
          - frame.jobs - Background job queue and cron scheduling
          - frame.mcp - MCP server (tools, resources, prompts for AI agents)
          - frame.server - HTTP server runtime
          - frame.ui - UI components and rendering

          Documentation: https://github.com/Ivan-Pasco/cleen-framework
          EOF

      - name: Create archive
        run: |
          tar czf frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz -C frame-plugins-${{ needs.create-release.outputs.version }} .

      - name: Generate checksum
        run: |
          sha256sum frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz > frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz.sha256

      - name: Upload plugin archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz
          asset_name: frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz.sha256
          asset_name: frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz.sha256
          asset_content_type: text/plain

  update-manifest:
    name: Update Version Manifest
    needs: [create-release, package-plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create version manifest
        run: |
          cat > version-manifest.json << EOF
          {
            "version": "${{ needs.create-release.outputs.version }}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "plugins": {
              "frame.auth": "included",
              "frame.canvas": "included",
              "frame.client": "included",
              "frame.data": "included",
              "frame.locale": "included",
              "frame.jobs": "included",
              "frame.mcp": "included",
              "frame.server": "included",
              "frame.ui": "included"
            },
            "download": "https://github.com/Ivan-Pasco/cleen-framework/releases/download/v${{ needs.create-release.outputs.version }}/frame-plugins-${{ needs.create-release.outputs.version }}.tar.gz"
          }
          EOF

      - name: Upload manifest
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./version-manifest.json
          asset_name: version-manifest.json
          asset_content_type: application/json

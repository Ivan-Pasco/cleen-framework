  { name = "_ui_insert_at_cursor", params = ["string", "string", "string"], returns = "integer", description = "Wrap selection or insert at cursor: selector, beforeMarker, afterMarker; returns new cursor position", expand_strings = true, signature = "_ui_insert_at_cursor(selector, before, after) -> integer", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_text_diff", params = ["string", "string", "string"], returns = "integer", description = "Word-level LCS diff between two elements rendered into a third: selectorA, selectorB, selectorOut", expand_strings = true, signature = "_ui_text_diff(selectorA, selectorB, selectorOut) -> integer", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # Keyboard shortcuts
  { name = "_ui_shortcut_register", params = ["string", "string", "string"], returns = "integer", description = "Register global keyboard shortcut: key descriptor (e.g. mod+shift+s), handler name, scope (global or CSS selector)", expand_strings = true, signature = "_ui_shortcut_register(keys, handlerName, scope)", hosts = ["browser"] },

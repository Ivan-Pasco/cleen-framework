<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Ball - Clean Language Canvas Demo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
        }
        h1 {
            margin-bottom: 10px;
        }
        #canvas-container {
            border: 2px solid #4ecca3;
            border-radius: 8px;
            overflow: hidden;
        }
        #status {
            margin-top: 10px;
            color: #888;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Animated Ball Demo</h1>
    <div id="canvas-container"></div>
    <div id="status">Loading...</div>

    <script src="../canvas-bridge.js"></script>
    <script src="../loader.js"></script>
    <script>
        const status = document.getElementById('status');

        async function main() {
            try {
                status.textContent = 'Loading WASM module...';

                const app = await CleanCanvas.load('animated-ball.wasm');

                status.textContent = 'Starting animation...';
                app.start();

                status.textContent = 'Animation running';

            } catch (err) {
                console.error('Failed to load:', err);
                status.textContent = 'Error: ' + err.message;
            }
        }

        main();
    </script>
</body>
</html>

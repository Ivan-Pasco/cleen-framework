[plugin]
name = "frame.ui"
version = "2.12.7"
description = "HTML-first UI framework plugin - processes HTML pages with custom tags, event handling, hydration, and component definitions"
author = "Clean Language Team"
license = "MIT"

[compatibility]
# Bumped to 0.30.273 for HYDRATE_AUTO Gap 2 closure. Requires the compiler to:
#   1. Recognize events: as a class-body section (shipped in 0.30.271 — earlier
#      claim was correct; my misread of a stale install state caused the v2.12.5
#      rollback panic).
#   2. Tag each events:-method's compiler-synthesized bare-name thunk with
#      PLUGIN_OUTPUT_V2_ROOT_MARKER so it survives BFS exclusion + DCE. Shipped
#      in 0.30.273 — the actual gap the verification protocol caught.
# With this floor in place, normalize_handlers can safely pass events: through
# to the compiler. End-to-end verified locally: 4-handler events: block produces
# 4 bare-name exports in frontend.wasm.
min_compiler_version = "0.30.273"

[lifecycle]
# Plugin Contracts v2 — foundation/spec/plugins/contracts/lifecycle.md §3.1.
# frame.ui's preamble emits SSR helpers (render, renderWith) that call
# _ui_render_page. Without this flag, the BFS would tree-shake the helpers
# (and their bridge import) when user code doesn't statically call render().
# Added in v2.10.138 alongside the move of _ui_render_page from frame.server.
module_helpers_are_roots = true

# Plugin Contracts v2 — foundation/spec/plugins/contracts/lifecycle.md §3.3.
# Client-mode build: the compiler invokes this slot once and splices the
# returned statements into the synthetic client `_start` body. For each
# component class with `client != "off"`, the slot emits an instantiation
# call and an onMount() invocation. Closes HYDRATE_AUTO.
#
# History:
#   v2.10.139 — reverted (param-convention mismatch, fixed in compiler 0.30.259).
#   v2.10.141 — reverted (return-type mismatch, fixed in compiler 0.30.260).
#   v2.10.143 — reverted (runtime trap, fixed in compiler 0.30.261).
#   v2.10.145 — fourth attempt, this version. Re-applied on top of 0.30.261.
client_init = "emit_ui_client_init"

# Plugin Contracts v2 — foundation/spec/plugins/contracts/artifacts.md §4.1.
# Declares `frontend.wasm` as a side-channel build artifact. Produced only
# when at least one plugin declares `client_init` (predicate match), which
# this plugin does above. The compiler triggers a nested client-only build
# via from_module = "client_only_build" and writes the bytes to
# {output_dir}/frontend.wasm.
[[artifacts]]
name            = "frontend.wasm"
purpose         = "client_hydration"
emit            = { from_module = "client_only_build" }
output_relative = "{output_dir}/frontend.wasm"
required_when   = "has_client_init"
public          = true
content_type    = "application/wasm"

# SSR HTML rendering can exhaust the 32 MB standard tier on large pages.
# Honored by compiler >= 0.30.57; older compilers silently use target defaults.
# See foundation/platform-architecture/MEMORY_POLICY.md §2.2 and §3 (heavy tier: 64 initial / 1024 max pages).
[memory]
tier = "heavy"

[exports]
# HTML page processing (main entry point for pages)
process_html = "process_html"

# Component block expansion (for .cln component definitions)
expand = "expand_block"

# Block-level validation for component/page/layout (returns error message or "")
validate = "validate_block"

# HTML validation against component registry
validate_html = "validate_html"

# Page metadata extraction
get_page_meta = "get_page_meta"

# IDE keyword support
get_keywords = "get_keywords"

# Plugin assembly hook — scans source files for page companions, prefixes their
# load()/guard() functions, and generates a synthetic route module when
# has_frame_server=true. Required by compiler >= 0.30.213.
assemble = "assemble"

[handles]
blocks = ["component", "page", "html", "ui"]

[html]
# File extensions processed as HTML pages
extensions = [".html"]

# Directives recognized in HTML
directives = ["cl-if", "cl-else", "cl-iterate", "cl-bind", "cl-client", "cl-slot", "cl-show", "cl-validate", "cl-preview", "cl-stream", "cl-transition", "cl-boundary"]

# Event attributes recognized (with modifiers like .prevent, .stop)
# Extended in §FEXT-1: added drag, pointer, wheel, scroll, and additional mouse events
events = [
  # Mouse
  "onclick", "oninput", "onchange", "onsubmit",
  "onmouseover", "onmouseenter", "onmouseleave", "onmousedown", "onmouseup", "onmousemove",
  # Keyboard
  "onkeydown", "onkeyup", "onkeypress",
  # Focus
  "onfocus", "onblur",
  # Drag (§FEXT-1)
  "ondragstart", "ondragend", "ondragenter", "ondragover", "ondragleave", "ondrop",
  # Pointer (§FEXT-1)
  "onpointerdown", "onpointermove", "onpointerup", "onpointercancel", "onpointerenter", "onpointerleave",
  # Wheel / Scroll (§FEXT-1)
  "onwheel", "onscroll",
  # Context menu
  "oncontextmenu",
  # Error boundary
  "onerror"
]

# Event modifiers
# Extended in §FEXT-1: added passive (wheel), left/right (pointer button filter)
event_modifiers = ["prevent", "stop", "once", "enter", "escape", "space", "left", "right", "passive"]

# Interpolation syntax
interpolation_escaped = "{}"
interpolation_raw = "{!}"

# Hydration modes
hydration_modes = ["off", "on", "visible", "idle", "only"]

# Bridge function declarations - UI runtime functions
# Convention: bridge names use snake_case with _namespace_ prefix
# e.g. ui.toggleClass → _ui_toggle_class
[bridge]
functions = [
  # Plugin Contracts v2 — foundation/spec/plugins/contracts/lifecycle.md §2.5.
  # Build-state keystore bridges, provided by the compiler's plugin sandbox
  # (clean-language-compiler/src/plugins/wasm_adapter.rs). The plugin writes
  # discovered state during expand_block (e.g. each registered component)
  # and reads it back during lifecycle slots (emit_ui_client_init reads the
  # components list to emit hydration calls). hosts = ["all"] — the keystore
  # exists in every host that loads plugins (today: only the compiler).
  { name = "_build_state_set", params = ["string", "string"], returns = "void", description = "Persist a key-value pair into the compiler-owned build_state keystore. Snapshotted into the BuildContext passed to every lifecycle slot.", expand_strings = true, hosts = ["all"] },
  { name = "_build_state_get", params = ["string"], returns = "string", description = "Read a key from the compiler-owned build_state keystore. Returns the empty string when the key is absent.", expand_strings = true, hosts = ["all"] },

  # HTML Page Rendering (SSR)
  # Renders app/web/pages/<name>.html with {{ key }} substitution from data_json (JSON object string).
  # Implemented by clean-server: resolves the page template, substitutes interpolations, returns HTML.
  # Plugin Contracts v2 — foundation/spec/plugins/contracts/bridge-host-classes.md §4.1.
  # SRV001 fix: clean-server's _ui_render_page implementation MUST scan the
  # returned HTML for custom (kebab-case) tags and, for each <my-component>,
  # call the matching `mycomponent_render` export to substitute its rendered
  # HTML. The callback declaration is the contract — clean-server reads it
  # at startup and installs the dispatcher. fallback=passthrough leaves the
  # tag in place if no matching export is found.
  # Moved from frame.server in v2.10.138 — declaration belongs with frame.ui
  # so server-only API apps (no frame.ui) aren't forced to load it.
  { name = "_ui_render_page", params = ["string", "string"], returns = "ptr", description = "Render HTML page template by name with JSON data for {{ key }} substitution; resolves app/web/pages/<name>.html", expand_strings = true, hosts = ["server"], callback = { purpose = "component_tag_render", plugin_target = "frame.ui", discovery = "exports_matching", export_pattern = "{tagname}_render", fallback = "passthrough" } },

  # HTML Rendering
  { name = "_html_escape", params = ["string"], returns = "ptr", description = "Escape HTML entities in string", expand_strings = true, signature = "_html_escape(text) -> string", hosts = ["server"] },
  { name = "_html_raw", params = ["string"], returns = "ptr", description = "Return raw HTML without escaping", expand_strings = true, signature = "_html_raw(html) -> string", hosts = ["server"] },

  # Component Registry
  { name = "_ui_register_component", params = ["string", "string"], returns = "integer", description = "Register component: tag name, class name", expand_strings = true, signature = "_ui_register_component(tagName, className)", hosts = ["server"] },
  { name = "_ui_get_component", params = ["string"], returns = "string", description = "Get component class by tag name", expand_strings = true, signature = "_ui_get_component(tagName) -> string", hosts = ["server"] },

  # Layout Loading
  { name = "_ui_load_layout", params = ["string"], returns = "ptr", description = "Load layout HTML template by name from app/web/layouts/", expand_strings = true, signature = "_ui_load_layout(name) -> string", hosts = ["server"] },

  # Slot Management
  { name = "_ui_set_slot", params = ["string", "string"], returns = "integer", description = "Set slot content: slot name, content", expand_strings = true, signature = "_ui_set_slot(name, content)", hosts = ["server"] },
  { name = "_ui_get_slot", params = ["string"], returns = "string", description = "Get slot content by name", expand_strings = true, signature = "_ui_get_slot(name) -> string", hosts = ["server"] },

  # Event Handler Registration (for client-side hydration)
  { name = "_ui_on_event", params = ["string", "string", "string"], returns = "integer", description = "Register event handler: selector, event type, exported handler function name", expand_strings = true, signature = "_ui_on_event(selector, eventType, handlerName)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # State Management (for hydration)
  { name = "_ui_set_state", params = ["string", "string"], returns = "integer", description = "Set component state: component id, state JSON", expand_strings = true, signature = "_ui_set_state(id, json)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_get_state", params = ["string"], returns = "string", description = "Get component state by ID", expand_strings = true, signature = "_ui_get_state(id) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },

  # DOM Manipulation (for client-side updates)
  { name = "_ui_update_element", params = ["string", "string"], returns = "integer", description = "Update element content: selector, new content", expand_strings = true, signature = "_ui_update_element(selector, content)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_update_attr", params = ["string", "string", "string"], returns = "integer", description = "Update element attribute: selector, attr name, value", expand_strings = true, signature = "_ui_update_attr(selector, attr, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # Form Binding
  { name = "_ui_bind_input", params = ["string", "string"], returns = "integer", description = "Bind input to state: selector, state path", expand_strings = true, signature = "_ui_bind_input(selector, statePath)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # Validation
  { name = "_ui_validate", params = ["string", "string"], returns = "string", description = "Validate value against rule: value, rule type - returns error or empty", expand_strings = true, signature = "_ui_validate(value, rule) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },

  # Event Handler Context (available during event callbacks)
  { name = "_ui_event_attr", params = ["string"], returns = "string", description = "Get attribute value from current event target element", expand_strings = true, signature = "_ui_event_attr(attr) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_event_value", params = [], returns = "string", description = "Get value/textContent of current event target element", signature = "_ui_event_value() -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_event_closest_attr", params = ["string", "string"], returns = "string", description = "Find closest ancestor matching selector, return its attribute value", expand_strings = true, signature = "_ui_event_closest_attr(selector, attr) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_event_type", params = [], returns = "string", description = "Get the type of the current event (click, input, etc.)", signature = "_ui_event_type() -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },

  # Clipboard
  { name = "_ui_clipboard_write", params = ["string"], returns = "integer", description = "Write text to clipboard (navigator.clipboard.writeText)", expand_strings = true, signature = "_ui_clipboard_write(text)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # URL / Location
  { name = "_ui_location_href", params = ["string"], returns = "integer", description = "Navigate to URL (window.location.href)", expand_strings = true, signature = "_ui_location_href(url)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_location_query", params = ["string"], returns = "string", description = "Get URL query parameter value", expand_strings = true, signature = "_ui_location_query(param) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_location_path", params = [], returns = "string", description = "Get current URL pathname", signature = "_ui_location_path() -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },

  # DOM Query (single element)
  { name = "_ui_get_text", params = ["string"], returns = "string", description = "Get textContent of first element matching selector", expand_strings = true, signature = "_ui_get_text(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_get_attr", params = ["string", "string"], returns = "string", description = "Get attribute of first element matching selector", expand_strings = true, signature = "_ui_get_attr(selector, attr) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_toggle_class", params = ["string", "string"], returns = "integer", description = "Toggle CSS class on first element matching selector", expand_strings = true, signature = "_ui_toggle_class(selector, className)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_add_class", params = ["string", "string"], returns = "integer", description = "Add CSS class to first element matching selector", expand_strings = true, signature = "_ui_add_class(selector, className)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_remove_class", params = ["string", "string"], returns = "integer", description = "Remove CSS class from first element matching selector", expand_strings = true, signature = "_ui_remove_class(selector, className)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_set_style", params = ["string", "string", "string"], returns = "integer", description = "Set inline style property on first element: selector, property, value", expand_strings = true, signature = "_ui_set_style(selector, property, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_update_element_self", params = ["string"], returns = "integer", description = "Update textContent of the current event target element", expand_strings = true, signature = "_ui_update_element_self(content)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # DOM Batch (querySelectorAll)
  { name = "_ui_query_set_style", params = ["string", "string", "string"], returns = "integer", description = "Set style property on ALL elements matching selector", expand_strings = true, signature = "_ui_query_set_style(selector, property, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_query_set_attr", params = ["string", "string", "string"], returns = "integer", description = "Set attribute on ALL elements matching selector", expand_strings = true, signature = "_ui_query_set_attr(selector, attr, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_query_add_class", params = ["string", "string"], returns = "integer", description = "Add class to ALL elements matching selector", expand_strings = true, signature = "_ui_query_add_class(selector, className)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_query_remove_class", params = ["string", "string"], returns = "integer", description = "Remove class from ALL elements matching selector", expand_strings = true, signature = "_ui_query_remove_class(selector, className)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_filter_by_attr", params = ["string", "string", "string"], returns = "integer", description = "Show elements where attr matches value, hide others (* for all)", expand_strings = true, signature = "_ui_filter_by_attr(selector, attr, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_filter_by_text", params = ["string", "string", "string", "string"], returns = "integer", description = "Filter elements by text search across name and description attributes", expand_strings = true, signature = "_ui_filter_by_text(selector, nameAttr, descAttr, query)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # IntersectionObserver
  { name = "_ui_observe_visible", params = ["string", "string"], returns = "integer", description = "Add class to elements when they become visible (one-shot)", expand_strings = true, signature = "_ui_observe_visible(selector, className)", hosts = ["browser"] },

  # Timers
  { name = "_ui_set_timeout", params = ["string", "integer"], returns = "integer", description = "Call exported handler function by name after delay ms: handler name, delay_ms", expand_strings = true, signature = "_ui_set_timeout(handlerName, delayMs)", hosts = ["browser"] },

  # Theming
  { name = "_ui_inject_head_css", params = ["string"], returns = "i32", description = "Inject CSS string into the page <head> as a <style> element", expand_strings = true, signature = "_ui_inject_head_css(css)", hosts = ["browser"] },
  { name = "_ui_inject_head_link", params = ["string"], returns = "i32", description = "Inject <link rel=stylesheet href=...> into page <head>; deduplicated by href", expand_strings = true, signature = "_ui_inject_head_link(href)", hosts = ["browser"] },

  # Form Helpers
  { name = "_ui_input_value", params = ["string"], returns = "string", description = "Get value of input/textarea/select matching selector", expand_strings = true, signature = "_ui_input_value(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_form_json", params = ["string"], returns = "string", description = "Collect all named inputs in form as JSON object string", expand_strings = true, signature = "_ui_form_json(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_form_data", params = ["string"], returns = "string", description = "Collect all named inputs as URL-encoded key=value string", expand_strings = true, signature = "_ui_form_data(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_checked", params = ["string"], returns = "integer", description = "Get checkbox checked state (0=unchecked, 1=checked)", expand_strings = true, signature = "_ui_checked(selector)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_set_input", params = ["string", "string"], returns = "integer", description = "Set value of input/textarea/select", expand_strings = true, signature = "_ui_set_input(selector, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_form_submit", params = ["string"], returns = "integer", description = "Programmatically submit a form (uses requestSubmit for validation): selector", expand_strings = true, signature = "_ui_form_submit(selector)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_get_selection", params = ["string"], returns = "string", description = "Get textarea/input selection as JSON {text, start, end}: selector", expand_strings = true, signature = "_ui_get_selection(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_insert_at_cursor", params = ["string", "string", "string"], returns = "integer", description = "Wrap selection or insert at cursor: selector, beforeMarker, afterMarker; returns new cursor position", expand_strings = true, signature = "_ui_insert_at_cursor(selector, before, after) -> integer", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_text_diff", params = ["string", "string", "string"], returns = "integer", description = "Word-level LCS diff between two elements rendered into a third: selectorA, selectorB, selectorOut", expand_strings = true, signature = "_ui_text_diff(selectorA, selectorB, selectorOut) -> integer", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },

  # Keyboard shortcuts
  { name = "_ui_shortcut_register", params = ["string", "string", "string"], returns = "integer", description = "Register global keyboard shortcut: key descriptor (e.g. mod+shift+s), handler name, scope (global or CSS selector)", expand_strings = true, signature = "_ui_shortcut_register(keys, handlerName, scope)", hosts = ["browser"] },
  { name = "_ui_shortcut_remove", params = ["integer"], returns = "void", description = "Remove keyboard shortcut by ID", signature = "_ui_shortcut_remove(id)", hosts = ["browser"] },
  { name = "_ui_shortcut_clear", params = [], returns = "void", description = "Remove all keyboard shortcuts registered by this WASM instance", signature = "_ui_shortcut_clear()", hosts = ["browser"] },

  # CSS variable runtime manipulation
  { name = "_ui_set_css_var", params = ["string", "string"], returns = "void", description = "Set CSS custom property on :root: name, value", expand_strings = true, signature = "_ui_set_css_var(name, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_ui_set_css_var_on", params = ["string", "string", "string"], returns = "void", description = "Set CSS custom property on element matching selector: selector, name, value", expand_strings = true, signature = "_ui_set_css_var_on(selector, name, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_ui_get_css_var", params = ["string"], returns = "string", description = "Get computed value of CSS custom property from :root", expand_strings = true, signature = "_ui_get_css_var(name) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_apply_css_vars", params = ["string"], returns = "void", description = "Apply JSON object of CSS variable name→value pairs to :root", expand_strings = true, signature = "_ui_apply_css_vars(tokensJson)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },

  # Focus management
  { name = "_ui_focus", params = ["string"], returns = "void", description = "Call focus() on first element matching selector", expand_strings = true, signature = "_ui_focus(selector)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_ui_blur", params = ["string"], returns = "void", description = "Call blur() on first element matching selector", expand_strings = true, signature = "_ui_blur(selector)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_ui_get_focus", params = [], returns = "string", description = "Return CSS selector path of currently focused element, or empty string if body", signature = "_ui_get_focus() -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_focus_trap", params = ["string"], returns = "integer", description = "Trap Tab/Shift+Tab focus within container matching selector; returns trap ID", expand_strings = true, signature = "_ui_focus_trap(selector)", hosts = ["browser"] },
  { name = "_ui_focus_trap_release", params = ["integer"], returns = "void", description = "Release focus trap by ID and restore previously focused element", signature = "_ui_focus_trap_release(id)", hosts = ["browser"] },

  # Browser storage
  { name = "_storage_local_get", params = ["string"], returns = "string", description = "Get value from localStorage by key", expand_strings = true, signature = "_storage_local_get(key) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_storage_local_set", params = ["string", "string"], returns = "void", description = "Set key-value pair in localStorage", expand_strings = true, signature = "_storage_local_set(key, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_local_remove", params = ["string"], returns = "void", description = "Remove key from localStorage", expand_strings = true, signature = "_storage_local_remove(key)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_local_clear", params = [], returns = "void", description = "Clear all entries in localStorage", signature = "_storage_local_clear()", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_session_get", params = ["string"], returns = "string", description = "Get value from sessionStorage by key", expand_strings = true, signature = "_storage_session_get(key) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_storage_session_set", params = ["string", "string"], returns = "void", description = "Set key-value pair in sessionStorage", expand_strings = true, signature = "_storage_session_set(key, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_session_remove", params = ["string"], returns = "void", description = "Remove key from sessionStorage", expand_strings = true, signature = "_storage_session_remove(key)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_session_clear", params = [], returns = "void", description = "Clear all entries in sessionStorage", signature = "_storage_session_clear()", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },

  # File download trigger (client-side only)
  { name = "_ui_download_text", params = ["string", "string", "string"], returns = "void", description = "Trigger browser download of text content: filename, content, mimeType", expand_strings = true, signature = "_ui_download_text(filename, content, mimeType)", hosts = ["browser"] },
  { name = "_ui_download_url", params = ["string", "string"], returns = "void", description = "Trigger browser download from URL: url, filename", expand_strings = true, signature = "_ui_download_url(url, filename)", hosts = ["browser"] },

  # Clipboard API (async with callbacks)
  { name = "_ui_clipboard_write_cb", params = ["string", "string", "string"], returns = "void", description = "Write text to clipboard with callbacks: text, onSuccessHandler, onErrorHandler (empty string = no callback)", expand_strings = true, signature = "_ui_clipboard_write_cb(text, onSuccess, onError)", hosts = ["browser"] },
  { name = "_ui_clipboard_read_cb", params = ["string", "string"], returns = "void", description = "Read text from clipboard with callbacks: onSuccessHandler, onErrorHandler", expand_strings = true, signature = "_ui_clipboard_read_cb(onSuccess, onError)", hosts = ["browser"] },

  # Resize and Intersection Observers
  { name = "_ui_resize_observe", params = ["string", "string"], returns = "integer", description = "Observe element resize: selector, handler name; returns observer ID", expand_strings = true, signature = "_ui_resize_observe(selector, handlerName)", hosts = ["browser"] },
  { name = "_ui_resize_unobserve", params = ["integer"], returns = "void", description = "Stop resize observation by ID", signature = "_ui_resize_unobserve(id)", hosts = ["browser"] },
  { name = "_ui_intersect_observe", params = ["string", "string", "number"], returns = "integer", description = "Observe element intersection: selector, handler name, threshold (0.0–1.0); returns observer ID", expand_strings = true, signature = "_ui_intersect_observe(selector, handlerName, threshold)", hosts = ["browser"] },
  { name = "_ui_intersect_unobserve", params = ["integer"], returns = "void", description = "Stop intersection observation by ID", signature = "_ui_intersect_unobserve(id)", hosts = ["browser"] },

  # Toast / notification system
  { name = "_ui_toast", params = ["string", "string", "integer", "string"], returns = "integer", description = "Show toast notification: text, variant (success|error|warning|info), duration ms (0=permanent), position; returns toast ID", expand_strings = true, signature = "_ui_toast(text, variant, duration, position)", hosts = ["browser"] },
  { name = "_ui_toast_dismiss", params = ["integer"], returns = "void", description = "Dismiss toast by ID with exit animation", signature = "_ui_toast_dismiss(id)", hosts = ["browser"] },
  { name = "_ui_toast_dismiss_all", params = [], returns = "void", description = "Dismiss all visible toasts", signature = "_ui_toast_dismiss_all()", hosts = ["browser"] },

  # --- §14: Client-Side Navigation and History API ---
  { name = "_ui_navigate", params = ["string"], returns = "void", description = "Navigate to path using soft routing (no full reload)", expand_strings = true, signature = "_ui_navigate(path)", hosts = ["browser"] },
  { name = "_ui_history_push", params = ["string", "string"], returns = "void", description = "Push a new entry onto the history stack: path, title", expand_strings = true, signature = "_ui_history_push(path, title)", hosts = ["browser"] },
  { name = "_ui_history_replace", params = ["string", "string"], returns = "void", description = "Replace the current history entry: path, title", expand_strings = true, signature = "_ui_history_replace(path, title)", hosts = ["browser"] },
  { name = "_ui_history_back", params = [], returns = "void", description = "Navigate back in history (window.history.back)", signature = "_ui_history_back()", hosts = ["browser"] },
  { name = "_ui_history_forward", params = [], returns = "void", description = "Navigate forward in history (window.history.forward)", signature = "_ui_history_forward()", hosts = ["browser"] },
  { name = "_ui_current_path", params = [], returns = "string", description = "Return the current URL pathname + search string", signature = "_ui_current_path() -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
]

[language]
# Block-level keywords that start a declaration
blocks = ["component", "page", "html", "ui"]

# Keywords used within plugin context
keywords = [
  { name = "state", description = "Component state declaration", context = "block" },
  { name = "inputs", description = "Component inputs declaration", context = "block" },
  { name = "render", description = "Component render function", context = "block" },
  { name = "events", description = "Event handlers block", context = "block" },
  { name = "computed", description = "Computed properties", context = "block" },
  { name = "var", description = "html: block named variable attribute (html: var=\"name\")", context = "attribute" },
  { name = "if", description = "Conditional rendering directive", context = "directive" },
  { name = "else", description = "Else clause for conditional", context = "directive" },
  { name = "iterate", description = "Iterate rendering directive (cl-iterate)", context = "directive" },
  { name = "bind", description = "Two-way data binding", context = "directive" },
  { name = "client", description = "Hydration mode attribute", context = "attribute" },
  { name = "slot", description = "Slot for content projection", context = "directive" },
  { name = "show", description = "Conditional visibility", context = "directive" },
  { name = "validate", description = "Form validation directive", context = "directive" },
  { name = "theme", description = "Theme configuration sub-block inside ui:", context = "block" },
  { name = "colors", description = "Color variables sub-block inside theme:", context = "block" },
  { name = "spacing", description = "Spacing variables sub-block inside theme:", context = "block" },
  { name = "layout", description = "Page layout name (used in <page layout='name'> attribute)", context = "page-attribute" },
  { name = "auth", description = "Require authentication for page", context = "page-attribute" },
  { name = "roles", description = "Required roles for page access", context = "page-attribute" },
  { name = "cache", description = "Page cache max-age in seconds", context = "page-attribute" },
]

# Custom types provided by the plugin
types = [
  { name = "Component", description = "UI component type" },
  { name = "Inputs", description = "Component inputs type" },
  { name = "State", description = "Component state type" },
]

# Built-in functions/expressions
functions = [
  # SSR response helpers — emitted by frame.ui's preamble. Moved from frame.server
  # in v2.10.138 because SSR is frame.ui's responsibility.
  { name = "render", signature = "render(name)", description = "Render HTML page from app/web/pages/<name>.html and return as 200 text/html response" },
  { name = "renderWith", signature = "renderWith(name, data_json)", description = "Render HTML page from app/web/pages/<name>.html with JSON data string for {{ key }} template substitution" },
  { name = "rawHtml", signature = "rawHtml(content)", description = "Render unescaped HTML (use with caution)" },
  { name = "escape", signature = "escape(text)", description = "Escape HTML entities" },
  { name = "slot", signature = "slot(name?)", description = "Render slot content" },
  { name = "_html_escape", signature = "_html_escape(text)", description = "Escape HTML entities (auto-generated by {expr} interpolation in html: blocks)" },
  { name = "ui.inputValue", signature = "ui.inputValue(selector)", description = "Get value of input/textarea/select by CSS selector", maps_to = "_ui_input_value" },
  { name = "ui.formJson", signature = "ui.formJson(selector)", description = "Collect all named form inputs as JSON object string", maps_to = "_ui_form_json" },
  { name = "ui.formData", signature = "ui.formData(selector)", description = "Collect all named form inputs as URL-encoded string", maps_to = "_ui_form_data" },
  { name = "ui.checked", signature = "ui.checked(selector)", description = "Get checkbox checked state (0 or 1)", maps_to = "_ui_checked" },
  { name = "ui.setInput", signature = "ui.setInput(selector, value)", description = "Set value of input/textarea/select", maps_to = "_ui_set_input" },
  { name = "ui.formSubmit", signature = "ui.formSubmit(selector)", description = "Programmatically submit a form (triggers validation via requestSubmit)", maps_to = "_ui_form_submit" },
  { name = "ui.getSelection", signature = "ui.getSelection(selector) -> string", description = "Get textarea/input selection as JSON {text, start, end}", maps_to = "_ui_get_selection" },
  { name = "ui.insertAtCursor", signature = "ui.insertAtCursor(selector, before, after) -> integer", description = "Wrap selection or insert at cursor; returns new cursor position", maps_to = "_ui_insert_at_cursor" },
  { name = "ui.textDiff", signature = "ui.textDiff(selectorA, selectorB, selectorOut) -> integer", description = "Word-level diff between two elements rendered into a third; adds .diff-added/.diff-removed spans", maps_to = "_ui_text_diff" },
  { name = "ui.onEvent", signature = "ui.onEvent(selector, eventType, handlerName)", description = "Register event handler by exported function name for CSS selector and event type", maps_to = "_ui_on_event" },
  { name = "ui.toggleClass", signature = "ui.toggleClass(selector, className)", description = "Toggle CSS class on first matching element", maps_to = "_ui_toggle_class" },
  { name = "ui.addClass", signature = "ui.addClass(selector, className)", description = "Add CSS class to first matching element", maps_to = "_ui_add_class" },
  { name = "ui.removeClass", signature = "ui.removeClass(selector, className)", description = "Remove CSS class from first matching element", maps_to = "_ui_remove_class" },
  { name = "ui.setStyle", signature = "ui.setStyle(selector, property, value)", description = "Set inline style on first matching element", maps_to = "_ui_set_style" },
  { name = "ui.setState", signature = "ui.setState(id, json)", description = "Set component state by ID", maps_to = "_ui_set_state" },
  { name = "ui.getState", signature = "ui.getState(id)", description = "Get component state by ID", maps_to = "_ui_get_state" },
  { name = "ui.updateElement", signature = "ui.updateElement(selector, content)", description = "Update element innerHTML", maps_to = "_ui_update_element" },
  { name = "ui.updateAttr", signature = "ui.updateAttr(selector, attr, value)", description = "Update element attribute", maps_to = "_ui_update_attr" },
  { name = "ui.eventAttr", signature = "ui.eventAttr(attr)", description = "Get attribute from current event target", maps_to = "_ui_event_attr" },
  { name = "ui.eventValue", signature = "ui.eventValue()", description = "Get value/textContent of current event target", maps_to = "_ui_event_value" },
  { name = "ui.eventClosestAttr", signature = "ui.eventClosestAttr(selector, attr)", description = "Get attribute from closest ancestor matching selector", maps_to = "_ui_event_closest_attr" },
  { name = "ui.clipboardWriteRaw", signature = "ui.clipboardWriteRaw(text)", description = "Write text to clipboard (fire-and-forget, no callbacks)", maps_to = "_ui_clipboard_write" },
  { name = "ui.locationHref", signature = "ui.locationHref(url)", description = "Navigate to URL", maps_to = "_ui_location_href" },
  { name = "ui.locationQuery", signature = "ui.locationQuery(param)", description = "Get URL query parameter", maps_to = "_ui_location_query" },
  { name = "ui.locationPath", signature = "ui.locationPath()", description = "Get current URL pathname", maps_to = "_ui_location_path" },
  { name = "ui.observeVisible", signature = "ui.observeVisible(selector, className)", description = "Add class when elements become visible", maps_to = "_ui_observe_visible" },
  { name = "ui.setTimeout", signature = "ui.setTimeout(handlerName, delayMs)", description = "Call exported handler by name after delay", maps_to = "_ui_set_timeout" },
  { name = "ui.filterByAttr", signature = "ui.filterByAttr(selector, attr, value)", description = "Show/hide elements by attribute match", maps_to = "_ui_filter_by_attr" },
  { name = "ui.filterByText", signature = "ui.filterByText(selector, nameAttr, descAttr, query)", description = "Filter elements by text search", maps_to = "_ui_filter_by_text" },
  { name = "ui.queryAddClass", signature = "ui.queryAddClass(selector, className)", description = "Add class to ALL matching elements", maps_to = "_ui_query_add_class" },
  { name = "ui.queryRemoveClass", signature = "ui.queryRemoveClass(selector, className)", description = "Remove class from ALL matching elements", maps_to = "_ui_query_remove_class" },

  # --- §FEXT-1: Drag data transfer ---
  { name = "_ui_set_drag_data", params = ["string", "string"], returns = "integer", description = "Set drag-and-drop transfer data: key, value", expand_strings = true, signature = "_ui_set_drag_data(key, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_get_drag_data", params = ["string"], returns = "string", description = "Get drag-and-drop transfer data by key", expand_strings = true, signature = "_ui_get_drag_data(key) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "ui.setDragData", signature = "ui.setDragData(key, value)", description = "Set drag transfer data", maps_to = "_ui_set_drag_data" },
  { name = "ui.getDragData", signature = "ui.getDragData(key) -> string", description = "Get drag transfer data by key", maps_to = "_ui_get_drag_data" },

  # --- §FEXT-2: DOM Query bridge functions (browser-only; server stubs return "") ---
  { name = "_ui_get_bounds", params = ["string"], returns = "string", description = "Get bounding box of element matching selector (JSON: x,y,width,height,top,left,right,bottom)", expand_strings = true, signature = "_ui_get_bounds(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_get_offset_bounds", params = ["string"], returns = "string", description = "Get bounding box relative to offset parent (JSON)", expand_strings = true, signature = "_ui_get_offset_bounds(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_get_scroll", params = ["string"], returns = "string", description = "Get scroll position of element (JSON: scrollX,scrollY,scrollWidth,scrollHeight)", expand_strings = true, signature = "_ui_get_scroll(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_set_scroll", params = ["string", "number", "number"], returns = "integer", description = "Set scroll position of element: selector, x, y", expand_strings = true, signature = "_ui_set_scroll(selector, x, y)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "0" } },
  { name = "_ui_query_all", params = ["string"], returns = "string", description = "Query all elements matching selector; returns JSON array of CSS selector paths", expand_strings = true, signature = "_ui_query_all(selector) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_get_computed_style", params = ["string", "string"], returns = "string", description = "Get computed CSS property value: selector, property name", expand_strings = true, signature = "_ui_get_computed_style(selector, property) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "ui.getBounds", signature = "ui.getBounds(selector) -> BoundsResult", description = "Get element bounding box", maps_to = "_ui_get_bounds" },
  { name = "ui.getOffsetBounds", signature = "ui.getOffsetBounds(selector) -> BoundsResult", description = "Get element bounding box relative to offset parent", maps_to = "_ui_get_offset_bounds" },
  { name = "ui.getScroll", signature = "ui.getScroll(selector) -> ScrollResult", description = "Get element scroll position", maps_to = "_ui_get_scroll" },
  { name = "ui.setScroll", signature = "ui.setScroll(selector, x, y)", description = "Set element scroll position", maps_to = "_ui_set_scroll" },
  { name = "ui.queryAll", signature = "ui.queryAll(selector) -> Array<string>", description = "Query all matching elements; returns selector paths", maps_to = "_ui_query_all" },
  { name = "ui.getAttr", signature = "ui.getAttr(selector, attr) -> string", description = "Get attribute value from first matching element", maps_to = "_ui_get_attr" },
  { name = "ui.getComputedStyle", signature = "ui.getComputedStyle(selector, property) -> string", description = "Get computed CSS property value", maps_to = "_ui_get_computed_style" },

  # --- §FEXT-3: iframe communication bridge (browser-only) ---
  { name = "_ui_iframe_send", params = ["string", "string"], returns = "integer", description = "Send postMessage to iframe: selector, message string", expand_strings = true, signature = "_ui_iframe_send(selector, message)", hosts = ["browser"] },
  { name = "_ui_iframe_on_message", params = ["string"], returns = "integer", description = "Register handler for incoming iframe postMessages: handler function name", expand_strings = true, signature = "_ui_iframe_on_message(handlerName)", hosts = ["browser"] },
  { name = "_ui_iframe_get_bounds", params = ["string", "string"], returns = "string", description = "Get bounds of element inside iframe: iframe selector, inner selector (100ms timeout)", expand_strings = true, signature = "_ui_iframe_get_bounds(iframeSelector, innerSelector) -> string", hosts = ["browser"] },
  { name = "_ui_iframe_inject", params = ["string", "string"], returns = "integer", description = "Inject script into iframe: selector, script string (returns 1=ok, 0=threw)", expand_strings = true, signature = "_ui_iframe_inject(selector, script)", hosts = ["browser"] },
  { name = "ui.iframeSend", signature = "ui.iframeSend(selector, message)", description = "Send message to iframe via postMessage", maps_to = "_ui_iframe_send" },
  { name = "ui.iframeOnMessage", signature = "ui.iframeOnMessage(handler)", description = "Register handler for messages from iframes", maps_to = "_ui_iframe_on_message" },
  { name = "ui.iframeGetBounds", signature = "ui.iframeGetBounds(iframeSelector, innerSelector) -> BoundsResult", description = "Get bounds of element inside iframe", maps_to = "_ui_iframe_get_bounds" },
  { name = "ui.iframeInject", signature = "ui.iframeInject(selector, script) -> boolean", description = "Inject script into iframe", maps_to = "_ui_iframe_inject" },

  # --- §FEXT-5: Incremental DOM patching (browser-only; server is a no-op) ---
  { name = "_ui_patch", params = ["string", "string"], returns = "integer", description = "Diff and incrementally patch DOM subtree: selector, new HTML (preserves focus, scroll, selection)", expand_strings = true, signature = "_ui_patch(selector, newHtml)", hosts = ["browser"] },
  { name = "ui.patch", signature = "ui.patch(selector, newHtml)", description = "Incrementally patch DOM subtree without full re-render", maps_to = "_ui_patch" },

  # --- Keyboard shortcuts ---
  { name = "ui.shortcut", signature = "ui.shortcut(keys, handlerName, scope) -> integer", description = "Register global keyboard shortcut; scope is 'global' or a CSS selector", maps_to = "_ui_shortcut_register" },
  { name = "ui.removeShortcut", signature = "ui.removeShortcut(id)", description = "Remove keyboard shortcut by ID", maps_to = "_ui_shortcut_remove" },
  { name = "ui.clearShortcuts", signature = "ui.clearShortcuts()", description = "Remove all keyboard shortcuts registered by this WASM instance", maps_to = "_ui_shortcut_clear" },

  # --- CSS variable manipulation ---
  { name = "ui.setCssVar", signature = "ui.setCssVar(name, value)", description = "Set CSS custom property on :root", maps_to = "_ui_set_css_var" },
  { name = "ui.setCssVarOn", signature = "ui.setCssVarOn(selector, name, value)", description = "Set CSS custom property on specific element", maps_to = "_ui_set_css_var_on" },
  { name = "ui.getCssVar", signature = "ui.getCssVar(name) -> string", description = "Get computed value of CSS custom property from :root", maps_to = "_ui_get_css_var" },
  { name = "ui.applyCssVars", signature = "ui.applyCssVars(tokensJson)", description = "Apply JSON object of CSS variable name→value pairs to :root", maps_to = "_ui_apply_css_vars" },

  # --- Focus management ---
  { name = "ui.focus", signature = "ui.focus(selector)", description = "Focus element matching selector", maps_to = "_ui_focus" },
  { name = "ui.blur", signature = "ui.blur(selector)", description = "Blur element matching selector", maps_to = "_ui_blur" },
  { name = "ui.getFocus", signature = "ui.getFocus() -> string", description = "Get selector path of currently focused element", maps_to = "_ui_get_focus" },
  { name = "ui.focusTrap", signature = "ui.focusTrap(selector) -> integer", description = "Trap keyboard focus within container; returns trap ID", maps_to = "_ui_focus_trap" },
  { name = "ui.focusTrapRelease", signature = "ui.focusTrapRelease(id)", description = "Release focus trap and restore previously focused element", maps_to = "_ui_focus_trap_release" },

  # --- Browser storage ---
  { name = "storage.local.get", signature = "storage.local.get(key) -> string", description = "Get value from localStorage", maps_to = "_storage_local_get" },
  { name = "storage.local.set", signature = "storage.local.set(key, value)", description = "Set value in localStorage", maps_to = "_storage_local_set" },
  { name = "storage.local.remove", signature = "storage.local.remove(key)", description = "Remove key from localStorage", maps_to = "_storage_local_remove" },
  { name = "storage.local.clear", signature = "storage.local.clear()", description = "Clear all localStorage entries", maps_to = "_storage_local_clear" },
  { name = "storage.session.get", signature = "storage.session.get(key) -> string", description = "Get value from sessionStorage", maps_to = "_storage_session_get" },
  { name = "storage.session.set", signature = "storage.session.set(key, value)", description = "Set value in sessionStorage", maps_to = "_storage_session_set" },
  { name = "storage.session.remove", signature = "storage.session.remove(key)", description = "Remove key from sessionStorage", maps_to = "_storage_session_remove" },
  { name = "storage.session.clear", signature = "storage.session.clear()", description = "Clear all sessionStorage entries", maps_to = "_storage_session_clear" },

  # --- File download ---
  { name = "ui.downloadText", signature = "ui.downloadText(filename, content, mimeType)", description = "Trigger browser download of in-memory text content", maps_to = "_ui_download_text" },
  { name = "ui.downloadUrl", signature = "ui.downloadUrl(url, filename)", description = "Trigger browser download from a URL", maps_to = "_ui_download_url" },

  # --- Clipboard (async with callbacks) ---
  { name = "ui.clipboardWrite", signature = "ui.clipboardWrite(text, onSuccess, onError)", description = "Write text to clipboard; call onSuccess/onError handler names on completion", maps_to = "_ui_clipboard_write_cb" },
  { name = "ui.clipboardRead", signature = "ui.clipboardRead(onSuccess, onError)", description = "Read text from clipboard; onSuccess called with text, onError with error message", maps_to = "_ui_clipboard_read_cb" },

  # --- Resize and Intersection Observers ---
  { name = "ui.resizeObserve", signature = "ui.resizeObserve(selector, handlerName) -> integer", description = "Observe element size changes; handler called with {width, height, selector} JSON", maps_to = "_ui_resize_observe" },
  { name = "ui.resizeUnobserve", signature = "ui.resizeUnobserve(id)", description = "Stop resize observation by ID", maps_to = "_ui_resize_unobserve" },
  { name = "ui.intersectObserve", signature = "ui.intersectObserve(selector, handlerName, threshold) -> integer", description = "Observe element intersection; handler called with {selector, ratio, isVisible} JSON", maps_to = "_ui_intersect_observe" },
  { name = "ui.intersectUnobserve", signature = "ui.intersectUnobserve(id)", description = "Stop intersection observation by ID", maps_to = "_ui_intersect_unobserve" },

  # --- Toast / notification system ---
  { name = "toast.show", signature = "toast.show(text, variant, durationMs, position) -> integer", description = "Show toast notification; returns toast ID", maps_to = "_ui_toast" },
  { name = "toast.dismiss", signature = "toast.dismiss(id)", description = "Dismiss a toast by ID", maps_to = "_ui_toast_dismiss" },
  { name = "toast.dismissAll", signature = "toast.dismissAll()", description = "Dismiss all visible toasts", maps_to = "_ui_toast_dismiss_all" },
  { name = "toast.success", signature = "toast.success(text, variant, durationMs, position) -> integer", description = "Show success toast (pass variant='success')", maps_to = "_ui_toast" },
  { name = "toast.error", signature = "toast.error(text, variant, durationMs, position) -> integer", description = "Show error toast (pass variant='error')", maps_to = "_ui_toast" },
  { name = "toast.warning", signature = "toast.warning(text, variant, durationMs, position) -> integer", description = "Show warning toast (pass variant='warning')", maps_to = "_ui_toast" },
  { name = "toast.info", signature = "toast.info(text, variant, durationMs, position) -> integer", description = "Show info toast (pass variant='info')", maps_to = "_ui_toast" },

  # --- §14: Client-Side Navigation ---
  { name = "ui.navigate", signature = "ui.navigate(path)", description = "Soft-navigate to path without a full page reload", maps_to = "_ui_navigate" },
  { name = "ui.historyPush", signature = "ui.historyPush(path, title)", description = "Push a new entry onto the browser history stack", maps_to = "_ui_history_push" },
  { name = "ui.historyReplace", signature = "ui.historyReplace(path, title)", description = "Replace the current browser history entry", maps_to = "_ui_history_replace" },
  { name = "ui.historyBack", signature = "ui.historyBack()", description = "Navigate back in browser history", maps_to = "_ui_history_back" },
  { name = "ui.historyForward", signature = "ui.historyForward()", description = "Navigate forward in browser history", maps_to = "_ui_history_forward" },
  { name = "ui.currentPath", signature = "ui.currentPath() -> string", description = "Get the current URL pathname and query string", maps_to = "_ui_current_path" },
]

# Auto-completion suggestions
completions = [
  { trigger = "component ", insert = "component: tag=\"${1:my-tag}\"\n\tinputs:\n\t\t${2:string} ${3:name}\n\n\thtml:\n\t\t<div>\n\t\t\t${4:content}\n\t\t</div>" },
  { trigger = "state:", insert = "state:\n\t${1:field}: ${2:value}" },
  { trigger = "render:", insert = "render:\n\t${1:// template}" },
  { trigger = "html:", insert = "html:\n\t<div>\n\t\t${1:content}\n\t</div>" },
  { trigger = "html: var", insert = "html: var=\"${1:name}\"\n\t<div>\n\t\t${2:content}\n\t</div>" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/ui", "app/web", "app/web/pages", "app/web/components", "app/web/layouts"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln", "*.html"]

# Files in owned folders automatically import this plugin
implicit_import = true

[templates]
# Starter files created when plugin is added to a project
files = [
  { path = "app/web/pages/index.html", template = "index.html" },
]

[enforcement]
severity = "warn"

restricted_functions = []

required_blocks = [
  { folder = "app/web/components/", block = "component", message = "Component files should contain 'component' definitions" },
]

block_folder_rules = [
  { block = "component", allowed_in = ["app/web/components/", "app/ui/"], message = "component: blocks should be in app/web/components/ or app/ui/" },
]

[ai]
description = "HTML-first UI plugin. Define pages as .html files with Clean directives (cl-if, cl-iterate, cl-bind). Define reusable elements as component: blocks. CSS goes in public/css/ files. Never write inline JavaScript."
constraints = [
  "Pages go in app/web/pages/ as .html files — not as .cln files",
  "Reusable elements belong in component: blocks in app/web/components/ or app/ui/ for cross-platform components",
  "Use cl-iterate for lists — never build HTML strings by concatenation",
  "Use ui.formJson() to collect form inputs — never access DOM fields manually",
  "Event handlers must be exported Clean functions — never inline JS",
]

[[ai.patterns]]
name = "ssr-page-with-islands"
use_when = "building any page — this is the foundational structure pattern, read it first"
anti_pattern = "putting logic or data loading in the HTML file, or adding client='on' to every component — the HTML is a static shell; all data comes from the page endpoint; most content should stay client='off' and ship zero JS; only opt into hydration where genuine interactivity is needed"
example = "patterns/ssr-page-with-islands.cln"

[[ai.patterns]]
name = "form-with-validation"
use_when = "any user input form that must show per-field errors before submission"
anti_pattern = "validating only on submit and showing one generic error — validate on blur per field using cl-validate, show inline errors next to each field so users know exactly what to fix"
example = "patterns/form-with-validation.cln"

[[ai.patterns]]
name = "data-table"
use_when = "displaying a queryable, sortable, filterable list of records"
anti_pattern = "fetching all rows into the page and filtering client-side — for large datasets this is slow and leaks data; paginate server-side and pass page + sort as query params"
example = "patterns/data-table.cln"

[[ai.patterns]]
name = "live-search"
use_when = "a search or filter input that should narrow results as the user types"
anti_pattern = "re-fetching on every keystroke — debounce the input (wait 300ms after the user stops typing) and use cl-iterate to render results without a full page reload"
example = "patterns/live-search.cln"

[[ai.patterns]]
name = "modal-confirm"
use_when = "any destructive action (delete, deactivate, cancel subscription) triggered by a button click"
anti_pattern = "triggering the destructive action immediately on click — always show a confirm modal first; users click the wrong button, and destructive actions must require explicit confirmation"
example = "patterns/modal-confirm.cln"

[build]
built_with_compiler = "0.30.273"
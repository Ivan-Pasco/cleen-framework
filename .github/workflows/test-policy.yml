name: Test policy guard

# Enforces system-documents/testing/TEST_STRATEGY.md §5.
# Runs on every PR and every push to main, regardless of what changed.
# This job is intentionally separate from test.yml so it fires even on
# doc-only PRs — the policy guard also checks tests/PENDING.md hygiene.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder-guard:
    name: Placeholder guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure strategy doc is present
        run: test -f system-documents/testing/TEST_STRATEGY.md

      - name: Ensure conventions doc is present
        run: test -f tests/CONVENTIONS.md

      - name: Ensure PENDING.md is present
        run: test -f tests/PENDING.md

      - name: Run placeholder guard
        run: python3 scripts/check-test-placeholders.py

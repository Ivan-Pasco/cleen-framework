[package]
name = "frame-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "frame_cli"
path = "src/lib.rs"

[[bin]]
name = "frame"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

# Manifest parsing
toml = "0.8"

# Internal dependencies
frame-server = { path = "../frame-server" }
frame-data = { path = "../frame-data" }
frame-compiler-plugins = { path = "../frame-compiler-plugins" }

# Compiler library (for direct integration)
clean-language-compiler = { git = "https://github.com/Ivan-Pasco/clean-language-compiler", rev = "c62efa0e83c601e233a674279e353a9d3a746447" }

# Additional CLI dependencies
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
notify = "6.1"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "trace"] }
which = "4.4"

[dev-dependencies]
tempfile = "3.8"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paddle Game - Clean Canvas Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f0f23;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      color: #4ecdc4;
      margin-bottom: 20px;
      font-size: 24px;
    }
    #canvas-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas-container canvas {
      border: 2px solid #4ecdc4;
      border-radius: 8px;
    }
    .controls {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }
    .controls span {
      color: #4ecdc4;
      font-weight: bold;
    }
    #fps {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #4ecdc4;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Paddle Game - Clean Canvas Runtime Test</h1>
  <div id="canvas-container"></div>
  <p class="controls">
    Controls: <span>← →</span> Arrow Keys to move | <span>SPACE</span> to restart
  </p>
  <div id="fps">FPS: --</div>

  <script src="../canvas-bridge.js"></script>
  <script>
    /**
     * Paddle Game - Tests the Clean Canvas Bridge
     * This is a JavaScript implementation that directly uses the bridge
     * to demonstrate and test the runtime before WASM compilation.
     */

    // ========================================================================
    // GAME CONSTANTS
    // ========================================================================
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 600;
    const PADDLE_WIDTH = 100;
    const PADDLE_HEIGHT = 15;
    const BALL_RADIUS = 10;
    const PADDLE_SPEED = 400;
    const INITIAL_BALL_SPEED = 300;

    // ========================================================================
    // GAME STATE
    // ========================================================================
    let state = {
      // Paddle
      paddleX: 350,
      paddleY: 560,

      // Ball
      ballX: 400,
      ballY: 300,
      ballVelX: 200,
      ballVelY: -250,

      // Score & Lives
      score: 0,
      lives: 3,
      gameOver: false,
      paused: false,

      // Bricks
      bricks: [],
      brickRows: 5,
      brickCols: 10,
      brickWidth: 70,
      brickHeight: 20,
      brickPadding: 8,
      brickOffsetTop: 50,
      brickOffsetLeft: 35
    };

    // ========================================================================
    // INITIALIZE BRIDGE
    // ========================================================================
    const bridge = new CanvasBridge();
    const memory = new WebAssembly.Memory({ initial: 256 });
    const imports = bridge.getImports(memory);
    const env = imports.env;

    // Initialize canvas
    const canvasId = env._canvas_init(CANVAS_WIDTH, CANVAS_HEIGHT);
    console.log('[Game] Canvas initialized:', canvasId);

    // ========================================================================
    // INITIALIZE BRICKS
    // ========================================================================
    function initBricks() {
      state.bricks = [];
      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3'];

      for (let row = 0; row < state.brickRows; row++) {
        for (let col = 0; col < state.brickCols; col++) {
          state.bricks.push({
            x: state.brickOffsetLeft + col * (state.brickWidth + state.brickPadding),
            y: state.brickOffsetTop + row * (state.brickHeight + state.brickPadding),
            alive: true,
            color: colors[row % colors.length]
          });
        }
      }
    }

    initBricks();

    // ========================================================================
    // GAME LOOP
    // ========================================================================
    function gameLoop() {
      const dt = bridge.deltaTime || 0.016;

      if (!state.paused) {
        update(dt);
      }

      render();
    }

    // ========================================================================
    // UPDATE
    // ========================================================================
    function update(dt) {
      if (state.gameOver) return;

      // Update paddle position based on input
      if (bridge.keysDown.has('ArrowLeft') || bridge.keysDown.has('a')) {
        state.paddleX -= PADDLE_SPEED * dt;
      }
      if (bridge.keysDown.has('ArrowRight') || bridge.keysDown.has('d')) {
        state.paddleX += PADDLE_SPEED * dt;
      }

      // Mouse control
      if (bridge.mouseX > 0) {
        const targetX = bridge.mouseX - PADDLE_WIDTH / 2;
        state.paddleX += (targetX - state.paddleX) * 0.1;
      }

      // Clamp paddle to screen
      state.paddleX = Math.max(0, Math.min(CANVAS_WIDTH - PADDLE_WIDTH, state.paddleX));

      // Update ball position
      state.ballX += state.ballVelX * dt;
      state.ballY += state.ballVelY * dt;

      // Ball collision with walls
      if (state.ballX < BALL_RADIUS) {
        state.ballX = BALL_RADIUS;
        state.ballVelX = -state.ballVelX;
      }
      if (state.ballX > CANVAS_WIDTH - BALL_RADIUS) {
        state.ballX = CANVAS_WIDTH - BALL_RADIUS;
        state.ballVelX = -state.ballVelX;
      }
      if (state.ballY < BALL_RADIUS) {
        state.ballY = BALL_RADIUS;
        state.ballVelY = -state.ballVelY;
      }

      // Ball collision with paddle
      const paddleHit = env._collision_circle_rect(
        state.ballX, state.ballY, BALL_RADIUS,
        state.paddleX, state.paddleY, PADDLE_WIDTH, PADDLE_HEIGHT
      );

      if (paddleHit && state.ballVelY > 0) {
        state.ballVelY = -Math.abs(state.ballVelY);
        state.ballY = state.paddleY - BALL_RADIUS;

        // Adjust X velocity based on where ball hits paddle
        const hitPos = (state.ballX - state.paddleX) / PADDLE_WIDTH;
        state.ballVelX = (hitPos - 0.5) * 500;

        // Increase speed slightly
        const speed = Math.sqrt(state.ballVelX ** 2 + state.ballVelY ** 2);
        const newSpeed = Math.min(speed * 1.02, 600);
        const ratio = newSpeed / speed;
        state.ballVelX *= ratio;
        state.ballVelY *= ratio;
      }

      // Ball collision with bricks
      for (const brick of state.bricks) {
        if (!brick.alive) continue;

        const hit = env._collision_circle_rect(
          state.ballX, state.ballY, BALL_RADIUS,
          brick.x, brick.y, state.brickWidth, state.brickHeight
        );

        if (hit) {
          brick.alive = false;
          state.ballVelY = -state.ballVelY;
          state.score += 10;

          // Check win condition
          if (state.bricks.every(b => !b.alive)) {
            state.score += 100;
            initBricks();
            resetBall();
          }
          break;
        }
      }

      // Ball falls off bottom
      if (state.ballY > CANVAS_HEIGHT + BALL_RADIUS) {
        state.lives--;
        if (state.lives <= 0) {
          state.gameOver = true;
        } else {
          resetBall();
        }
      }
    }

    function resetBall() {
      state.ballX = CANVAS_WIDTH / 2;
      state.ballY = CANVAS_HEIGHT / 2;
      state.ballVelX = (Math.random() - 0.5) * 200;
      state.ballVelY = -250;
    }

    function resetGame() {
      state.score = 0;
      state.lives = 3;
      state.gameOver = false;
      state.paddleX = CANVAS_WIDTH / 2 - PADDLE_WIDTH / 2;
      initBricks();
      resetBall();
    }

    // ========================================================================
    // RENDER
    // ========================================================================
    function render() {
      const canvas = bridge.canvases.get(canvasId);
      if (!canvas) return;
      const ctx = canvas.ctx;

      // Clear with gradient background
      const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      gradient.addColorStop(0, '#1a1a2e');
      gradient.addColorStop(1, '#16213e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Draw bricks
      for (const brick of state.bricks) {
        if (!brick.alive) continue;

        // Brick shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(brick.x + 3, brick.y + 3, state.brickWidth, state.brickHeight);

        // Brick
        ctx.fillStyle = brick.color;
        ctx.beginPath();
        ctx.roundRect(brick.x, brick.y, state.brickWidth, state.brickHeight, 4);
        ctx.fill();

        // Brick highlight
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(brick.x, brick.y, state.brickWidth, 4);
      }

      // Draw paddle with glow
      ctx.shadowColor = '#4ecdc4';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#4ecdc4';
      ctx.beginPath();
      ctx.roundRect(state.paddleX, state.paddleY, PADDLE_WIDTH, PADDLE_HEIGHT, 8);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw ball with glow
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(state.ballX, state.ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Ball trail effect
      ctx.fillStyle = 'rgba(255, 107, 107, 0.3)';
      ctx.beginPath();
      ctx.arc(state.ballX - state.ballVelX * 0.02, state.ballY - state.ballVelY * 0.02, BALL_RADIUS * 0.8, 0, Math.PI * 2);
      ctx.fill();

      // Draw score
      ctx.font = 'bold 24px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`Score: ${state.score}`, 20, 35);

      // Draw lives as hearts
      for (let i = 0; i < state.lives; i++) {
        const heartX = CANVAS_WIDTH - 30 - i * 30;
        ctx.fillStyle = '#e94560';
        ctx.beginPath();
        ctx.arc(heartX, 25, 10, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw game over
      if (state.gameOver) {
        // Overlay
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Game Over text
        ctx.font = 'bold 48px sans-serif';
        ctx.fillStyle = '#ff6b6b';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 30);

        ctx.font = '24px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Final Score: ${state.score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);

        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#4ecdc4';
        ctx.fillText('Press SPACE to restart', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 60);

        ctx.textAlign = 'left';
      }

      // Paused indicator
      if (state.paused && !state.gameOver) {
        ctx.font = 'bold 36px sans-serif';
        ctx.fillStyle = '#4ecdc4';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
        ctx.textAlign = 'left';
      }
    }

    // ========================================================================
    // INPUT HANDLING (document level for reliability)
    // ========================================================================
    document.addEventListener('keydown', (e) => {
      // Add to bridge keysDown for game input
      bridge.keysDown.add(e.key);

      if (e.key === ' ') {
        e.preventDefault();
        if (state.gameOver) {
          resetGame();
        } else {
          state.paused = !state.paused;
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      bridge.keysDown.delete(e.key);
    });

    // ========================================================================
    // FPS COUNTER
    // ========================================================================
    setInterval(() => {
      document.getElementById('fps').textContent = `FPS: ${bridge.fps}`;
    }, 500);

    // ========================================================================
    // START GAME LOOP
    // ========================================================================

    // Simulate the animation frame loop that the bridge would normally handle
    let lastTime = performance.now();
    function manualLoop(timestamp) {
      bridge.deltaTime = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      // Update FPS counter
      bridge.frameCount = (bridge.frameCount || 0) + 1;
      if (timestamp - (bridge.fpsLastTime || 0) >= 1000) {
        bridge.fps = bridge.frameCount;
        bridge.frameCount = 0;
        bridge.fpsLastTime = timestamp;
      }

      gameLoop();

      requestAnimationFrame(manualLoop);
    }

    // Focus canvas for keyboard input
    const canvasElement = bridge.canvases.get(canvasId).element;
    canvasElement.focus();

    console.log('[Game] Starting game loop...');
    requestAnimationFrame(manualLoop);
  </script>
</body>
</html>

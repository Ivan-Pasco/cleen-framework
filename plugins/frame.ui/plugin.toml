[plugin]
name = "frame.ui"
version = "2.6.2"
description = "HTML-first UI framework plugin - processes HTML pages with custom tags, event handling, hydration, and component definitions"
author = "Clean Language Team"
license = "MIT"

[compatibility]
min_compiler_version = "0.15.0"

[exports]
# HTML page processing (main entry point for pages)
process_html = "process_html"

# Component block expansion (for .cln component definitions)
expand = "expand_block"

# HTML validation against component registry
validate_html = "validate_html"

# Page metadata extraction
get_page_meta = "get_page_meta"

# IDE keyword support
get_keywords = "get_keywords"

[handles]
blocks = ["component", "screen", "page", "html"]

[html]
# File extensions processed as HTML pages
extensions = [".html"]

# Directives recognized in HTML
directives = ["cl-if", "cl-else", "cl-iterate", "cl-bind", "cl-client", "cl-slot", "cl-show", "cl-validate"]

# Event attributes recognized (with modifiers like .prevent, .stop)
events = ["onclick", "oninput", "onchange", "onsubmit", "onfocus", "onblur", "onkeydown", "onkeyup", "onmouseenter", "onmouseleave"]

# Event modifiers
event_modifiers = ["prevent", "stop", "once", "enter", "escape", "space"]

# Interpolation syntax
interpolation_escaped = "{{}}"
interpolation_raw = "{{{}}}"

# Hydration modes
hydration_modes = ["off", "on", "visible", "idle", "only"]

# Bridge function declarations - UI runtime functions
# Convention: bridge names use snake_case with _namespace_ prefix
# e.g. ui.toggleClass → _ui_toggle_class
[bridge]
functions = [
  # HTML Rendering
  { name = "_html_escape", params = ["string"], returns = "string", description = "Escape HTML entities in string", expand_strings = true },
  { name = "_html_raw", params = ["string"], returns = "string", description = "Return raw HTML without escaping", expand_strings = true },

  # Component Registry
  { name = "_ui_register_component", params = ["string", "string"], returns = "integer", description = "Register component: tag name, class name", expand_strings = true },
  { name = "_ui_get_component", params = ["string"], returns = "string", description = "Get component class by tag name", expand_strings = true },

  # Layout Loading
  { name = "_ui_load_layout", params = ["string"], returns = "string", description = "Load layout HTML template by name from app/layouts/", expand_strings = true },

  # Slot Management
  { name = "_ui_set_slot", params = ["string", "string"], returns = "integer", description = "Set slot content: slot name, content", expand_strings = true },
  { name = "_ui_get_slot", params = ["string"], returns = "string", description = "Get slot content by name", expand_strings = true },

  # Event Handler Registration (for client-side hydration)
  { name = "_ui_on_event", params = ["string", "string", "handler"], returns = "integer", description = "Register event handler: selector, event type, handler function", expand_strings = true },

  # State Management (for hydration)
  { name = "_ui_set_state", params = ["string", "string"], returns = "integer", description = "Set component state: component id, state JSON", expand_strings = true },
  { name = "_ui_get_state", params = ["string"], returns = "string", description = "Get component state by ID", expand_strings = true },

  # DOM Manipulation (for client-side updates)
  { name = "_ui_update_element", params = ["string", "string"], returns = "integer", description = "Update element content: selector, new content", expand_strings = true },
  { name = "_ui_update_attr", params = ["string", "string", "string"], returns = "integer", description = "Update element attribute: selector, attr name, value", expand_strings = true },

  # Form Binding
  { name = "_ui_bind_input", params = ["string", "string"], returns = "integer", description = "Bind input to state: selector, state path", expand_strings = true },

  # Validation
  { name = "_ui_validate", params = ["string", "string"], returns = "string", description = "Validate value against rule: value, rule type - returns error or empty", expand_strings = true },

  # Event Handler Context (available during event callbacks)
  { name = "_ui_event_attr", params = ["string"], returns = "string", description = "Get attribute value from current event target element", expand_strings = true },
  { name = "_ui_event_value", params = [], returns = "string", description = "Get value/textContent of current event target element" },
  { name = "_ui_event_closest_attr", params = ["string", "string"], returns = "string", description = "Find closest ancestor matching selector, return its attribute value", expand_strings = true },
  { name = "_ui_event_type", params = [], returns = "string", description = "Get the type of the current event (click, input, etc.)" },

  # Clipboard
  { name = "_ui_clipboard_write", params = ["string"], returns = "integer", description = "Write text to clipboard (navigator.clipboard.writeText)", expand_strings = true },

  # URL / Location
  { name = "_ui_location_href", params = ["string"], returns = "integer", description = "Navigate to URL (window.location.href)", expand_strings = true },
  { name = "_ui_location_query", params = ["string"], returns = "string", description = "Get URL query parameter value", expand_strings = true },
  { name = "_ui_location_path", params = [], returns = "string", description = "Get current URL pathname" },

  # DOM Query (single element)
  { name = "_ui_get_text", params = ["string"], returns = "string", description = "Get textContent of first element matching selector", expand_strings = true },
  { name = "_ui_get_attr", params = ["string", "string"], returns = "string", description = "Get attribute of first element matching selector", expand_strings = true },
  { name = "_ui_toggle_class", params = ["string", "string"], returns = "integer", description = "Toggle CSS class on first element matching selector", expand_strings = true },
  { name = "_ui_add_class", params = ["string", "string"], returns = "integer", description = "Add CSS class to first element matching selector", expand_strings = true },
  { name = "_ui_remove_class", params = ["string", "string"], returns = "integer", description = "Remove CSS class from first element matching selector", expand_strings = true },
  { name = "_ui_set_style", params = ["string", "string", "string"], returns = "integer", description = "Set inline style property on first element: selector, property, value", expand_strings = true },
  { name = "_ui_update_element_self", params = ["string"], returns = "integer", description = "Update textContent of the current event target element", expand_strings = true },

  # DOM Batch (querySelectorAll)
  { name = "_ui_query_set_style", params = ["string", "string", "string"], returns = "integer", description = "Set style property on ALL elements matching selector", expand_strings = true },
  { name = "_ui_query_set_attr", params = ["string", "string", "string"], returns = "integer", description = "Set attribute on ALL elements matching selector", expand_strings = true },
  { name = "_ui_query_add_class", params = ["string", "string"], returns = "integer", description = "Add class to ALL elements matching selector", expand_strings = true },
  { name = "_ui_query_remove_class", params = ["string", "string"], returns = "integer", description = "Remove class from ALL elements matching selector", expand_strings = true },
  { name = "_ui_filter_by_attr", params = ["string", "string", "string"], returns = "integer", description = "Show elements where attr matches value, hide others (* for all)", expand_strings = true },
  { name = "_ui_filter_by_text", params = ["string", "string", "string", "string"], returns = "integer", description = "Filter elements by text search across name and description attributes", expand_strings = true },

  # IntersectionObserver
  { name = "_ui_observe_visible", params = ["string", "string"], returns = "integer", description = "Add class to elements when they become visible (one-shot)", expand_strings = true },

  # Timers
  { name = "_ui_set_timeout", params = ["handler", "integer"], returns = "integer", description = "Call handler function after delay ms: handler, delay_ms" },

  # Theming
  { name = "_ui_inject_head_css", params = ["string"], returns = "integer", description = "Inject CSS string into the page <head> as a <style> element", expand_strings = true },

  # Form Helpers
  { name = "_ui_input_value", params = ["string"], returns = "string", description = "Get value of input/textarea/select matching selector", expand_strings = true },
  { name = "_ui_form_json", params = ["string"], returns = "string", description = "Collect all named inputs in form as JSON object string", expand_strings = true },
  { name = "_ui_form_data", params = ["string"], returns = "string", description = "Collect all named inputs as URL-encoded key=value string", expand_strings = true },
  { name = "_ui_checked", params = ["string"], returns = "integer", description = "Get checkbox checked state (0=unchecked, 1=checked)", expand_strings = true },
  { name = "_ui_set_input", params = ["string", "string"], returns = "integer", description = "Set value of input/textarea/select", expand_strings = true },
]

[language]
# Block-level keywords that start a declaration
blocks = ["component", "screen", "page", "styles", "html", "ui"]

# Keywords used within plugin context
keywords = [
  { name = "state", description = "Component state declaration", context = "block" },
  { name = "props", description = "Component props declaration", context = "block" },
  { name = "render", description = "Component render function", context = "block" },
  { name = "handlers", description = "Event handlers block", context = "block" },
  { name = "computed", description = "Computed properties", context = "block" },
  { name = "variables", description = "CSS variables declaration", context = "block" },
  { name = "global", description = "Global CSS styles", context = "block" },
  { name = "var", description = "html: block named variable attribute (html: var=\"name\")", context = "attribute" },
  { name = "if", description = "Conditional rendering directive", context = "directive" },
  { name = "else", description = "Else clause for conditional", context = "directive" },
  { name = "iterate", description = "Iterate rendering directive (cl-iterate)", context = "directive" },
  { name = "bind", description = "Two-way data binding", context = "directive" },
  { name = "client", description = "Hydration mode attribute", context = "attribute" },
  { name = "slot", description = "Slot for content projection", context = "directive" },
  { name = "show", description = "Conditional visibility", context = "directive" },
  { name = "validate", description = "Form validation directive", context = "directive" },
  { name = "theme", description = "Theme configuration sub-block inside ui:", context = "block" },
  { name = "colors", description = "Color variables sub-block inside theme:", context = "block" },
  { name = "spacing", description = "Spacing variables sub-block inside theme:", context = "block" },
]

# Custom types provided by the plugin
types = [
  { name = "Component", description = "UI component type" },
  { name = "Props", description = "Component properties type" },
  { name = "State", description = "Component state type" },
]

# Built-in functions/expressions
functions = [
  { name = "rawHtml", signature = "rawHtml(content)", description = "Render unescaped HTML (use with caution)" },
  { name = "escape", signature = "escape(text)", description = "Escape HTML entities" },
  { name = "slot", signature = "slot(name?)", description = "Render slot content" },
  { name = "_html_escape", signature = "_html_escape(text)", description = "Escape HTML entities (auto-generated by {expr} interpolation in html: blocks)" },
  { name = "ui.inputValue", signature = "ui.inputValue(selector)", description = "Get value of input/textarea/select by CSS selector", maps_to = "_ui_input_value" },
  { name = "ui.formJson", signature = "ui.formJson(selector)", description = "Collect all named form inputs as JSON object string", maps_to = "_ui_form_json" },
  { name = "ui.formData", signature = "ui.formData(selector)", description = "Collect all named form inputs as URL-encoded string", maps_to = "_ui_form_data" },
  { name = "ui.checked", signature = "ui.checked(selector)", description = "Get checkbox checked state (0 or 1)" },
  { name = "ui.setInput", signature = "ui.setInput(selector, value)", description = "Set value of input/textarea/select", maps_to = "_ui_set_input" },
  { name = "ui.onEvent", signature = "ui.onEvent(selector, eventType, handler)", description = "Register event handler for CSS selector and event type", maps_to = "_ui_on_event" },
  { name = "ui.toggleClass", signature = "ui.toggleClass(selector, className)", description = "Toggle CSS class on first matching element", maps_to = "_ui_toggle_class" },
  { name = "ui.addClass", signature = "ui.addClass(selector, className)", description = "Add CSS class to first matching element", maps_to = "_ui_add_class" },
  { name = "ui.removeClass", signature = "ui.removeClass(selector, className)", description = "Remove CSS class from first matching element", maps_to = "_ui_remove_class" },
  { name = "ui.setStyle", signature = "ui.setStyle(selector, property, value)", description = "Set inline style on first matching element", maps_to = "_ui_set_style" },
  { name = "ui.setState", signature = "ui.setState(id, json)", description = "Set component state by ID", maps_to = "_ui_set_state" },
  { name = "ui.getState", signature = "ui.getState(id)", description = "Get component state by ID", maps_to = "_ui_get_state" },
  { name = "ui.updateElement", signature = "ui.updateElement(selector, content)", description = "Update element innerHTML", maps_to = "_ui_update_element" },
  { name = "ui.updateAttr", signature = "ui.updateAttr(selector, attr, value)", description = "Update element attribute", maps_to = "_ui_update_attr" },
  { name = "ui.eventAttr", signature = "ui.eventAttr(attr)", description = "Get attribute from current event target", maps_to = "_ui_event_attr" },
  { name = "ui.eventValue", signature = "ui.eventValue()", description = "Get value/textContent of current event target", maps_to = "_ui_event_value" },
  { name = "ui.eventClosestAttr", signature = "ui.eventClosestAttr(selector, attr)", description = "Get attribute from closest ancestor matching selector", maps_to = "_ui_event_closest_attr" },
  { name = "ui.clipboardWrite", signature = "ui.clipboardWrite(text)", description = "Write text to clipboard", maps_to = "_ui_clipboard_write" },
  { name = "ui.locationHref", signature = "ui.locationHref(url)", description = "Navigate to URL", maps_to = "_ui_location_href" },
  { name = "ui.locationQuery", signature = "ui.locationQuery(param)", description = "Get URL query parameter", maps_to = "_ui_location_query" },
  { name = "ui.locationPath", signature = "ui.locationPath()", description = "Get current URL pathname", maps_to = "_ui_location_path" },
  { name = "ui.observeVisible", signature = "ui.observeVisible(selector, className)", description = "Add class when elements become visible", maps_to = "_ui_observe_visible" },
  { name = "ui.setTimeout", signature = "ui.setTimeout(handler, delayMs)", description = "Call handler after delay", maps_to = "_ui_set_timeout" },
  { name = "ui.filterByAttr", signature = "ui.filterByAttr(selector, attr, value)", description = "Show/hide elements by attribute match", maps_to = "_ui_filter_by_attr" },
  { name = "ui.filterByText", signature = "ui.filterByText(selector, nameAttr, descAttr, query)", description = "Filter elements by text search", maps_to = "_ui_filter_by_text" },
  { name = "ui.queryAddClass", signature = "ui.queryAddClass(selector, className)", description = "Add class to ALL matching elements", maps_to = "_ui_query_add_class" },
  { name = "ui.queryRemoveClass", signature = "ui.queryRemoveClass(selector, className)", description = "Remove class from ALL matching elements", maps_to = "_ui_query_remove_class" },
]

# Auto-completion suggestions
completions = [
  { trigger = "component ", insert = "component ${1:Name}:\n\tstate:\n\t\t${2:field}: ${3:value}\n\n\trender:\n\t\t${4:// template}" },
  { trigger = "styles ", insert = "styles ${1:Name}:\n\tvariables:\n\t\t${2:color-primary}: \"${3:#3b82f6}\"" },
  { trigger = "state:", insert = "state:\n\t${1:field}: ${2:value}" },
  { trigger = "render:", insert = "render:\n\t${1:// template}" },
  { trigger = "html:", insert = "html:\n\t<div>\n\t\t${1:content}\n\t</div>" },
  { trigger = "html: var", insert = "html: var=\"${1:name}\"\n\t<div>\n\t\t${2:content}\n\t</div>" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/pages", "app/components", "app/layouts"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln", "*.html"]

# Files in owned folders automatically import this plugin
implicit_import = true

[templates]
# Starter files created when plugin is added to a project
files = [
  { path = "app/pages/index.html", template = "index.html" },
]

[enforcement]
severity = "warn"

restricted_functions = []

required_blocks = [
  { folder = "app/components/", block = "component", message = "Component files should contain 'component' definitions" },
]

block_folder_rules = [
  { block = "component", allowed_in = ["app/components/"], message = "component: blocks should be in app/components/" },
  { block = "screen", allowed_in = ["app/pages/", "app/components/"], message = "screen: blocks should be in app/pages/ or app/components/" },
]

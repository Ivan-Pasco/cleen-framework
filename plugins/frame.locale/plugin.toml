[plugin]
name = "frame.locale"
version = "1.0.3"
description = "Internationalization: translation keys, locale detection, number/currency/date formatting. v1.0.3: Plugin Contracts v3 pilot — first plugin migrated from v1 string emission to v3 typed AST emission. Declares [compatibility].expansion_version = \"3.0.0\" and per-block dispatch selecting expand_block_typed for the locale: block. The v1 expand and emit_locale_helpers exports are preserved for pre-v3 compilers. See foundation/spec/plugins/contracts/typed-emission.md and migration.md §1.5."
author = "Clean Language Team"
license = "MIT"

[compatibility]
min_compiler_version = "0.15.0"
# Plugin Contracts v2 — runtime-abi.md §4. ABI version stamped into WASM at
# compile time when built with --target=plugin; loader verifies it when
# present. "1.0.0" is the initial declared value per migration.md §1.5.
abi_version = "1.0.0"
# Plugin Contracts v3 — typed-emission.md §2.1. Opts this plugin into typed
# AST emission at the plugin level. Per-block dispatch below selects which
# ABI a specific expand entry point uses.
expansion_version = "3.0.0"
# SHA-256 (lowercase hex, 64 chars) of foundation/spec/plugins/contracts/typed-emission-ops.toml
# as of this plugin build. Validated by the loader against the compiler's
# EMISSION_OPS_HASH constant (typed-emission.md §3.10, wasm_loader.rs three-case check).
emission_ops_hash = "60d06836a7068ee66a330e8c26ca59bc47cc44991b4f31d56e95e06c707eeaf0"

# Plugin Contracts v3 per-block dispatch — typed-emission.md §2.1 and §6.
# The `locale:` block uses v3 typed emission (expand_block_typed); older
# compilers that do not understand [blocks] fall back to [exports].expand.
[blocks.locale]
expand = "expand_block_typed"
version = 3

[lifecycle]
# Plugin Contracts v2 — lifecycle.md §3.1. t()/tc() and locale.* helpers are
# called from user code directly (they are bridge aliases, not generated code).
# module_helpers_are_roots is set so any wrapper functions the slot emits in
# a future cycle are not tree-shaken when only reachable from plugin-generated
# code paths.
module_helpers_are_roots = true

# Plugin Contracts v2 — lifecycle.md §3.1. WASM export name; compiler calls
# emit_locale_helpers(context_json) once per source file that loads frame.locale,
# splices the returned `statements` into the file's symbol table.
#
# Deviation from migration.md §1.5 (documented inline in src/main.cln):
# frame.locale has no __preamble magic block. The t() and tc() functions are
# bridge aliases resolved from [aliases] in plugin.toml — they emit no extra
# Clean source. The Locale type is a plain string typedef, which the compiler
# currently inlines. Emitting them unconditionally from this slot would either
# duplicate alias declarations (compile error) or produce an empty type stub.
# Moving alias resolution into module_helpers output requires the compiler's
# alias table to consume slot output; that is a Phase D change. The slot
# returns an empty body; the declaration completes the migration.md §1.5
# manifest surface.
module_helpers = "emit_module_helpers_typed"

# Note on [[artifacts]]: migration.md §1.5 marks locales.json as OPTIONAL —
# "declare only if the plugin actually generates one". frame.locale does NOT
# produce a locales.json at build time. Translation files are loaded at
# runtime by _i18n_load calls emitted into start: by expand_locale, pointing
# at user-supplied JSON files under app/i18n/. No [[artifacts]] entry is
# declared.

[handles]
blocks = ["locale"]

[exports]
expand = "expand"
get_keywords = "get_keywords"

# Bridge function declarations
#
# Plugin Contracts v2 — foundation/spec/plugins/contracts/bridge-host-classes.md §2.
# Translation lookup and locale-aware formatting (ICU-style) are Layer 2 pure
# compute and run on every host. `_i18n_load` reads translation tables from
# disk at startup, which is server/native-only — browsers receive translations
# bundled or via api.* fetches, not from a local filesystem path.
[bridge]
functions = [
  { name = "_i18n_t", params = ["string", "string"], returns = "string", expand_strings = true, hosts = ["all"] },
  { name = "_i18n_t_count", params = ["string", "integer", "string"], returns = "string", expand_strings = true, hosts = ["all"] },
  { name = "_i18n_locale", params = [], returns = "string", hosts = ["all"] },
  { name = "_i18n_set_locale", params = ["string"], returns = "void", expand_strings = true, hosts = ["all"] },
  { name = "_i18n_format_number", params = ["number", "string", "string"], returns = "string", expand_strings = true, hosts = ["all"] },
  { name = "_i18n_format_currency", params = ["number", "string", "string"], returns = "string", expand_strings = true, hosts = ["all"] },
  { name = "_i18n_format_date", params = ["number", "string", "string"], returns = "string", expand_strings = true, hosts = ["all"] },
  { name = "_i18n_load", params = ["string", "string"], returns = "void", expand_strings = true, hosts = ["server"] },
]

[language]
blocks = ["locale"]
keywords = [
  { name = "locale", description = "Locale configuration block", context = "top-level" },
  { name = "default", description = "Default locale BCP 47 tag", context = "locale" },
  { name = "fallback", description = "Fallback locale", context = "locale" },
  { name = "detection", description = "Locale detection strategy: header|cookie|query|manual", context = "locale" },
  { name = "path", description = "Path to translation files", context = "locale" },
]
types = [
  { name = "Locale", description = "BCP 47 locale identifier string" },
]
functions = [
  { name = "t", signature = "t(key, params) -> string", description = "Translate a key. params is a JSON object for interpolation." },
  { name = "tc", signature = "tc(key, count, params) -> string", description = "Translate with plural form selection." },
  { name = "locale.current", signature = "locale.current() -> string", description = "Current locale BCP 47 tag." },
  { name = "locale.set", signature = "locale.set(locale)", description = "Change active locale." },
  { name = "locale.formatNumber", signature = "locale.formatNumber(value, locale, options) -> string", description = "Format number in locale." },
  { name = "locale.formatCurrency", signature = "locale.formatCurrency(value, currency, locale) -> string", description = "Format currency value." },
  { name = "locale.formatDate", signature = "locale.formatDate(timestamp, style, locale) -> string", description = "Format date with style: short|medium|long|full." },
]
completions = [
  { trigger = "locale:", insert = "locale:\n\tdefault = \"${1:en}\"\n\tfallback = \"en\"\n\tdetection = \"header\"\n\tpath = \"app/i18n\"" },
  { trigger = "t(", insert = "t(\"${1:key}\", \"{}\")" },
]

[paths]
owns = ["app/i18n"]
auto_create = true
patterns = ["*.json"]

[aliases]
functions = [
  { clean_name = "t", bridge_name = "_i18n_t" },
  { clean_name = "tc", bridge_name = "_i18n_t_count" },
  { clean_name = "locale.current", bridge_name = "_i18n_locale" },
  { clean_name = "locale.set", bridge_name = "_i18n_set_locale" },
  { clean_name = "locale.formatNumber", bridge_name = "_i18n_format_number" },
  { clean_name = "locale.formatCurrency", bridge_name = "_i18n_format_currency" },
  { clean_name = "locale.formatDate", bridge_name = "_i18n_format_date" },
]

[ai]
description = "Internationalization plugin. Use locale: block to configure default language and translation file path. Use t() for string lookups, tc() for pluralization, locale.format*() for numbers/currencies/dates. Set locale per-request in middleware — never at startup."
constraints = [
  "Always set locale per-request (in middleware or handler) — locale.set() is request-scoped on the server",
  "Use tc() for any string involving a count — never concatenate count into a translated string manually",
  "Translation keys must be dot-namespaced (e.g. 'tasks.empty', 'user.greeting') — flat keys become unmaintainable at scale",
]

[[ai.patterns]]
name = "per-request-locale"
use_when = "a server API must return translated strings based on the caller's locale (Accept-Language header or stored user preference)"
anti_pattern = "calling locale.set() once at startup and sharing it across all requests — the server handles concurrent requests; locale must be set per-request in middleware or at the top of each handler"
example = "patterns/per-request-locale.cln"

[[ai.patterns]]
name = "locale-aware-formatting"
use_when = "displaying prices, statistics, or dates that must match the user's regional formatting conventions"
anti_pattern = "hardcoding number formatting (e.g. '$' + price.toString()) — different locales use different decimal separators, grouping symbols, and currency placement. Use locale.formatCurrency(), locale.formatNumber(), locale.formatDate()."
example = "patterns/locale-aware-formatting.cln"

[build]
built_with_compiler = "0.30.409"
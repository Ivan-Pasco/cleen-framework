  { name = "_ui_clipboard_read_cb", params = ["string", "string"], returns = "void", description = "Read text from clipboard with callbacks: onSuccessHandler, onErrorHandler", expand_strings = true, signature = "_ui_clipboard_read_cb(onSuccess, onError)", hosts = ["browser"] },

  # HTTP fetch with custom headers (async with single callback)

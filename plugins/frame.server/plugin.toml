[plugin]
name = "frame.server"
version = "2.9.7"
description = "HTTP endpoints, routing, middleware, and request/response helpers for Clean Language server-side applications. See CHANGELOG.md for release history."
author = "Clean Language Team"
license = "MIT"

[compatibility]
min_compiler_version = "0.33.71"
requires = "clean-server"
# Plugin Contracts v2 — foundation/spec/plugins/contracts/runtime-abi.md.
# Compiler stamps plugin.wasm with this value in the `clean.abi_version`
# custom section. Loaders use it to reject WASM compiled against an
# incompatible ABI. Bumped per runtime-abi.md §4 when the ABI changes.
abi_version = "1.0.0"
# Plugin Contracts v3 — typed-emission.md §2.1.
# Atomic migration: this plugin.wasm is v3-only. No v1 exports are present.
# emission_ops_hash verified against SHA-256 of
# foundation/spec/plugins/contracts/typed-emission-ops.toml (2026-07-01).
expansion_version = "3.0.0"
emission_ops_hash = "60d06836a7068ee66a330e8c26ca59bc47cc44991b4f31d56e95e06c707eeaf0"

[lifecycle]
# Plugin Contracts v3 — lifecycle.md §3.1 + typed-emission.md §7.
# module_helpers_are_roots: response helpers (jsonResponse, badRequest, etc.)
# are emitted via _emit_function in emit_module_helpers_typed. The flag is
# preserved so the BFS treats all emitted functions as roots (bit 2 in
# _emit_function flags also sets this per-function, providing dual coverage).
module_helpers_are_roots = true

# v3 typed variants — typed-emission.md §7.
module_helpers = "emit_module_helpers_typed"
server_init    = "emit_server_init_typed"
per_request    = "emit_per_request_typed"

[handles]
blocks = ["endpoints", "middleware", "routes", "server"]

# Plugin Contracts v3 — typed-emission.md §2.1.
# expand_block_typed is the single v3 entry point for all blocks.
# version = 3 is required on every block when expansion_version = "3.0.0".
[blocks]
endpoints  = { expand = "expand_block_typed", version = 3 }
server     = { expand = "expand_block_typed", version = 3 }
routes     = { expand = "expand_block_typed", version = 3 }
middleware = { expand = "expand_block_typed", version = 3 }

[exports]
# v1 `expand` entry is NOT listed here — v3-only plugin.wasm has no v1 exports.
# The compiler dispatches to expand_block_typed via [blocks] entries.
validate = "validate_block"
get_keywords = "get_keywords"

# Bridge function declarations - server-specific functions provided by clean-server
#
# Plugin Contracts v2 — foundation/spec/plugins/contracts/bridge-host-classes.md §2:
#   hosts = ["all"]    — Layer 2 portable (pure compute: JSON, URL encoding)
#   hosts = ["server"] — Layer 3 server-only (HTTP request/response context,
#                        routing, session-based auth, server-side outbound HTTP,
#                        SMTP, WebSocket/SSE server endpoints)
#
# Without `hosts` markers the compiler defaults to ["all"], which causes client
# (browser) builds to emit unresolved imports for server-only functions like
# `_auth_require_auth`, `_req_param`, `_http_redirect` — surfaces as
# CLIENT_BUILD_ENTRY_LEAK at codegen time. Tag every server-only bridge.
[bridge]
functions = [
  # Compiler-owned build_state keystore — used to coordinate routes:-block
  # guard records with frame.ui's assemble. expand_routes writes
  # `pattern|role,role,…;…` records to "frame.server:guards"; frame.ui reads
  # them back to wrap matching page-route render handlers with role checks.
  # Closes ROUTES-PATH-GUARDS-NOT-ENFORCED (78c8f54f5b53). Aligned to
  # foundation/platform-architecture/function-registry.toml: LP-string params
  # (expand_strings = true) and _set returns void. The compiler's
  # WasmPluginAdapter implements both as in-memory stubs at build time.
  { name = "_build_state_set", params = ["string", "string"], returns = "void", description = "Persist a key-value pair into the compiler-owned build_state keystore.", expand_strings = true, hosts = ["all"] },
  { name = "_build_state_get", params = ["string"], returns = "string", description = "Read a key from the compiler-owned build_state keystore. Returns the empty string when the key is absent.", expand_strings = true, hosts = ["all"] },

  # HTTP Server - Lifecycle (server-only; binds a socket)
  { name = "_http_listen", params = ["i32"], returns = "i32", description = "Start HTTP server on specified port", hosts = ["server"] },
  { name = "_http_listen_on", params = ["string", "i32"], returns = "i32", description = "Configure HTTP server to bind host (ptr+len) and port; supersedes _http_listen when the `server: host:` field is declared", expand_strings = true, hosts = ["server"] },

  # HTTP Server - Server-config bridges (server-only; populate runtime config before _http_listen)
  { name = "_cors_configure", params = ["string", "string", "string", "i32", "boolean"], returns = "i32", description = "Configure CORS: origins, methods, headers (comma-separated; '' = Any), max_age_secs, allow_credentials", expand_strings = true, hosts = ["server"] },
  { name = "_rate_limit_configure", params = ["i32", "i32", "string"], returns = "i32", description = "Configure fixed-window rate limiting: per_window, window_secs, strategy ('ip' or 'user')", expand_strings = true, hosts = ["server"] },
  { name = "_http_set_global_error_handler", params = ["string"], returns = "i32", description = "Register the WASM export name invoked when a route handler errors; server forwards error message in X-Clean-Error request header", expand_strings = true, hosts = ["server"] },

  # HTTP Server - Route Registration (server-only; populates the router)
  { name = "_http_route", params = ["string", "string", "string"], returns = "i32", description = "Register route: method, path, handler function name", expand_strings = true, hosts = ["server"] },
  { name = "_http_redirect_route", params = ["string", "string", "string", "i32"], returns = "i32", description = "Register static redirect: method, from-path, to-path, status (301/302/…). No WASM handler needed.", expand_strings = true, hosts = ["server"] },
  { name = "_http_route_protected", params = ["string", "string", "string", "string"], returns = "i32", description = "Register protected route: method, path, handler name, required role", expand_strings = true, hosts = ["server"] },
  # §FEXT-4: SSE route registration — sets Content-Type: text/event-stream and keeps connection open
  { name = "_http_sse_route", params = ["string", "string", "string"], returns = "i32", description = "Register SSE (STREAM) route: method, path, handler function name", expand_strings = true, hosts = ["server"] },
  # §15: WebSocket route registration — upgrades connection and invokes named handler functions
  { name = "_http_ws_route", params = ["string", "string", "string", "string", "string"], returns = "void", description = "Register WebSocket route: method, path, onConnect handler, onMessage handler, onClose handler", expand_strings = true, hosts = ["server"] },

  # §15: WebSocket bridge functions (server-only; used inside LIVE endpoint handlers)
  { name = "_ws_send", params = ["i64", "string"], returns = "void", description = "Send message to a specific WebSocket client by ID", expand_strings = true, hosts = ["server"] },
  { name = "_ws_broadcast", params = ["string", "string"], returns = "void", description = "Broadcast message to all clients in a room: room, message", expand_strings = true, hosts = ["server"] },
  { name = "_ws_close", params = ["i64"], returns = "void", description = "Close WebSocket connection for a specific client ID", hosts = ["server"] },
  { name = "_ws_client_id", params = [], returns = "i64", description = "Get the current WebSocket client ID", hosts = ["server"] },
  { name = "_ws_message", params = [], returns = "string", description = "Get the current incoming WebSocket message payload", hosts = ["server"] },
  { name = "_ws_room_join", params = ["i64", "string"], returns = "void", description = "Add a client to a named room: clientId, room", expand_strings = true, hosts = ["server"] },
  { name = "_ws_room_leave", params = ["i64", "string"], returns = "void", description = "Remove a client from a named room: clientId, room", expand_strings = true, hosts = ["server"] },
  { name = "_ws_room_broadcast", params = ["string", "string"], returns = "void", description = "Broadcast message to all clients in a room: room, message", expand_strings = true, hosts = ["server"] },

  # §FEXT-4: Server-Sent Events bridge functions (server-only; emits to the active SSE stream)
  { name = "_sse_emit", params = ["string"], returns = "i32", description = "Send data: event to SSE client on current connection", expand_strings = true, hosts = ["server"] },
  { name = "_sse_emit_event", params = ["string", "string"], returns = "i32", description = "Send named event+data to SSE client: event name, data string", expand_strings = true, hosts = ["server"] },
  { name = "_sse_close", params = [], returns = "i32", description = "Close the SSE stream; client receives final empty event", hosts = ["server"] },
  { name = "_sse_retry", params = ["i32"], returns = "i32", description = "Set client reconnect interval in milliseconds", hosts = ["server"] },
  { name = "_sse_is_connected", params = [], returns = "i32", description = "Returns 1 if SSE client is still connected, 0 if disconnected", hosts = ["server"] },

  # HTTP Server - Static Files (server-only; mounts a filesystem directory)
  { name = "_http_serve_static", params = ["string", "string"], returns = "boolean", description = "Mount filesystem directory as static file server: url_prefix, dir_path. Serves files with correct MIME types.", expand_strings = true, hosts = ["server"] },

  # Request Context - Path Parameters (server-only; needs an active HTTP request)
  { name = "_req_param", params = ["string"], returns = "string", description = "Get path parameter by name (e.g., :id)", expand_strings = true, hosts = ["server"] },
  { name = "_req_param_int", params = ["string"], returns = "i32", description = "Get path parameter as integer by name", expand_strings = true, hosts = ["server"] },

  # Request Context - Query Parameters (server-only)
  { name = "_req_query", params = ["string"], returns = "string", description = "Get query parameter by name", expand_strings = true, hosts = ["server"] },

  # Request Context - Headers (server-only)
  { name = "_req_header", params = ["string"], returns = "string", description = "Get request header by name", expand_strings = true, hosts = ["server"] },
  { name = "_req_headers", params = [], returns = "string", description = "Get all request headers as JSON object", hosts = ["server"] },

  # Request Context - Body (server-only)
  { name = "_req_body", params = [], returns = "string", description = "Get request body as string", hosts = ["server"] },
  # Opaque byte handle per spec/type-system.md §9b. Bridge returns raw `ptr`
  # (matches foundation/platform-architecture/function-registry.toml — required for
  # PLUGIN-REGISTRY-DRIFT parity). The req.body_bytes language surface below presents
  # it as `integer` at the user layer; the compiler applies the ptr→integer coercion
  # at the alias site. Additive to _req_body (UTF-8 string surface). Host
  # implementation ships in clean-server (bridge.rs).
  { name = "_req_body_bytes", params = [], returns = "ptr", description = "Get raw request body as opaque byte handle. Returns pointer to length-prefixed byte buffer ([4-byte LE length][bytes]); pass verbatim to bridges that accept a ptr handle. Used for binary uploads (gzip tarballs, octet-stream) that must not be UTF-8 decoded.", hosts = ["server"] },
  { name = "_req_body_field", params = ["string"], returns = "string", description = "Get form field by name from request body", expand_strings = true, hosts = ["server"] },
  { name = "_req_form", params = [], returns = "string", description = "Get form data as JSON object", hosts = ["server"] },

  # Request Context - Metadata (server-only)
  { name = "_req_method", params = [], returns = "string", description = "Get HTTP method (GET, POST, etc.)", hosts = ["server"] },
  { name = "_req_path", params = [], returns = "string", description = "Get request path", hosts = ["server"] },
  { name = "_req_ip", params = [], returns = "string", description = "Get client IP address", hosts = ["server"] },

  # Request Context - Cookies (server-only)
  { name = "_req_cookie", params = ["string"], returns = "string", description = "Get cookie value by name", expand_strings = true, hosts = ["server"] },

  # Response - Core (server-only; writes to the active HTTP response)
  { name = "_http_respond", params = ["i32", "string", "string"], returns = "ptr", description = "Send response: status, content-type, body", expand_strings = true, hosts = ["server"] },
  { name = "_http_redirect", params = ["i32", "string"], returns = "ptr", description = "Send redirect: status, url", expand_strings = true, hosts = ["server"] },
  { name = "_http_set_header", params = ["string", "string"], returns = "void", description = "Set response header: name, value", expand_strings = true, hosts = ["server"] },

  # Response - Extended (server-only)
  { name = "_res_set_header", params = ["string", "string"], returns = "boolean", description = "Set a custom response header", expand_strings = true, hosts = ["server"] },
  { name = "_res_redirect", params = ["string", "i32"], returns = "boolean", description = "Set redirect to URL with status code (301/302/303/307/308)", expand_strings = true, hosts = ["server"] },
  { name = "_res_status", params = ["i32"], returns = "void", description = "Set HTTP response status code", hosts = ["server"] },
  { name = "_res_body", params = ["string"], returns = "void", description = "Set raw response body string", expand_strings = true, hosts = ["server"] },
  { name = "_res_json", params = ["string"], returns = "void", description = "Set JSON response body with Content-Type: application/json", expand_strings = true, hosts = ["server"] },

  # Authentication - Session (server-only; session state lives on the server)
  { name = "_auth_get_session", params = [], returns = "string", description = "Get current session as JSON", hosts = ["server"] },
  { name = "_auth_require_auth", params = [], returns = "boolean", description = "Check if authenticated (1=yes, 0=no)", hosts = ["server"] },

  # Authentication - Roles (server-only; role enforcement lives on the server)
  { name = "_auth_require_role", params = ["string"], returns = "boolean", description = "Check if user has role (1=yes, 0=no)", expand_strings = true, hosts = ["server"] },
  { name = "_auth_can", params = ["string"], returns = "boolean", description = "Check if user has permission (1=yes, 0=no)", expand_strings = true, hosts = ["server"] },
  { name = "_auth_has_any_role", params = ["string"], returns = "boolean", description = "Check if user has any of the roles (JSON array) (1=yes, 0=no)", expand_strings = true, hosts = ["server"] },

  # Cache Headers (server-only; modifies response headers)
  { name = "_http_set_cache", params = ["i32"], returns = "boolean", description = "Set Cache-Control max-age header", hosts = ["server"] },
  { name = "_http_no_cache", params = [], returns = "boolean", description = "Set no-cache headers", hosts = ["server"] },

  # Async — Sleep (server-only; cooperative scheduling lives on the server runtime).
  # Matches function-registry.toml: params = ["integer"] -> WASM i64.
  # clean-server (|ms: i64|) expects i64. The `server.sleep` language function
  # (below) already declares integer; this bridge entry now matches.
  { name = "_server_sleep", params = ["integer"], returns = "void", description = "Sleep for the given number of milliseconds (yields to the server scheduler)", hosts = ["server"] },

  # HTML Page Rendering (SSR) — declaration MOVED to frame.ui plugin.toml.
  # _ui_render_page is part of frame.ui's SSR responsibility; declaring it
  # here forced server-only API apps (no frame.ui) to fail at plugin-registry
  # validation because the callback's plugin_target = "frame.ui" was missing.
  # See contracts/bridge-host-classes.md §4.1.

  # JSON Encoding/Decoding (pure compute — portable Layer 2)
  { name = "_json_encode", params = ["string"], returns = "string", description = "Encode value to JSON string", expand_strings = true, hosts = ["all"] },
  { name = "_json_decode", params = ["string"], returns = "string", description = "Decode JSON string to value", expand_strings = true, hosts = ["all"] },
  { name = "_json_get", params = ["any", "string"], returns = "any", description = "Extract value from JSON using dot-separated path (e.g., 'user.name'). First param is Any-boxed (typically a raw SQL result or already-boxed JSON string); second param is the path.", expand_strings = false, hosts = ["all"] },
  { name = "_json_encode_v2",        params = ["any"],    returns = "string", description = "Encode boxed-Any to compact JSON. Delivery 2 shape. Raises on invalid input.", expand_strings = false, hosts = ["all"] },
  { name = "_json_encode_pretty_v2", params = ["any"],    returns = "string", description = "Encode boxed-Any to 2-space indented JSON. Delivery 2 shape. Raises on invalid input.", expand_strings = false, hosts = ["all"] },
  { name = "_json_decode_v2",        params = ["string"], returns = "any",    description = "Decode JSON string to boxed-Any. Delivery 2 shape. Returns 0 sentinel on parse failure — caller must null-check.", expand_strings = true,  hosts = ["all"] },

  # HTTP Client - Basic Methods
  # Server-side outbound client. Browser code uses frame.client's api.* (declared in frame.client/plugin.toml).
  { name = "http_get", params = ["string"], returns = "string", description = "Execute HTTP GET request to URL; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_post", params = ["string", "string"], returns = "string", description = "Execute HTTP POST request with raw body; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_put", params = ["string", "string"], returns = "string", description = "Execute HTTP PUT request with raw body; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_patch", params = ["string", "string"], returns = "string", description = "Execute HTTP PATCH request with raw body; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_delete", params = ["string"], returns = "string", description = "Execute HTTP DELETE request; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_head", params = ["string"], returns = "string", description = "Execute HTTP HEAD request; returns response headers as JSON", expand_strings = true, hosts = ["server"] },
  { name = "http_options", params = ["string"], returns = "string", description = "Execute HTTP OPTIONS request; returns response body", expand_strings = true, hosts = ["server"] },

  # HTTP Client - JSON Convenience (server-only)
  { name = "http_post_json", params = ["string", "string"], returns = "string", description = "POST with Content-Type: application/json; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_put_json", params = ["string", "string"], returns = "string", description = "PUT with Content-Type: application/json; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_patch_json", params = ["string", "string"], returns = "string", description = "PATCH with Content-Type: application/json; returns response body", expand_strings = true, hosts = ["server"] },

  # HTTP Client - Form & Headers (server-only)
  { name = "http_post_form", params = ["string", "string"], returns = "string", description = "POST form-urlencoded body; returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_get_with_headers", params = ["string", "string"], returns = "string", description = "GET with custom headers (JSON object); returns response body", expand_strings = true, hosts = ["server"] },
  { name = "http_post_with_headers", params = ["string", "string", "string"], returns = "string", description = "POST with body and custom headers (JSON object); returns response body", expand_strings = true, hosts = ["server"] },
  # Plugin Contracts v2 — migration.md §1.2 closes BRIDGE001 by declaring
  # putWithHeaders/patchWithHeaders with hosts = ["all"]. Other http_* outbound
  # client bridges remain hosts = ["server"] (current scoping) until host
  # runtimes confirm cross-host parity; see migration.md §1.2 deviation note in
  # the rollout report.
  { name = "http_put_with_headers", params = ["string", "string", "string"], returns = "string", description = "PUT with body and custom headers (JSON object); returns response body", expand_strings = true, hosts = ["all"] },
  { name = "http_patch_with_headers", params = ["string", "string", "string"], returns = "string", description = "PATCH with body and custom headers (JSON object); returns response body", expand_strings = true, hosts = ["all"] },
  { name = "http_delete_with_headers", params = ["string", "string"], returns = "string", description = "DELETE with custom headers (JSON object); returns response body", expand_strings = true, hosts = ["server"] },

  # HTTP Client - Configuration (server-only)
  { name = "http_set_user_agent", params = ["string"], returns = "void", description = "Set User-Agent header for subsequent requests", expand_strings = true, hosts = ["server"] },
  { name = "http_set_timeout", params = ["i32"], returns = "void", description = "Set request timeout in milliseconds", hosts = ["server"] },
  { name = "http_set_max_redirects", params = ["i32"], returns = "void", description = "Set maximum number of redirects to follow", hosts = ["server"] },
  { name = "http_enable_cookies", params = ["boolean"], returns = "void", description = "Enable or disable cookie jar for subsequent requests (1=enable, 0=disable)", hosts = ["server"] },

  # HTTP Client - Response Inspection (server-only)
  { name = "http_get_response_code", params = [], returns = "i32", description = "Get the HTTP status code of the last response", hosts = ["server"] },
  { name = "http_get_response_headers", params = [], returns = "i32", description = "Get all headers from the last response as JSON", hosts = ["server"] },

  # HTTP Client - URL Utilities (pure compute — portable Layer 2)
  { name = "http_encode_url", params = ["string"], returns = "string", description = "Percent-encode a string for safe use in a URL", expand_strings = true, hosts = ["all"] },
  { name = "http_decode_url", params = ["string"], returns = "string", description = "Decode a percent-encoded URL string", expand_strings = true, hosts = ["all"] },
  { name = "http_build_query", params = ["string"], returns = "string", description = "Build a URL query string from a JSON object of key-value pairs", expand_strings = true, hosts = ["all"] },

  # Response - File Download (server-only; sets Content-Disposition on the active response)
  { name = "_res_download", params = ["string"], returns = "void", description = "Set Content-Disposition: attachment header for file download; argument is the filename sent to the client", expand_strings = true, hosts = ["server"] },

  # Filesystem - Binary Writes (server-only; requires disk access)
  # Contract mirrors foundation/platform-architecture/function-registry.toml (_fs_write_bytes).
  # Consumes bytes in the [4-byte LE length][bytes] layout produced by _req_body_bytes,
  # so a tarball upload flows: _req_body_bytes → crypto.sha256 → _fs_write_bytes, no UTF-8 detour.
  # Host implementation ships in clean-server — this declaration only
  # tells the compiler the symbol exists so Clean code can import it. First param is the path
  # (expand_strings splits string → ptr,len); second param is the raw byte-buffer pointer.
  # Returns 0 on success; non-zero error code (1=perm, 2=disk full, 3=invalid path, 4=parent
  # not directory, 5=I/O error). Additive to file_write (UTF-8 string surface).
  # Bridge returns i32 (matches foundation/platform-architecture/function-registry.toml —
  # required for PLUGIN-REGISTRY-DRIFT parity, and matches the spec/host_conformance
  # correction shipped in compiler v0.33.66). The fs.write_bytes language surface below
  # presents it as `integer` at the user layer; the compiler applies the i32→integer
  # coercion at the alias site.
  { name = "_fs_write_bytes", params = ["string", "ptr"], returns = "i32", description = "Write raw bytes ([4-byte LE length][bytes] layout, e.g. from _req_body_bytes) to path. Atomic (tmp+rename), overwrites existing, mkdir -p parent, path allowlist enforced by host. Returns 0 on success or a non-zero error code.", expand_strings = true, hosts = ["server"] },

  # Environment Variables (server-only; browser has no env). Declared here
  # because the env.get language function is owned by frame.server (see
  # [language] below) and frame.server/src/main.cln expands env.get(...)
  # references inside server config to _env_get(...) calls. Previously this
  # declaration only existed in frame.auth, which made env.get unresolvable
  # in any app that uses frame.server without frame.auth.
  { name = "_env_get", params = ["string"], returns = "ptr", description = "Get environment variable by name; returns empty string if unset or denied", expand_strings = true, hosts = ["server"] },

  # Dev-mode capture — the _dev_snapshot bridge declaration lives in
  # foundation/platform-architecture/function-registry.toml (@ layer 3, module
  # env). Not re-declared here to avoid PLUGIN-REGISTRY-DRIFT rejection on
  # cln 0.33.70, which shipped before that registry entry landed. The compiler
  # resolves _dev_snapshot from its embedded registry; clean-server provides
  # the runtime impl (dev_capture.rs, register_dev_capture_functions()).
  # expand_server_typed still emits `_dev_snapshot()` calls into user code
  # under the dev-capture route handler — those imports are generated at
  # user-app codegen time from the registry, not from this plugin.toml.
  # When cln releases with _dev_snapshot in its embedded registry, this
  # declaration MAY be added back (with matching signature) but is not
  # required for correctness.

  # Email - SMTP (server-only; reaches out to an SMTP relay)
  { name = "_email_configure", params = ["string", "integer", "boolean", "string", "string", "string"], returns = "void", description = "Configure SMTP connection: host, port, secure, username, password, from address. Called once during startup from a mail: config block.", expand_strings = true, hosts = ["server"] },
  { name = "_email_send", params = ["string", "string", "string", "string", "string"], returns = "boolean", description = "Send email: to, subject, html body, plain-text body, from override (empty string uses configured default). Returns true on success.", expand_strings = true, hosts = ["server"] },
  { name = "_email_last_error", params = [], returns = "string", description = "Return the error message from the last failed _email_send call; returns empty string when the last send succeeded.", hosts = ["server"] },
]

[language]
# Block-level keywords that start a declaration
blocks = ["endpoints", "middleware", "server"]

# Keywords used within plugin context
keywords = [
  { name = "GET", description = "HTTP GET endpoint", context = "block" },
  { name = "POST", description = "HTTP POST endpoint", context = "block" },
  { name = "PUT", description = "HTTP PUT endpoint", context = "block" },
  { name = "PATCH", description = "HTTP PATCH endpoint", context = "block" },
  { name = "DELETE", description = "HTTP DELETE endpoint", context = "block" },
  { name = "cache", description = "Cache hint modifier: cache(seconds) or cache(\"5m\"|\"2h\"|\"1d\"|\"no-store\"|\"no-cache\")", context = "route_header" },
  { name = "middleware", description = "Middleware definition block", context = "block" },
  { name = "body", description = "Request body parameter declaration", context = "block" },
  { name = "params", description = "Route parameter declaration", context = "block" },
  { name = "port", description = "Server port configuration", context = "config" },
  { name = "host", description = "Server host configuration", context = "config" },
  { name = "static", description = "Static file directory to serve (e.g. static: \"public/\")", context = "config" },
  { name = "cors", description = "CORS configuration", context = "config" },
  { name = "rateLimit", description = "Rate limiting configuration", context = "config" },
  { name = "mail", description = "SMTP mail configuration block — host, port, secure, username, password, from", context = "config" },
  { name = "LIVE", description = "WebSocket route declaration", context = "endpoints" },
]

# Custom types provided by the plugin
types = [
  { name = "RequestAuth", description = "Authentication context attached to a Request", fields = [{name="loggedIn", type="boolean", description="True when a valid session or JWT is present"}, {name="userId", type="string", description="Authenticated user ID (empty when not logged in)"}, {name="role", type="string", description="Primary role of the authenticated user"}, {name="roles", type="string", description="JSON array of all roles held by the user"}] },
  { name = "Request", description = "HTTP request context — available as a parameter in guard/load functions and endpoint handlers", fields = [{name="auth", type="RequestAuth", description="Authentication context (loggedIn, userId, role, roles)"}, {name="query", type="any", description="Query-string parameters object"}, {name="body", type="any", description="Parsed request body (JSON object or raw string)"}, {name="params", type="any", description="URL path parameters object"}, {name="headers", type="any", description="Request headers object"}, {name="method", type="string", description="HTTP method (GET, POST, etc.)"}, {name="path", type="string", description="Request URL path"}, {name="ip", type="string", description="Client IP address"}] },
  { name = "Response", description = "HTTP response object" },
]

# Built-in functions/expressions
functions = [
  # Response helpers — generated as Clean Language wrapper functions via preamble injection.
  # maps_to entries allow the compiler to register them as externals for type-checking
  # when they are referenced before the preamble is expanded (e.g. in functions: blocks).
  # render() and renderWith() moved to frame.ui (SSR is frame.ui's responsibility).
  { name = "json", signature = "json(data)", description = "Return JSON response with Content-Type: application/json", maps_to = "_res_json", params = ["string"], returns = "void" },
  { name = "html", signature = "html(content)", description = "Return HTML response" },
  { name = "redirect", signature = "redirect(url, status)", description = "Redirect to URL (default 302)", maps_to = "_res_redirect", params = ["string", "integer"], returns = "void" },
  { name = "notFound", signature = "notFound(message?)", description = "Return 404 Not Found response" },
  { name = "badRequest", signature = "badRequest(message?)", description = "Return 400 Bad Request response" },
  { name = "unauthorized", signature = "unauthorized()", description = "Return 401 Unauthorized response" },
  { name = "error", signature = "error(status, message)", description = "Return error response with given HTTP status" },
  { name = "status", signature = "status(code, body)", description = "Return response with specific HTTP status code" },
  # Request accessors
  { name = "req.param", signature = "req.param(name)", description = "Get path parameter by name", maps_to = "_req_param", params = ["string"], returns = "string" },
  { name = "req.params", signature = "req.params.fieldName", description = "Access path parameters as object fields" },
  { name = "req.query", signature = "req.query.fieldName", description = "Access query parameters as object fields" },
  { name = "req.header", signature = "req.header(name)", description = "Get request header by name", maps_to = "_req_header", params = ["string"], returns = "string" },
  { name = "req.headers", signature = "req.headers", description = "Get all request headers as JSON", maps_to = "_req_headers", params = [], returns = "string" },
  { name = "req.body", signature = "req.body()", description = "Get request body as string", maps_to = "_req_body", params = [], returns = "string" },
  # req.body_bytes → integer handle per spec/type-system.md §9b. Additive to req.body;
  # forward the returned integer to a handle-consumer like fs.write_bytes.
  { name = "req.body_bytes", signature = "req.body_bytes()", description = "Get raw request body as opaque byte handle (integer). Pass to fs.write_bytes / crypto.sha256_bytes; do NOT dereference. See type-system.md §9b.", maps_to = "_req_body_bytes", params = [], returns = "integer" },
  { name = "req.form", signature = "req.form()", description = "Get form data as JSON", maps_to = "_req_form", params = [], returns = "string" },
  { name = "req.json", signature = "req.json(Type)", description = "Deserialize request body as typed struct" },
  { name = "req.method", signature = "req.method()", description = "Get HTTP method (GET, POST, etc.)", maps_to = "_req_method", params = [], returns = "string" },
  { name = "req.path", signature = "req.path()", description = "Get request URL path", maps_to = "_req_path", params = [], returns = "string" },
  { name = "req.ip", signature = "req.ip", description = "Get client IP address", maps_to = "_req_ip", params = [], returns = "string" },
  { name = "req.cookie", signature = "req.cookie(name)", description = "Get cookie value by name", maps_to = "_req_cookie", params = ["string"], returns = "string" },
  # Authentication — spec-canonical aliases (foundation/spec/stdlib-reference.md §14)
  # backed by server-owned bridges (_auth_get_session, _auth_require_auth, etc.).
  # The richer auth.session.*, auth.jwt.* wrappers live in frame.auth.
  { name = "auth.getSession", signature = "auth.getSession()", description = "Get current session as JSON string", maps_to = "_auth_get_session", params = [], returns = "string" },
  { name = "auth.requireAuth", signature = "auth.requireAuth()", description = "Check if request is authenticated (true=yes, false=no)", maps_to = "_auth_require_auth", params = [], returns = "boolean" },
  { name = "auth.requireRole", signature = "auth.requireRole(role)", description = "Check if user has given role", maps_to = "_auth_require_role", params = ["string"], returns = "boolean" },
  { name = "auth.can", signature = "auth.can(permission)", description = "Check if user has given permission", maps_to = "_auth_can", params = ["string"], returns = "boolean" },
  { name = "auth.hasAnyRole", signature = "auth.hasAnyRole(roles)", description = "Check if user has any of the roles (JSON array of role names)", maps_to = "_auth_has_any_role", params = ["string"], returns = "boolean" },
  # fs namespace — binary-safe filesystem writes (Layer 2 server-host).
  # fs.write_bytes takes an opaque byte handle (integer per spec/type-system.md §9b),
  # not a Clean string. Pass req.body_bytes() straight through — no UTF-8 detour.
  # Returns integer error code (0 = success; see HOST_BRIDGE.md §File I/O).
  { name = "fs.write_bytes", signature = "fs.write_bytes(path, handle)", description = "Write opaque byte handle to path atomically (tmp+rename). Handle is the integer returned by req.body_bytes() or similar producer. Returns 0 on success, non-zero error code (1=perm, 2=disk full, 3=invalid path, 4=parent not directory, 5=I/O error). Path allowlist enforced by host.", maps_to = "_fs_write_bytes", params = ["string", "integer"], returns = "integer" },
  # Async — Sleep (Layer 3 server-only)
  { name = "server.sleep", signature = "server.sleep(milliseconds)", description = "Sleep for the given number of milliseconds (yields to the server scheduler)", maps_to = "_server_sleep", params = ["integer"], returns = "void" },
  # env namespace — read-only access to host environment variables (server-only).
  { name = "env.get", signature = "env.get(name)", description = "Get environment variable by name; returns empty string if not found or access is denied", maps_to = "_env_get", params = ["string"], returns = "string" },
  # time namespace — Unix timestamp in seconds.
  # `now()` is the bare alias used by frame.data plugin-generated code (e.g. createdAt defaults).
  # _time_now returns i64 at the bridge level; the compiler emits the i64→i32 wrap.
  { name = "time.now", signature = "time.now()", description = "Current Unix timestamp in seconds since epoch", maps_to = "_time_now", params = [], returns = "integer" },
  { name = "now", signature = "now()", description = "Alias for time.now() — current Unix timestamp in seconds", maps_to = "_time_now", params = [], returns = "integer" },
  # Server-side HTTP client
  { name = "http.get", signature = "http.get(url)", description = "Execute outbound HTTP GET request; returns response body", maps_to = "http_get", params = ["string"], returns = "string" },
  { name = "http.post", signature = "http.post(url, body)", description = "Execute outbound HTTP POST request; returns response body", maps_to = "http_post", params = ["string", "string"], returns = "string" },
  { name = "http.put", signature = "http.put(url, body)", description = "Execute outbound HTTP PUT request; returns response body", maps_to = "http_put", params = ["string", "string"], returns = "string" },
  { name = "http.patch", signature = "http.patch(url, body)", description = "Execute outbound HTTP PATCH request; returns response body", maps_to = "http_patch", params = ["string", "string"], returns = "string" },
  { name = "http.delete", signature = "http.delete(url)", description = "Execute outbound HTTP DELETE request; returns response body", maps_to = "http_delete", params = ["string"], returns = "string" },
  { name = "http.postJson", signature = "http.postJson(url, body)", description = "POST with Content-Type: application/json; returns response body", maps_to = "http_post_json", params = ["string", "string"], returns = "string" },
  { name = "http.putJson", signature = "http.putJson(url, body)", description = "PUT with Content-Type: application/json; returns response body", maps_to = "http_put_json", params = ["string", "string"], returns = "string" },
  { name = "http.postForm", signature = "http.postForm(url, formData)", description = "POST form-urlencoded body; returns response body", maps_to = "http_post_form", params = ["string", "string"], returns = "string" },
  { name = "http.getWithHeaders", signature = "http.getWithHeaders(url, headers)", description = "GET with custom headers (JSON object); returns response body", maps_to = "http_get_with_headers", params = ["string", "string"], returns = "string" },
  { name = "http.postWithHeaders", signature = "http.postWithHeaders(url, body, headers)", description = "POST with body and custom headers (JSON object); returns response body", maps_to = "http_post_with_headers", params = ["string", "string", "string"], returns = "string" },
  { name = "http.putWithHeaders", signature = "http.putWithHeaders(url, body, headers)", description = "PUT with body and custom headers (JSON object); returns response body", maps_to = "http_put_with_headers", params = ["string", "string", "string"], returns = "string" },
  { name = "http.patchWithHeaders", signature = "http.patchWithHeaders(url, body, headers)", description = "PATCH with body and custom headers (JSON object); returns response body", maps_to = "http_patch_with_headers", params = ["string", "string", "string"], returns = "string" },
  { name = "http.deleteWithHeaders", signature = "http.deleteWithHeaders(url, headers)", description = "DELETE with custom headers (JSON object); returns response body", maps_to = "http_delete_with_headers", params = ["string", "string"], returns = "string" },
  { name = "http.responseCode", signature = "http.responseCode()", description = "Get HTTP status code of the last outbound response", maps_to = "http_get_response_code", params = [], returns = "integer" },
  # Response cache headers (server-only)
  { name = "http.setCache", signature = "http.setCache(seconds)", description = "Set Cache-Control max-age in seconds; 0 or negative sets no-cache headers", maps_to = "_http_set_cache", params = ["integer"], returns = "boolean" },
  { name = "http.noCache",  signature = "http.noCache()",         description = "Set Cache-Control, Pragma, and Expires headers to disable all caching",     maps_to = "_http_no_cache",  params = [],          returns = "boolean" },
  # §FEXT-4: Server-Sent Events helpers (usable inside FEED endpoint handlers)
  { name = "feed.emit", signature = "feed.emit(data)", description = "Send data: event to the SSE client", maps_to = "_sse_emit", params = ["string"], returns = "integer" },
  { name = "feed.emitEvent", signature = "feed.emitEvent(name, data)", description = "Send named event+data to the SSE client", maps_to = "_sse_emit_event", params = ["string", "string"], returns = "integer" },
  { name = "feed.close", signature = "feed.close()", description = "Close the SSE stream and terminate the connection", maps_to = "_sse_close", params = [], returns = "integer" },
  { name = "feed.retry", signature = "feed.retry(ms)", description = "Set the client reconnect interval in milliseconds", maps_to = "_sse_retry", params = ["integer"], returns = "integer" },
  { name = "feed.isConnected", signature = "feed.isConnected() -> boolean", description = "Returns true if the SSE client is still connected", maps_to = "_sse_is_connected", params = [], returns = "boolean" },
  # §15: WebSocket helpers (usable inside LIVE endpoint handlers)
  { name = "live.send", signature = "live.send(clientId, message)", description = "Send message to a specific WebSocket client", maps_to = "_ws_send", params = ["i64", "string"], returns = "void" },
  { name = "live.broadcast", signature = "live.broadcast(room, message)", description = "Broadcast message to all clients in a room", maps_to = "_ws_broadcast", params = ["string", "string"], returns = "void" },
  { name = "live.close", signature = "live.close(clientId)", description = "Close a WebSocket connection by client ID", maps_to = "_ws_close", params = ["i64"], returns = "void" },
  { name = "live.clientId", signature = "live.clientId() -> i64", description = "Get the current WebSocket client ID", maps_to = "_ws_client_id", params = [], returns = "i64" },
  { name = "live.message", signature = "live.message() -> string", description = "Get the current incoming WebSocket message payload", maps_to = "_ws_message", params = [], returns = "string" },
  { name = "live.roomJoin", signature = "live.roomJoin(clientId, room)", description = "Add a client to a named room", maps_to = "_ws_room_join", params = ["i64", "string"], returns = "void" },
  { name = "live.roomLeave", signature = "live.roomLeave(clientId, room)", description = "Remove a client from a named room", maps_to = "_ws_room_leave", params = ["i64", "string"], returns = "void" },
  { name = "live.roomBroadcast", signature = "live.roomBroadcast(room, message)", description = "Broadcast message to all clients in a named room", maps_to = "_ws_room_broadcast", params = ["string", "string"], returns = "void" },
  # File download
  { name = "res.download", signature = "res.download(filename)", description = "Set Content-Disposition: attachment header so the browser downloads the response as a file named filename", maps_to = "_res_download", params = ["string"], returns = "void" },
  # Email helpers
  { name = "email.send", signature = "email.send(to, subject, html, text)", description = "Send email with HTML and plain-text body; uses configured SMTP server. Returns true on success.", maps_to = "_email_send", params = ["string", "string", "string", "string", "string"], returns = "boolean" },
  { name = "email.sendFrom", signature = "email.sendFrom(to, subject, html, text, from)", description = "Send email with explicit from address override. Returns true on success.", maps_to = "_email_send", params = ["string", "string", "string", "string", "string"], returns = "boolean" },
  { name = "email.lastError", signature = "email.lastError()", description = "Return error message from the last failed email.send call; empty string when last send succeeded", maps_to = "_email_last_error", params = [], returns = "string" },
]

# Auto-completion suggestions
completions = [
  { trigger = "server:", insert = "server:\n\tport: ${1:3000}\n\tstatic: \"${2:public/}\"" },
  { trigger = "endpoints:", insert = "endpoints:\n\t${1:GET} \"${2:/path}\" :\n\t\treturn json({ ${3:data} })" },
  { trigger = "GET ", insert = "GET \"${1:/path}\" :\n\treturn json({ ${2:data} })" },
  { trigger = "POST ", insert = "POST \"${1:/path}\" :\n\t${2:Type} body = req.json(${2:Type})\n\treturn json({ ${3:data} })" },
  { trigger = "FEED ", insert = "FEED \"${1:/api/events}\" :\n\tfeed.emit(\"started\")\n\tfeed.close()" },
  { trigger = "LIVE", insert = "LIVE \"${1:/path}\" :\n\t\t${2:// handler}" },
  { trigger = "[", insert = "[${1:role}]", context = "route_header" },
  { trigger = "middleware ", insert = "middleware ${1:Name}\n\tfunctions:\n\t\tRequest handle(Request req)\n\t\t\t${2:// inspect or modify request}\n\t\t\treturn req" },
  { trigger = "email.", insert = "email.send(${1:to}, ${2:subject}, ${3:html}, ${4:text})" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/server", "app/server/api", "app/server/middleware"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln"]

# Files in owned folders automatically import this plugin
implicit_import = true

[templates]
# Starter files created when plugin is added to a project
files = [
  { path = "app/server/api/health.cln", template = "health.cln" },
]

[aliases]
functions = [
  { clean_name = "live.send", bridge_name = "_ws_send" },
  { clean_name = "live.broadcast", bridge_name = "_ws_broadcast" },
  { clean_name = "live.close", bridge_name = "_ws_close" },
  { clean_name = "live.clientId", bridge_name = "_ws_client_id" },
  { clean_name = "live.message", bridge_name = "_ws_message" },
  { clean_name = "live.roomJoin", bridge_name = "_ws_room_join" },
  { clean_name = "live.roomLeave", bridge_name = "_ws_room_leave" },
  { clean_name = "live.roomBroadcast", bridge_name = "_ws_room_broadcast" },
]

[enforcement]
severity = "warn"

restricted_functions = [
  { name = "_http_route", use_instead = "endpoints:", message = "Use 'endpoints:' block to define routes instead of calling _http_route() directly" },
  { name = "_http_route_protected", use_instead = "endpoints: with [role] inline guard", message = "Use 'endpoints:' block with [role] inline guard on the route header for protected routes" },
  { name = "_http_listen", use_instead = "server:", message = "Use 'server:' block to configure and start the HTTP server" },
]

required_blocks = [
  { folder = "app/server/api/", block = "endpoints", message = "API endpoint files should use 'endpoints:' block" },
]

block_folder_rules = [
  { block = "endpoints", allowed_in = ["app/server/"], message = "endpoints: block should be in app/server/" },
  { block = "middleware", allowed_in = ["app/server/middleware/", "app/server/"], message = "middleware: block should be in app/server/middleware/" },
  { block = "server", allowed_in = ["app/server/", "app/"], message = "server: block should be in app/server/ or app root" },
  { block = "routes", allowed_in = ["app/ui/web/"], message = "routes: block must be in app/ui/web/routes.cln" },
]

[ai]
description = "HTTP server plugin. Define all routes inside endpoints: blocks. Apply auth checks with the inline [role] route modifier (e.g. GET \"/path\" [admin]:) — guard: sub-blocks are not supported. Use response helpers (json, html, redirect) — never call _http_respond or _http_route directly."
constraints = [
  "All routes must be declared inside endpoints: blocks — never call _http_route() directly",
  "Protected routes must use [role] inline guard on the route header line — e.g. GET \"/path\" [admin] :",
  "Always return a response helper (json, html, redirect, notFound) — never leave a handler without a return",
  "Validate request body at the endpoint boundary before passing to service functions",
]

[[ai.patterns]]
name = "versioned-api"
use_when = "building a public or partner-facing API that must remain stable as the app evolves"
anti_pattern = "no versioning prefix — a breaking change in your route or response shape breaks all clients with no migration path; prefix all public routes with /v1/ from day one"
example = "patterns/versioned-api.cln"

[[ai.patterns]]
name = "request-validation"
use_when = "any endpoint that accepts user-supplied input (body, query params, path params)"
anti_pattern = "validating only in the model or service layer — invalid input reaches business logic, causing confusing errors; validate at the endpoint boundary and return 400 immediately"
example = "patterns/request-validation.cln"

[[ai.patterns]]
name = "error-envelope"
use_when = "any API that must be consumed by clients (web, mobile, third-party)"
anti_pattern = "ad-hoc error strings with inconsistent shapes — clients can't reliably handle errors; use a consistent {code, message, field?} envelope across all endpoints"
example = "patterns/error-envelope.cln"

[[ai.patterns]]
name = "health-check"
use_when = "any deployed service behind a load balancer, orchestrator, or uptime monitor"
anti_pattern = "no health endpoint — the orchestrator has no way to know if the service is ready and will send traffic to broken instances; always expose GET /health"
example = "patterns/health-check.cln"

[[ai.patterns]]
name = "outbound-webhook"
use_when = "your service needs to notify external systems when events occur (payment completed, order shipped, user created)"
anti_pattern = "calling http.post inline in the handler — if the call fails the request fails; send webhook calls from a background job with retry, and always sign the payload with HMAC"
example = "patterns/outbound-webhook.cln"

[[ai.patterns]]
name = "live-feed-realtime"
use_when = "browser needs real-time updates — two-way (LIVE) or server-push (FEED)"
anti_pattern = "polling the server with repeated GET requests on a timer — use LIVE for two-way connections, FEED for one-way server push"
example = "patterns/live-feed-realtime.cln"

[build]
built_with_compiler = "0.33.142"
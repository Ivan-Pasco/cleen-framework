[plugin]
name = "frame.client"
version = "1.2.5"
description = "Client-side communication plugin - HTTP API calls, WebSocket live connections, SSE feeds, and declarative blocks (load:, form:, send:). v1.2.5: Plugin Contracts v3 typed-emission migration — atomic switch from v1 string emission to v3 typed AST emission. All bridge functions carry hosts = [\"browser\"]; compiler enforces BRIDGE-HOST-MISMATCH at compile time for server-mode builds. See foundation/spec/plugins/contracts/typed-emission.md."
author = "Clean Language Team"
license = "MIT"

[compatibility]
min_compiler_version = "0.30.412"
# Plugin Contracts v2 — runtime-abi.md §4. ABI version stamped into WASM at
# compile time when built with --target=plugin; loader verifies it when
# present. "1.0.0" is the initial declared value per migration.md §1.5.
abi_version = "1.0.0"
# Plugin Contracts v3 — typed-emission.md §2.1.
# Atomic migration: this plugin.wasm is v3-only. No v1 exports are present.
# emission_ops_hash verified against SHA-256 of
# foundation/spec/plugins/contracts/typed-emission-ops.toml (2026-07-01).
# Same hash as frame.locale (v1.0.6) and frame.server (v2.8.0).
expansion_version = "3.0.0"
emission_ops_hash = "60d06836a7068ee66a330e8c26ca59bc47cc44991b4f31d56e95e06c707eeaf0"

[lifecycle]
# Plugin Contracts v3 — lifecycle.md §3.1 + typed-emission.md §7.
# module_helpers_are_roots: api.*, live.*, feed.* aliases are bridge functions
# resolved from [aliases] below; the typed slot emits nothing, but the flag is
# preserved so the BFS treats any future helper emissions as roots.
module_helpers_are_roots = true
# v3 typed variant — emit_module_helpers_typed(ctx, ctx_json) -> integer.
# Returns 0 (no module-scope declarations to emit; aliases handled by [aliases] below).
module_helpers = "emit_module_helpers_typed"

[handles]
blocks = ["load", "form", "send"]

# Plugin Contracts v3 — typed-emission.md §2.1.
# expand_block_typed is the single v3 entry point for all blocks.
# version = 3 is required on every block when expansion_version = "3.0.0".
[blocks]
load = { expand = "expand_block_typed", version = 3 }
form = { expand = "expand_block_typed", version = 3 }
send = { expand = "expand_block_typed", version = 3 }

[exports]
# v1 `expand` entry is NOT listed here — v3-only plugin.wasm has no v1 exports.
# The compiler dispatches to expand_block_typed via [blocks] entries.
get_keywords = "get_keywords"

# Bridge function declarations
#
# Plugin Contracts v2 — foundation/spec/plugins/contracts/bridge-host-classes.md §2.
# Every bridge in frame.client is browser-only. The `api.*`, `live.*`, and
# `feed.*` namespaces are explicit replacements for the browser-side primitives
# (fetch, WebSocket, EventSource); they have no meaning on the server. Tag
# every entry `hosts = ["browser"]` so server-mode builds that mistakenly pull
# them in fail with a clean BRIDGE-HOST-MISMATCH instead of a runtime LinkError.
#
# Per typed-emission.md §2.3 and migration.md §1.5: the typed-emission sandbox
# bridges (_emit_function, _stmt_call, _expr_string_lit, etc.) are NOT declared
# here — they are provided exclusively inside the compiler's sandbox, not through
# the host bridge layer.
[bridge]
functions = [
  # ========== API: HTTP Requests ==========
  { name = "_api_get", params = ["string", "string"], returns = "integer", description = "GET request: url, response handler name (exported function)", expand_strings = true, hosts = ["browser"] },
  { name = "_api_post", params = ["string", "string", "string"], returns = "integer", description = "POST request: url, body, response handler name", expand_strings = true, hosts = ["browser"] },
  { name = "_api_put", params = ["string", "string", "string"], returns = "integer", description = "PUT request: url, body, response handler name", expand_strings = true, hosts = ["browser"] },
  { name = "_api_patch", params = ["string", "string", "string"], returns = "integer", description = "PATCH request: url, body, response handler name", expand_strings = true, hosts = ["browser"] },
  { name = "_api_delete", params = ["string", "string"], returns = "integer", description = "DELETE request: url, response handler name", expand_strings = true, hosts = ["browser"] },
  { name = "_api_header", params = ["string", "string"], returns = "integer", description = "Set header for next request: name, value", expand_strings = true, hosts = ["browser"] },
  { name = "_api_timeout", params = ["integer"], returns = "integer", description = "Set timeout in ms for next request", hosts = ["browser"] },
  { name = "_api_auth", params = ["string", "string"], returns = "integer", description = "Set auth for all requests: scheme (bearer/basic), credential", expand_strings = true, hosts = ["browser"] },
  { name = "_api_clearAuth", params = [], returns = "integer", description = "Clear stored auth credentials", hosts = ["browser"] },
  { name = "_api_submit", params = ["string", "string", "string", "string"], returns = "integer", description = "Collect form JSON + send: form selector, url, method, response handler name", expand_strings = true, hosts = ["browser"] },

  # ========== API: Response Context ==========
  { name = "_api_status", params = [], returns = "integer", description = "HTTP status code (0 = network error)", hosts = ["browser"] },
  { name = "_api_body", params = [], returns = "string", description = "Response body as string", hosts = ["browser"] },
  { name = "_api_ok", params = [], returns = "integer", description = "1 if status 200-299, 0 otherwise", hosts = ["browser"] },
  { name = "_api_json", params = ["string"], returns = "string", description = "Extract value from JSON response via dot-notation path", expand_strings = true, hosts = ["browser"] },
  { name = "_api_responseHeader", params = ["string"], returns = "string", description = "Get response header value", expand_strings = true, hosts = ["browser"] },

  # ========== Live: WebSocket ==========
  { name = "_live_open", params = ["string", "string", "string", "string"], returns = "integer", description = "Open WebSocket: url, onMessage handler name, onClose handler name, onError handler name. Returns connection ID.", expand_strings = true, hosts = ["browser"] },
  { name = "_live_send", params = ["integer", "string"], returns = "integer", description = "Send message: connId, message", expand_strings = true, hosts = ["browser"] },
  { name = "_live_close", params = ["integer"], returns = "integer", description = "Close connection: connId", hosts = ["browser"] },
  { name = "_live_state", params = ["integer"], returns = "string", description = "Connection state: connecting, open, closing, closed", hosts = ["browser"] },

  # ========== Live: WebSocket Context ==========
  { name = "_live_message", params = [], returns = "string", description = "Message data (in onMessage handler)", hosts = ["browser"] },
  { name = "_live_connId", params = [], returns = "integer", description = "Connection ID that triggered this handler", hosts = ["browser"] },
  { name = "_live_closeCode", params = [], returns = "integer", description = "Close code (in onClose handler)", hosts = ["browser"] },
  { name = "_live_closeReason", params = [], returns = "string", description = "Close reason (in onClose handler)", hosts = ["browser"] },
  { name = "_live_error", params = [], returns = "string", description = "Error description (in onError handler)", hosts = ["browser"] },

  # ========== Feed: Server-Sent Events ==========
  { name = "_feed_open", params = ["string", "string", "string"], returns = "integer", description = "Open SSE feed: url, onMessage handler name, onError handler name. Returns connection ID.", expand_strings = true, hosts = ["browser"] },
  { name = "_feed_on", params = ["integer", "string", "string"], returns = "integer", description = "Listen for named event: connId, event name, handler name", expand_strings = true, hosts = ["browser"] },
  { name = "_feed_close", params = ["integer"], returns = "integer", description = "Close feed: connId", hosts = ["browser"] },

  # ========== Feed: SSE Context ==========
  { name = "_feed_data", params = [], returns = "string", description = "Event data", hosts = ["browser"] },
  { name = "_feed_eventType", params = [], returns = "string", description = "Event type name", hosts = ["browser"] },
  { name = "_feed_lastId", params = [], returns = "string", description = "Last event ID", hosts = ["browser"] },
  { name = "_feed_connId", params = [], returns = "integer", description = "Connection ID that triggered this handler", hosts = ["browser"] },
]

[language]
blocks = ["load", "form", "send"]

keywords = [
  { name = "api", description = "HTTP API client namespace", context = "namespace" },
  { name = "live", description = "WebSocket live connection namespace", context = "namespace" },
  { name = "feed", description = "Server-Sent Events feed namespace", context = "namespace" },
  { name = "load", description = "Declarative page-level client data fetching block — fetches data from APIs when the page loads in the browser", context = "block" },
  { name = "form", description = "Declarative form wiring — generates field state, submit handler, and loading/error state", context = "block" },
  { name = "send", description = "Declarative single-action mutation block — generates <name>Pending, <name>Success, <name>Error state and a void <name>() function for delete, archive, toggle, or any fire-and-check API call", context = "block" },
  { name = "from", description = "URL source for a load: declaration", context = "load-keyword" },
  { name = "at", description = "JSON path to extract from response", context = "load-keyword" },
  { name = "required", description = "Marks a form field as required — validated before submit", context = "form-keyword" },
  { name = "optional", description = "Marks a form field as optional (default)", context = "form-keyword" },
  { name = "with", description = "Lists module-level variables to serialize into the send: request body (post/patch only)", context = "send-keyword" },
]

types = []

functions = [
  # API request functions — use 'later result = api.get(url)' to suspend until response arrives
  { name = "api.get", signature = "later result = api.get(url)", description = "GET request. Suspends until response arrives. Returns ApiResponse." },
  { name = "api.post", signature = "later result = api.post(url, body)", description = "POST with JSON body. Returns ApiResponse." },
  { name = "api.put", signature = "later result = api.put(url, body)", description = "PUT with JSON body. Returns ApiResponse." },
  { name = "api.patch", signature = "later result = api.patch(url, body)", description = "PATCH with JSON body. Returns ApiResponse." },
  { name = "api.delete", signature = "later result = api.delete(url)", description = "DELETE request. Returns ApiResponse." },
  { name = "api.submit", signature = "later result = api.submit(formSelector, url, method)", description = "Collect form fields as JSON and send. Returns ApiResponse." },
  # Request configuration (call before the request)
  { name = "api.header", signature = "api.header(name, value)", description = "Set header for next request only" },
  { name = "api.timeout", signature = "api.timeout(ms)", description = "Set timeout for next request in ms" },
  { name = "api.auth", signature = "api.auth(scheme, credential)", description = "Set auth for ALL subsequent requests (bearer or basic). Persists until api.clearAuth()." },
  { name = "api.clearAuth", signature = "api.clearAuth()", description = "Clear stored auth credentials" },
  # ApiResponse properties — read on 'result' after 'later' resolves
  { name = "result.ok", signature = "result.ok", description = "boolean — true if HTTP status 200-299" },
  { name = "result.status", signature = "result.status", description = "integer — HTTP status code (0 = network error)" },
  { name = "result.body", signature = "result.body", description = "string — response body" },
  { name = "result.json", signature = "result.json(path)", description = "Extract value from JSON body via dot-notation path. Returns any." },
  { name = "result.header", signature = "result.header(name)", description = "Get response header value by name" },
  # Live
  { name = "live.open", signature = "live.open(url, onMessageName, onCloseName, onErrorName)", description = "Open WebSocket connection (handlers are exported function names), returns connection ID" },
  { name = "live.send", signature = "live.send(connId, message)", description = "Send message on connection" },
  { name = "live.close", signature = "live.close(connId)", description = "Close connection" },
  { name = "live.state", signature = "live.state(connId)", description = "Get connection state" },
  { name = "live.message", signature = "live.message()", description = "Message data (in handler)" },
  { name = "live.connId", signature = "live.connId()", description = "Connection ID (in handler)" },
  { name = "live.closeCode", signature = "live.closeCode()", description = "Close code (in handler)" },
  { name = "live.closeReason", signature = "live.closeReason()", description = "Close reason (in handler)" },
  { name = "live.error", signature = "live.error()", description = "Error message (in handler)" },
  # Feed
  { name = "feed.open", signature = "feed.open(url, onMessageName, onErrorName)", description = "Open SSE feed (handlers are exported function names), returns connection ID" },
  { name = "feed.on", signature = "feed.on(connId, eventName, handlerName)", description = "Listen for named event type (handler is exported function name)" },
  { name = "feed.close", signature = "feed.close(connId)", description = "Close feed" },
  { name = "feed.data", signature = "feed.data()", description = "Event data (in handler)" },
  { name = "feed.eventType", signature = "feed.eventType()", description = "Event type name (in handler)" },
  { name = "feed.lastId", signature = "feed.lastId()", description = "Last event ID (in handler)" },
  { name = "feed.connId", signature = "feed.connId()", description = "Connection ID (in handler)" },
]

completions = [
  { trigger = "load:", insert = "load:\n\t${1:data} from \"${2:/api/endpoint}\" at \"${3:data}\"" },
  { trigger = "form:", insert = "form: post \"${1:/api/endpoint}\"\n\t${2:field} required\n\ton success: clear" },
  { trigger = "send:", insert = "send: ${1:actionName} ${2:delete} \"${3:/api/endpoint}\"\n\ton success: emit \"${4:onDone}\"" },
  { trigger = "api.get", insert = "later ${1:result} = api.get(\"${2:/api/}\")" },
  { trigger = "api.post", insert = "later ${1:result} = api.post(\"${2:/api/}\", ${3:body})" },
  { trigger = "api.put", insert = "later ${1:result} = api.put(\"${2:/api/}\", ${3:body})" },
  { trigger = "api.patch", insert = "later ${1:result} = api.patch(\"${2:/api/}\", ${3:body})" },
  { trigger = "api.delete", insert = "later ${1:result} = api.delete(\"${2:/api/}\")" },
  { trigger = "api.submit", insert = "later ${1:result} = api.submit(\"${2:#form}\", \"${3:/api/}\", \"POST\")" },
  { trigger = "api.auth", insert = "api.auth(\"bearer\", ${1:token})" },
  { trigger = "live.open", insert = "live.open(\"${1:wss://}\", \"${2:onMessage}\", \"${3:onClose}\", \"${4:onError}\")" },
  { trigger = "live.send", insert = "live.send(${1:conn}, ${2:message})" },
  { trigger = "feed.open", insert = "feed.open(\"${1:/api/stream}\", \"${2:onMessage}\", \"${3:onError}\")" },
  { trigger = "feed.on", insert = "feed.on(${1:conn}, \"${2:event}\", \"${3:onEvent}\")" },
]

[ai]
description = "Client-side communication plugin. Use api.* with 'later result = api.get(url)' for HTTP requests, live.* for WebSocket connections, feed.* for SSE streams. Never use JavaScript fetch/XHR/WebSocket/EventSource. Use load: for declarative page-level data fetching — it generates module-level state and a start: block that fetches from APIs when the page loads. Use form: in a .client.cln companion file for page-level form submission — it generates field state variables, a submitting flag, formError, formSuccess, and a submit() handler. Use send: in a .client.cln companion file for single-action mutations (delete, archive, toggle, publish) — it generates <name>Pending, <name>Success, <name>Error state and a void <name>() function. Add 'with: field1 field2' inside a send: block to serialize module-level variables into the request body. Use {varName} in a send: URL to interpolate a module-level variable into the path."
constraints = [
  "Never use JavaScript fetch(), XMLHttpRequest, or $.ajax() — use api.* for all HTTP calls",
  "Never write <script> tags with WebSocket or EventSource — use live.* and feed.* instead",
  "api.* uses 'later result = api.get(url)' — NEVER pass a handler name to api.get/post/put/patch/delete/submit",
  "live.* and feed.* still use named handler strings — they are persistent streams, not one-shot requests",
  "frame.client runs in the browser WASM context — never call db.*, http.*, or any server-only functions",
  "api.auth(scheme, credential) persists for all subsequent requests — call once per session, not per request",
  "Check result.ok before reading result.json() — always handle the error case to avoid silent failures",
  "Use form: in a .client.cln companion file for page-level form submission — it generates field state, submitting flag, formError, formSuccess, and a submit() handler",
  "Use send: in a .client.cln companion file for single-action mutations — it generates <name>Pending, <name>Success, <name>Error and a void <name>() function; use with: to include body fields; use {varName} in the URL for path parameters",
  "send: URL placeholders use {varName} (resolves module-level variables) — NOT {query.X} which is only for load:",
]

[[ai.patterns]]
name = "crud-form"
use_when = "a component creates or updates a record via an API call with form data"
anti_pattern = "calling fetch() or XMLHttpRequest directly, passing a handler name to api.post, or manually serializing form fields — use api.submit() which collects the form as JSON automatically"
example = "patterns/crud-form.cln"

[[ai.patterns]]
name = "auth-flow"
use_when = "a component authenticates and must persist credentials for subsequent API calls"
anti_pattern = "storing the token in a JS variable, localStorage, or passing it manually in every request header — call api.auth('bearer', token) once and it applies to all subsequent api.* calls automatically"
example = "patterns/auth-flow.cln"

[[ai.patterns]]
name = "live-notifications"
use_when = "the app needs real-time server-to-client push: chat, presence, live counters, or collaborative editing"
anti_pattern = "writing new WebSocket(...) in a <script> tag, polling with repeated api.get() calls, or storing the connection object in JS — use live.open() with named handler functions and store the connId in state"
example = "patterns/live-notifications.cln"

[[ai.patterns]]
name = "sse-progress"
use_when = "a component tracks progress of a long-running server operation: file import, batch job, report generation"
anti_pattern = "polling with repeated api.get() calls every N seconds, or writing new EventSource(...) in a <script> tag — use feed.open() which handles reconnection and named events automatically"
example = "patterns/sse-progress.cln"

[[ai.patterns]]
name = "api-error-handling"
use_when = "any component that makes API calls and must show user-facing error messages or handle network failures"
anti_pattern = "ignoring result.ok and assuming success, showing the raw result.body as an error message, or crashing when result.status == 0 (network error) — always check result.ok first, then branch on result.status for specific cases"
example = "patterns/api-error-handling.cln"

[[ai.patterns]]
name = "send-mutation"
use_when = "a button triggers a single API mutation — delete, archive, publish, toggle — and you need pending/success/error state without a full manual handler"
anti_pattern = "writing a manual void deleteTask() handler for every button — the pending flag, double-click guard, ok check, and error string are identical every time; use send: in a .client.cln companion file instead; use with: to serialize body fields; use {varName} in the URL for path parameters"
example = "patterns/send-mutation.cln"

[paths]
owns = ["app/ui/web/client"]
auto_create = true
patterns = ["*.cln"]
implicit_import = false

[templates]
files = []

[enforcement]
severity = "warn"
restricted_functions = []
required_blocks = []
block_folder_rules = []

[aliases]
functions = [
  # api.* aliases — browser-only bridge functions
  { clean_name = "api.get", bridge_name = "_api_get" },
  { clean_name = "api.post", bridge_name = "_api_post" },
  { clean_name = "api.put", bridge_name = "_api_put" },
  { clean_name = "api.patch", bridge_name = "_api_patch" },
  { clean_name = "api.delete", bridge_name = "_api_delete" },
  { clean_name = "api.header", bridge_name = "_api_header" },
  { clean_name = "api.timeout", bridge_name = "_api_timeout" },
  { clean_name = "api.auth", bridge_name = "_api_auth" },
  { clean_name = "api.clearAuth", bridge_name = "_api_clearAuth" },
  { clean_name = "api.submit", bridge_name = "_api_submit" },
  { clean_name = "api.status", bridge_name = "_api_status" },
  { clean_name = "api.body", bridge_name = "_api_body" },
  { clean_name = "api.ok", bridge_name = "_api_ok" },
  { clean_name = "api.json", bridge_name = "_api_json" },
  { clean_name = "api.responseHeader", bridge_name = "_api_responseHeader" },
  # live.* aliases
  { clean_name = "live.open", bridge_name = "_live_open" },
  { clean_name = "live.send", bridge_name = "_live_send" },
  { clean_name = "live.close", bridge_name = "_live_close" },
  { clean_name = "live.state", bridge_name = "_live_state" },
  { clean_name = "live.message", bridge_name = "_live_message" },
  { clean_name = "live.connId", bridge_name = "_live_connId" },
  { clean_name = "live.closeCode", bridge_name = "_live_closeCode" },
  { clean_name = "live.closeReason", bridge_name = "_live_closeReason" },
  { clean_name = "live.error", bridge_name = "_live_error" },
  # feed.* aliases
  { clean_name = "feed.open", bridge_name = "_feed_open" },
  { clean_name = "feed.on", bridge_name = "_feed_on" },
  { clean_name = "feed.close", bridge_name = "_feed_close" },
  { clean_name = "feed.data", bridge_name = "_feed_data" },
  { clean_name = "feed.eventType", bridge_name = "_feed_eventType" },
  { clean_name = "feed.lastId", bridge_name = "_feed_lastId" },
  { clean_name = "feed.connId", bridge_name = "_feed_connId" },
]

[build]
built_with_compiler = "0.33.153"
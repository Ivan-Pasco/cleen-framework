<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System - Clean Language Canvas Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 { color: #ffd700; margin-bottom: 10px; font-size: 24px; letter-spacing: 2px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
    #canvas-container canvas {
      border: 1px solid #1a1a3a;
      border-radius: 8px;
    }
    .controls { margin-top: 15px; color: #555; font-size: 13px; }
    .controls span { color: #ffd700; }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #4ecdc4;
      font-family: monospace;
      font-size: 13px;
    }
    #error { color: #ff6b6b; margin-top: 20px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>SOLAR SYSTEM</h1>
  <p class="subtitle">Clean Language + WebAssembly Canvas Demo</p>
  <div id="canvas-container"></div>
  <p class="controls"><span>Move mouse</span> near planets to interact</p>
  <div id="status">Loading...</div>
  <div id="error"></div>

  <script src="../canvas-bridge.js"></script>
  <script>
    async function loadAndRun() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');

      try {
        statusEl.textContent = 'Initializing...';
        const bridge = new CanvasBridge();
        const memory = new WebAssembly.Memory({ initial: 256, maximum: 512 });
        const bridgeImports = bridge.getImports(memory);

        let heapPtr = 1024 * 1024;
        let heapBase = heapPtr;
        let activeMemory = memory;

        function malloc(size) {
          const aligned = (heapPtr + 7) & ~7;
          heapPtr = aligned + size;
          return aligned;
        }

        function resetHeap() {
          heapPtr = heapBase;
        }

        function writeString(str) {
          const bytes = new TextEncoder().encode(str);
          const ptr = malloc(bytes.length + 4);
          const view = new DataView(activeMemory.buffer);
          view.setInt32(ptr, bytes.length, true);
          new Uint8Array(activeMemory.buffer, ptr + 4, bytes.length).set(bytes);
          return ptr;
        }

        const stdlib = {
          print: (ptr) => console.log(bridge.readString(ptr, 1024)),
          printl: (ptr) => console.log(bridge.readString(ptr, 1024)),
          input: (ptr) => writeString(prompt(bridge.readString(ptr, 1024)) || ''),
          input_integer: (ptr) => parseInt(prompt(bridge.readString(ptr, 1024)) || '0'),
          input_float: (ptr) => parseFloat(prompt(bridge.readString(ptr, 1024)) || '0'),
          input_yesno: (ptr) => (prompt(bridge.readString(ptr, 1024)) || '').toLowerCase().startsWith('y') ? 1 : 0,
          input_range: (ptr, min, max) => Math.min(max, Math.max(min, parseInt(prompt(bridge.readString(ptr, 1024)) || '0'))),

          float_to_string: (f) => writeString(f.toString()),
          string_to_float: (ptr) => parseFloat(bridge.readString(ptr, 1024)) || 0,
          'string.concat': (a, b) => writeString(bridge.readString(a, 1024) + bridge.readString(b, 1024)),
          'string.split': (ptr, delim) => 0,
          string_trim: (ptr) => writeString(bridge.readString(ptr, 1024).trim()),
          string_trim_start: (ptr) => writeString(bridge.readString(ptr, 1024).trimStart()),
          string_trim_end: (ptr) => writeString(bridge.readString(ptr, 1024).trimEnd()),
          string_compare: (a, b) => bridge.readString(a, 1024).localeCompare(bridge.readString(b, 1024)),
          string_replace: (ptr, from, to) => writeString(bridge.readString(ptr, 1024).replace(bridge.readString(from, 1024), bridge.readString(to, 1024))),

          http_get: () => 0, http_post: () => 0, http_put: () => 0, http_patch: () => 0,
          http_delete: () => 0, http_head: () => 0, http_options: () => 0,
          http_get_with_headers: () => 0, http_post_with_headers: () => 0,
          http_post_json: () => 0, http_put_json: () => 0, http_patch_json: () => 0,
          http_post_form: () => 0, http_set_user_agent: () => 0, http_set_timeout: () => 0,
          http_set_max_redirects: () => 0, http_enable_cookies: () => 0,
          http_get_response_code: () => 0, http_get_response_headers: () => 0,
          http_encode_url: (ptr) => ptr, http_decode_url: (ptr) => ptr, http_build_query: () => 0,

          // Server/auth stubs (not used in browser canvas apps)
          _http_route: () => 0, _http_listen: () => 0,
          _req_param: () => 0, _req_query: () => 0, _req_body: () => 0,
          _req_header: () => 0, _req_method: () => 0, _req_path: () => 0, _req_cookie: () => 0,
          _http_route_protected: () => 0, _http_set_header: () => 0,
          _session_create: () => 0, _session_get: () => 0, _session_destroy: () => 0, _session_set_cookie: () => 0,
          _auth_get_session: () => 0, _auth_require_auth: () => 0, _auth_require_role: () => 0,
          _auth_can: () => 0, _auth_has_any_role: () => 0,
          _db_query: () => 0, _db_execute: () => 0,

          file_write: () => 0, file_read: () => 0, file_exists: () => 0,
          file_delete: () => 0, file_append: () => 0,

          string_trim: (ptr) => ptr, string_trim_start: (ptr) => ptr, string_trim_end: (ptr) => ptr,

          math_sin: Math.sin, math_cos: Math.cos, math_tan: Math.tan,
          math_asin: Math.asin, math_acos: Math.acos, math_atan: Math.atan,
          math_atan2: Math.atan2, math_sinh: Math.sinh, math_cosh: Math.cosh,
          math_tanh: Math.tanh, math_sqrt: Math.sqrt, math_cbrt: Math.cbrt,
          math_pow: Math.pow, math_exp: Math.exp, math_exp2: (x) => Math.pow(2, x),
          math_log: Math.log, math_ln: Math.log, math_log10: Math.log10, math_log2: Math.log2,
          math_floor: Math.floor, math_ceil: Math.ceil, math_round: Math.round,
          math_trunc: Math.trunc, math_abs: Math.abs, math_sign: Math.sign,
          math_min: Math.min, math_max: Math.max, math_random: Math.random,

          _alloc: (size) => malloc(size),
          _alloc_string: (size) => malloc(size + 4),
        };

        const imports = {
          env: {
            memory: memory,
            ...stdlib,
            ...bridgeImports.env,
          },
          memory_runtime: {
            mem_alloc: (size) => malloc(size),
            mem_retain: (ptr) => ptr,
            mem_release: (ptr) => {},
            mem_scope_push: () => {},
            mem_scope_pop: () => {},
          }
        };

        statusEl.textContent = 'Loading WASM...';
        const response = await fetch('solar-system.wasm');
        const wasmBytes = await response.arrayBuffer();
        statusEl.textContent = `Instantiating (${wasmBytes.byteLength} bytes)...`;

        const { instance } = await WebAssembly.instantiate(wasmBytes, imports);
        bridge.setWasmInstance(instance);

        if (instance.exports.memory) {
          bridge.memory = instance.exports.memory;
          activeMemory = instance.exports.memory;
          const memSize = activeMemory.buffer.byteLength;
          heapPtr = Math.floor(memSize / 2);
          heapBase = heapPtr;
        }

        const originalFrameCallback = instance.exports._frame_callback;
        if (originalFrameCallback) {
          instance.exports._frame_callback = function(canvasId) {
            resetHeap();
            return originalFrameCallback(canvasId);
          };
        }

        statusEl.textContent = 'Starting...';
        if (instance.exports._start) instance.exports._start();
        else if (instance.exports.start) instance.exports.start();

        statusEl.textContent = 'Running';

        document.addEventListener('keydown', (e) => bridge.keysDown.add(e.key));
        document.addEventListener('keyup', (e) => bridge.keysDown.delete(e.key));

        setInterval(() => { statusEl.textContent = `FPS: ${bridge.fps}`; }, 500);

      } catch (error) {
        console.error('[WASM] Error:', error);
        statusEl.textContent = 'Error';
        errorEl.textContent = error.message;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAndRun);
  </script>
</body>
</html>

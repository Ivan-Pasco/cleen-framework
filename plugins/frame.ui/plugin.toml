  { name = "_ui_blur", params = ["string"], returns = "void", description = "Call blur() on first element matching selector", expand_strings = true, signature = "_ui_blur(selector)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_ui_get_focus", params = [], returns = "string", description = "Return CSS selector path of currently focused element, or empty string if body", signature = "_ui_get_focus() -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_ui_focus_trap", params = ["string"], returns = "integer", description = "Trap Tab/Shift+Tab focus within container matching selector; returns trap ID", expand_strings = true, signature = "_ui_focus_trap(selector)", hosts = ["browser"] },
  { name = "_ui_focus_trap_release", params = ["integer"], returns = "void", description = "Release focus trap by ID and restore previously focused element", signature = "_ui_focus_trap_release(id)", hosts = ["browser"] },

  # Browser storage
  { name = "_storage_local_get", params = ["string"], returns = "string", description = "Get value from localStorage by key", expand_strings = true, signature = "_storage_local_get(key) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
  { name = "_storage_local_set", params = ["string", "string"], returns = "void", description = "Set key-value pair in localStorage", expand_strings = true, signature = "_storage_local_set(key, value)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_local_remove", params = ["string"], returns = "void", description = "Remove key from localStorage", expand_strings = true, signature = "_storage_local_remove(key)", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_local_clear", params = [], returns = "void", description = "Clear all entries in localStorage", signature = "_storage_local_clear()", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub" },
  { name = "_storage_session_get", params = ["string"], returns = "string", description = "Get value from sessionStorage by key", expand_strings = true, signature = "_storage_session_get(key) -> string", hosts = ["browser", "server"], browser_impl = "real", server_impl = "stub", server_stub = { returns = "\"\"" } },
